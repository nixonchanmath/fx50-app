  document.getElementById('eimportcancel').onclick = () => { box.hidden = true; };
  confirm.onclick = () => {
    const idx = Number(slot.value);
    if (S.progs[idx] && confirm.dataset.armed !== String(idx)) {
      confirm.dataset.armed = String(idx);
      confirm.textContent = `確認取代 P${idx + 1}（其餘三區保留）`;
      return;
    }
    try {
      applyProgramImport(records[Number(pick.value)], idx); box.hidden = true;
      editorMsg(`已載入 P${idx + 1}；其餘程式區保留。${S.saveOk ? '已儲存，按「執行」試行。' : '瀏覽器儲存失敗，離開前請匯出檔案。'}`, 'info');
    } catch (e) { editorMsg(`未有載入：${e.kind || e.message}`); }
  };
  const all = records.length === 4 ? document.getElementById('eimportall') : null;
  if (all) all.onclick = () => {
    if (all.dataset.armed !== '1') { all.dataset.armed = '1'; all.textContent = '再按一次確認取代全部四區'; return; }
    try {
      const progs = records.map(p => normalize(p.src));
      records.forEach((p, i) => { if (progs[i].trim()) {
        if (!MODE_READY[p.mode]) throw new Error(`${p.mode} 模式尚未支援`);
        compile(progs[i]);
      } });
      if (progs.reduce((n, p) => n + byteCount(p), 0) > PROGRAM_BYTES) throw new Error('四區總容量超出限制');
      if (S.run) endRun();
      const previous = programSnapshot();
      S.progs = progs; S.pmodes = records.map(p => p.mode);
      saveProgs(); syncEditor(); rememberProgramReplacement(previous, '回復四區備份'); box.hidden = true;
      editorMsg(S.saveOk ? '已回復四區備份。' : '已回復，但瀏覽器儲存失敗；離開前請匯出檔案。', 'info');
    } catch (e) { editorMsg(`未有更改：${e.kind || e.message}`); }
  };
  preview();
}

// Tokens that must be deleted as one unit, longest first.
const TOKENS = [...SCI_NAMES,'sinh⁻¹(', 'cosh⁻¹(', 'tanh⁻¹(', 'sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(',
  'ClrMemory', 'ClrStat', 'WhileEnd', 'FreqOff', 'FreqOn', 'IfEnd', 'While', 'Break',
  'sinh(', 'cosh(', 'tanh(', '▸a+bi', '▸r∠θ', 'Conjg(', 'Then', 'Else', 'Next', 'Step',
  'Goto', 'Lbl', 'For', 'To', 'If', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', 'e^(', '10^(',
  '³√(', '√(', 'Abs(', 'Rnd(', 'Pol(', 'Rec(', 'arg(', 'Ran#', 'Ans', 'nPr', 'nCr',
  'ˣ√', '⁻¹', 'Deg', 'Rad', 'Gra', 'Fix', 'Sci', 'Norm', 'DT'];

/** A keypad press while editing a program. Returns true if it was consumed. */
function editorKey(id, sh, al) {
  if (id === 'MODE' || id === 'PROG' || id === 'ON' || id === 'FMLA') return false;
  const ta = document.getElementById('ptext');
  if (!ta) return false;

  if (id === 'D7' && sh) { S.menu = menuConst(true); return true; }
  if (id === 'EXE') { insertAtCursor(':'); return true; }   // EXE types the separator
  if (id === 'AC') return false; // the calculator's AC closes the editor
  if (id === 'DEL') {
    const a = ta.selectionStart ?? ta.value.length;
    if (!a) return true;
    const before = ta.value.slice(0, a);
    const tok = TOKENS.find(t => before.endsWith(t)) || before.slice(-1);
    ta.value = before.slice(0, before.length - tok.length) + ta.value.slice(a);
    ta.selectionStart = ta.selectionEnd = a - tok.length;
    S.progs[S.psel] = normalize(ta.value);
    saveProgs(); updateCounts(); paintEditor();
    return true;
  }
  if (id === 'HYP') { S.hyp = sh ? 2 : 1; return true; }
  if ((id === 'SIN' || id === 'COS' || id === 'TAN') && S.hyp && !al) {
    const t = HYP[id][S.hyp - 1]; S.hyp = 0; insertAtCursor(t); return true;
  }
  if (id === 'RCL' || id === 'ENG' || id === 'ANS' || id === 'MPLUS') {
    // STO arrow / i / Ans / M all have plain program spellings
    if (id === 'RCL' && sh) { insertAtCursor('→'); return true; }
    if (id === 'ENG' && (al || S.pmodes[S.psel] === 'CMPLX')) { insertAtCursor('i'); return true; }
    if (id === 'ANS') { insertAtCursor(sh ? '' : 'Ans'); return true; }
    // ALPHA M = the variable; plain M+ / SHIFT M− are program statements
    if (id === 'MPLUS') { insertAtCursor(al ? 'M' : sh ? 'M−' : 'M+'); return true; }
  }
  const tok = tokenFor(id, sh, al);
  if (!tok) return true;                    // swallow keys with no program meaning
  insertAtCursor(tok.d);
  return true;
}

function insertAtCursor(text, caretOffset) {
  if (!text) return;
  const ta = document.getElementById('ptext');
  const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
  ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
  const at = a + (caretOffset == null ? text.length : caretOffset);
  ta.selectionStart = ta.selectionEnd = at;
  S.progs[S.psel] = normalize(ta.value);
  ta.focus(); saveProgs(); updateCounts(); paintEditor();
}

// Tokens that contain letters but are not variables — matched first so the
// A in "Ans" or the D in "Deg" never gets coloured.
const HL_SKIP = [...SCI_NAMES,'sinh⁻¹(', 'cosh⁻¹(', 'tanh⁻¹(', 'sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(',
  'ClrMemory', 'ClrStat', 'WhileEnd', 'FreqOff', 'FreqOn', 'IfEnd', 'While', 'Break',
  'sinh(', 'cosh(', 'tanh(', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', 'e^(', '10^(',
  'Conjg(', 'Abs(', 'Rnd(', 'Pol(', 'Rec(', 'arg(', 'Ran#', 'Ans', 'nPr', 'nCr',
  'Then', 'Else', 'Next', 'Step', 'Goto', 'Lbl', 'For', 'To', 'If',
  'Deg', 'Rad', 'Gra', 'Fix', 'Sci', 'Norm', 'Dec', 'Hex', 'Bin', 'Oct', 'DT',
  '▸a+bi', '▸r∠θ'];
const VAR_PALETTE = ['#ff6b6b', '#51cf66', '#4dabf7', '#ffa94d', '#cc5de8',
  '#22d3ee', '#f783ac', '#a9e34b', '#ffd43b', '#63e6be'];

/** Colour each variable by which assignment it currently belongs to, so a
 *  reused letter is easy to follow through a long program. */
function highlight(src) {
  let out = '', i = 0, next = 0;
  const colour = {};
  while (i < src.length) {
    const rest = src.slice(i);
    const skip = HL_SKIP.find(k => rest.startsWith(k));
    if (skip) { out += esc(skip); i += skip.length; continue; }
    const c = src[i];
    if (/[A-DXYM]/.test(c)) {
      if (/→\s*$/.test(src.slice(0, i))) {            // this is an assignment
        colour[c] = VAR_PALETTE[next++ % VAR_PALETTE.length];
      }
      out += `<span style="color:${colour[c] || '#9aa2ad'}">${c}</span>`;
      i++; continue;
    }
    if (c === '◢' || c === '⇒' || c === ':') { out += `<b style="color:#f2b134">${esc(c)}</b>`; i++; continue; }
    out += esc(c); i++;
  }
  return out + '\n';
}

function paintEditor() {
  const ta = document.getElementById('ptext'), hl = document.getElementById('phl');
  if (!ta || !hl) return;
  hl.innerHTML = highlight(ta.value || '');
  hl.scrollTop = ta.scrollTop;
  // The coloured text is a layer UNDER a transparent textarea, so the two have
  // to wrap at exactly the same column. When the textarea grows a scrollbar it
  // loses that much content width and the layers drift apart — you then see the
  // text in one place and the caret lands in another (Nixon: "can only
  // highlight the left"). Give the layer the same gutter. Zero on platforms
  // with overlay scrollbars, so this costs nothing there.
  const bar = ta.offsetWidth - ta.clientWidth;
  hl.style.paddingRight = (9 + bar) + 'px';
}

function updateTeachingGuide() {
  const box = document.getElementById('eguide'); if (!box) return;
  const p = teachingMatch(S.progs[S.psel]);
  box.hidden = !p;
  box.innerHTML = p ? `<details><summary>${esc(p.name)} · 用法與例子</summary><p>${esc(p.note)}</p><p><b>輸入：</b>${esc(p.guide.inputs)}</p><p><b>輸出：</b>${esc(p.guide.outputs)}</p><p><b>試一題：</b>${esc(p.guide.example)}</p><p>${esc(p.guide.caution)}</p></details>` : '';
}
function updateCounts() {
  updateTeachingGuide();
  const used = S.progs.map(p => (p ? byteCount(p) : 0));
  const total = used.reduce((a, b) => a + b, 0);
  document.querySelectorAll('.etab').forEach((t, i) => {
    t.className = 'etab' + (i === S.psel ? ' on' : '');
    t.setAttribute('aria-pressed', String(i === S.psel)); t.setAttribute('aria-label', `P${i+1}，${used[i]} bytes，${S.pmodes[i]}`);
    t.innerHTML = `P${i + 1}<small>${used[i]} B · ${S.pmodes[i]}</small>`;
  });
  document.querySelectorAll('.emode button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === S.pmodes[S.psel]);
  });
  const c = document.getElementById('ecnt');
  c.className = 'cnt' + (total > PROGRAM_BYTES ? ' over' : '');
  c.innerHTML = `P${S.psel + 1}：<b>${used[S.psel]}</b> bytes　全部 <b>${total}</b>/${PROGRAM_BYTES}`
    + (total > PROGRAM_BYTES ? '　超出容量！' : `　剩 ${PROGRAM_BYTES - total}`);
}

function syncEditor() {
  const ta = document.getElementById('ptext');
  if (ta) ta.value = S.progs[S.psel] || '';
  updateCounts(); paintEditor();
}
function openEditor() {
  const ed = document.getElementById('editor');
  if (ed) ed.classList.add('on');
  document.getElementById('studio-launch')?.setAttribute('aria-expanded','true');
  syncEditor();
}
function hideEditor() {
  const ed = document.getElementById('editor');
  if (!ed || !ed.classList.contains('on')) return false;
  ed.classList.remove('on');
  document.getElementById('studio-launch')?.setAttribute('aria-expanded','false');
  const ta = document.getElementById('ptext');
  if (ta && ta.blur) ta.blur();
  return true;
}
function closeEditor() {
  if (!hideEditor()) return false;
  // Once the panel is hidden, the next key must operate the calculator.
  if (S.mode === 'PRGM') S.mode = S.ctx.mode = 'COMP';
  return true;
}

// ------------------------------------------------------------- program run
function startRun(idx) {
  // run exactly what the box shows, even if an edit never fired an input event
  const box = document.getElementById('ptext');
  if (box && idx === S.psel && typeof box.value === 'string') S.progs[idx] = normalize(box.value);
  const src = S.progs[idx];
  if (!src || !src.trim()) { S.note = `P${idx + 1} 係空`; return render(); }
  const pm = S.pmodes[idx] || 'COMP';
  if (!MODE_READY[pm]) { S.note = `${pm} 模式未做`; return render(); }
  // hand the keyboard back to the calculator, otherwise typed answers go to the editor
  const ta = document.getElementById('ptext');
  if (ta && ta.blur) ta.blur();
  editorMsg('');
  const prevMode = S.mode;
  try {
    const prog = compile(src);
    S.mode = pm; S.ctx.mode = pm;
    S.run = { gen: runProgram(prog, S.ctx, { tick: RUN_TICK }), mode: null, name: '', srcText: '', prevMode };
    S.runIdx = idx; S.progErrAt = null;
    S.error = null; S.result = null; S.toks = []; S.cur = 0;
    stepRun();
  } catch (e) {
    S.run = null; S.mode = prevMode; S.ctx.mode = prevMode;   // don't strand the machine
    S.error = e.kind || 'Syntax ERROR'; S.showing = 'result';
    progError(e, idx, '編譯唔到');
  }
  render();
}

/** Run a built-in formula on the ordinary program engine, relabelling what the
 *  display shows: the prompts carry the formula's own variable names (a? b? c?),
 *  the dot line keeps the formula title instead of echoing source, and each
 *  answer gets the x= tag at the bottom left (REAL: Nixon's photo of 01). */
function* formulaRun(f, ctx) {
  const gen = runProgram(compile(f.src), ctx);
  const title = fmlaTitle(f.n);
  let send, inIdx = 0;
  for (;;) {
    const r = gen.next(send);
    if (r.done) return r.value;
    send = yield r.value.type === 'input'
      ? { ...r.value, label: f.labels[inIdx++] }
      : { ...r.value, text: title, tag: f.tag };
  }
}

function startFormula(n) {
  const f = fmlaOf(n);
  if (!f || !f.src) { S.fmla = null; newInput(false); S.note = `FMLA ${String(n).padStart(2, '0')} 未做`; return render(); }
  const prevMode = S.mode;
  try {
    S.mode = f.mode; S.ctx.mode = f.mode;
    S.run = { gen: formulaRun(f, S.ctx), mode: null, name: '', label: '', srcText: '',
      prevMode, fmla: f, endText: fmlaTitle(f.n), endTag: f.tag };
    S.runIdx = null; S.fmla = null; S.progErrAt = null;
    S.error = null; S.result = null; S.note = ''; S.toks = []; S.cur = 0;
    S.endStmt = ''; S.endTag = '';
    stepRun();
  } catch (e) {
    S.run = null; S.mode = prevMode; S.ctx.mode = prevMode;
    S.error = e.kind || 'Syntax ERROR'; S.showing = 'result';
  }
  render();
}

/** Keys while the "Formula No.?" chooser is up: two digits pick a formula,
 *  ▲▼ walk the list, EXE runs it, AC / EXIT / FMLA back out. */
function handleFmla(id) {
  if (id === 'SHIFT') { S.shift = !S.shift; return; }
  const sh = S.shift; S.shift = false;
  if (id === 'AC' || id === 'ON' || id === 'FMLA' || id === 'MODE' || (id === 'PROG' && sh)) {
    S.fmla = null; newInput(false); return;
  }
  const f = S.fmla;
  if (/^D[0-9]$/.test(id)) {
    f.typed += id[1];
    if (f.typed.length >= 2) {
      const n = parseInt(f.typed.slice(-2), 10);
      f.typed = '';
      if (n >= 1 && n <= FMLA_MAX) f.n = n;       // out of range: ask again
    }
    return;
  }
  if (id === 'UP' || id === 'DOWN') {
    // nothing picked yet: ▼ starts at the top of the list, ▲ at the bottom
    if (f.n == null) f.n = id === 'DOWN' ? 1 : FMLA_MAX;
    else f.n = (f.n - 1 + (id === 'DOWN' ? 1 : FMLA_MAX - 1)) % FMLA_MAX + 1;
    f.typed = '';
    return;
  }
  if (id === 'EXE' && f.n) startFormula(f.n);
}

function endRun() {
  if (S.run && S.run.slice) clearTimeout(S.run.slice);
  if (S.run && S.run.prevMode) { S.mode = S.run.prevMode; S.ctx.mode = S.run.prevMode; }
  S.run = null;
}

function stepRun(sendValue) {
  try {
    const r = S.run.gen.next(sendValue);
    if (r.done) {
      const v = r.value;
      const fmla = S.run.fmla, endText = S.run.endText, endTag = S.run.endTag;
      // EXE runs the same thing again — a program area, or the same formula
      S.rerun = fmla ? { f: fmla.n } : S.runIdx;
      endRun();
      // The entry line is empty once the program stops — the recording ends on
      // a bare value with nothing on the upper line, even though "5" was the
      // last thing typed at a prompt. This is also what lets EXE re-run: that
      // path requires no pending input.
      S.toks = []; S.cur = 0;
      // stays on the upper line beside the answer: the last statement for a
      // program, the answer's own name for a formula
      S.endStmt = endText || S.ctx.lastStmt || '';
      S.endTag = endTag || '';
      S.result = v ? fmtResult(v, S.ctx) : null;
      S.showIm = !!(S.result && S.result.imFirst);
      S.showing = 'result'; S.note = '';
      return;
    }
    // A slice boundary: nothing happened on the glass, the program simply has
    // more to do. Give the browser its event loop back and carry on, so AC can
    // still stop a program that never reaches a ◢ (Nixon runs those on purpose).
    if (r.value.type === 'tick') {
      S.run.slice = setTimeout(() => {
        if (!S.run) return;
        S.run.slice = null;
        stepRun();
        render();
      }, 0);
      return;
    }
    if (r.value.type === 'input') {
      S.run.mode = 'input'; S.run.name = r.value.name;
      // what the prompt READS (a?) can differ from the memory it writes (A)
      S.run.label = r.value.label || r.value.name;
      S.toks = []; S.cur = 0; S.showing = 'input';
    } else {
      S.run.mode = 'disp';
      S.run.value = r.value.value;
      S.run.dispTag = r.value.tag || '';       // the x= beside a formula's answer
      // The a b/c setting CARRIES ACROSS ◢ steps — it is a display mode, not a
      // per-value one. REAL: in the recording the fraction is still on at the
      // next stop (`MA+D→C` opens straight on `9」4`), while every step that was
      // left on a decimal opens on a decimal. Re⇔Im, by contrast, resets.
      // Keep the whole formatted result, not just the real part: at a ◢ the
      // machine still lets you press SHIFT Re⇔Im to read the imaginary half.
      S.run.res = fmtResult(r.value.value, S.ctx, { noFrac: true });
      S.run.showIm = !!S.run.res.imFirst;
      S.run.srcText = r.value.text || '';        // shown on the upper line
    }
  } catch (e) {
    endRun(); S.error = e.kind || 'Math ERROR'; S.showing = 'result';
    progError(e, S.runIdx ?? S.psel, '執行中止');
  }
}

/** Report a program error and point at the character that caused it.
 *  compile() and run() tag their errors with an offset into the program text
 *  (`pos` / `progPos`), which is what makes this possible. */
function progError(e, idx, phase) {
  const kind = e.kind || 'Syntax ERROR';
  const at = e.progPos ?? e.pos ?? null;
  S.progErrAt = at;
  const src = S.progs[idx] || '';
  let msg = `P${idx + 1} ${phase}：${kind}`;
  if (at != null && at <= src.length) {
    const before = src.slice(0, at);
    const line = before.split('\n').length;
    const col = at - (before.lastIndexOf('\n') + 1);
    const lineText = src.split('\n')[line - 1] ?? '';
    msg += `　第 ${line} 行第 ${col + 1} 個字\n${lineText}\n${' '.repeat(col)}^`;
  } else {
    msg += '　（搵唔到確實位置）';
  }
  editorMsg(msg);
  focusEditorAt(at);
}

/** Put the editor's caret on the offending character. */
function focusEditorAt(at) {
  if (at == null) return;
  const ta = document.getElementById('ptext');
  if (!ta || typeof ta.setSelectionRange !== 'function') return;
  const len = (ta.value || '').length;
  ta.focus();
  ta.setSelectionRange(Math.min(at, len), Math.min(at + 1, len));
}

function editorMsg(text, kind) {
  const el = document.getElementById('emsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? `emsg on${kind === 'info' ? ' info' : ''}` : 'emsg';
}

// ---------------------------------------------------------------- rendering
/** The complex result on screen right now, if any — from a ◢ pause or from a
 *  finished calculation. R⇔I lights for either, whichever half is showing. */
function cxShowing() {
  const r = (S.run && S.run.mode === 'disp') ? S.run.res : S.result;
  return r && r.type === 'cx' ? r : null;
}
const imShowing = () => (S.run && S.run.mode === 'disp') ? S.run.showIm : S.showIm;

/** Which program area the P1–P4 boxes point at: the one running, or the one
 *  the Prog menu is sitting on. */
const progArea = () => S.run ? S.runIdx : ((S.menu && S.menu.prog) ? S.psel : null);

// The exact indicator set, in the machine's own order, read off the self-test's
// all-segments-on pattern (2026-08-09 21:05 recording, SHIFT 7 ON). The ones
// marked `box` are reverse-video on the glass. Note what is NOT here: no INS,
// no separate hyp⁻¹, and no Disp / ▲▼ / ◀▶ — those live on the lines below.
/** The M lamp is lit whenever memory holds something other than zero. M can
 *  hold a COMPLEX value — Nixon's Prog04 parks one there — and a complex value
 *  has no .isZero(), so reading it straight threw a TypeError and took the
 *  whole render with it: the machine froze on the next keystroke. */
function memoryLit() {
  const m = S.ctx.vars.M;
  if (!m) return false;
  return m.isZero ? !m.isZero() : !(m.re.isZero() && m.im.isZero());
}

const SYMS = [
  ['S', () => S.shift, 'box'], ['A', () => S.alpha, 'box'],
  ['hyp', () => S.hyp !== 0], ['M', () => memoryLit()],
  ['STO', () => S.pending === 'sto'], ['RCL', () => S.pending === 'rcl'],
  ['SD', () => S.mode === 'SD'], ['REG', () => S.mode === 'REG'],
  ['CMPLX', () => S.mode === 'CMPLX'],
  // A built-in formula is not a program area, so PRGM stays dark for it
  // (⚠️ assumed, not checked on the machine).
  ['PRGM', () => !!(S.run && !S.run.fmla) || !!(S.menu && S.menu.prog)],
  ['P1', () => progArea() === 0, 'box'], ['P2', () => progArea() === 1, 'box'],
  ['P3', () => progArea() === 2, 'box'], ['P4', () => progArea() === 3, 'box'],
  ['D', () => S.ctx.angle === 'deg', 'box'],
  ['R', () => S.ctx.angle === 'rad', 'box'],
  ['G', () => S.ctx.angle === 'gra', 'box'],
  ['FIX', () => S.ctx.disp.disp === 'fix'], ['SCI', () => S.ctx.disp.disp === 'sci'],
  ['r∠θ', () => S.ctx.cplx === 'r∠θ'],
  ['R⇔I', () => cxShowing() !== null],
];

/** The small label at the bottom-left of the digit line: `a?` while a value is
 *  being asked for, `x=` beside a built-in formula's answer. On the glass it is
 *  one dot cell plus a fixed ? or = segment (REAL: the all-segments photo). */
function lowerTag() {
  if (S.run && S.run.mode === 'input') return `${S.run.label}?`;
  if (S.run && S.run.mode === 'disp') return S.run.dispTag || '';
  if (S.showing === 'result' && S.endTag) return S.endTag;
  return '';
}

function line1() {
  if (S.menu) return { text: S.menu.l1, cur: -1 };
  if (S.fmla) return { text: S.fmla.n ? fmlaTitle(S.fmla.n) : 'Formula No.?', cur: -1 };
  // 'Syntax ERROR' / 'Math ERROR' are words, so they can only live on the dot
  // matrix — the seven-segment line below cannot spell them and stays blank
  // (REAL: Nixon's photos of both errors on the machine).
  if (S.error) return { text: S.error, cur: -1 };
  // At a ◢ the upper line carries the source text of the statement being shown
  // (REAL, 2026-08-09 recording). An `X?` prompt does NOT: there the upper line
  // is the entry line you type into, so fall through to the token rendering.
  if (S.run && S.run.mode === 'disp') return { text: S.run.srcText || '', cur: -1 };
  // A prompt that has not been typed into yet shows nothing at all — not even a
  // cursor. REAL: the recording holds A? blank for 0.6 s, longer than the 0.4 s
  // dark half of a blink, then the cursor appears with the first keystroke.
  if (S.run && S.run.mode === 'input' && !S.toks.length) return { text: '', cur: -1 };
  // A built-in formula NEVER puts the value you are keying in up here — its dot
  // line stays blank the whole way through (Nixon, 2026-09-16). A program does
  // the opposite: there the upper line is the entry line.
  if (S.run && S.run.fmla && S.run.mode === 'input') return { text: '', cur: -1 };
  // A program that has run out leaves its final statement on screen next to
  // the answer, even with no ◢ after it (REAL, fx50-test-Prog1.mov).
  if (S.endStmt && S.showing === 'result') return { text: S.endStmt, cur: -1 };
  if (S.note) return { text: S.note, cur: -1 };
  let text = '', cur = 0;
  S.toks.forEach((t, i) => { if (i === S.cur) cur = text.length; text += t.d; });
  if (S.cur >= S.toks.length) cur = text.length;
  return { text, cur };
}

/** The glass always lights a decimal point after the last integer digit: an
 *  answer of 1 reads `1.`, and a fresh machine reads `0.` (REAL, Nixon's
 *  2026-09-16 photos, confirmed in so many words). A fraction or a ° ' " value
 *  never gets one, and an exponent keeps its own mantissa point. This is a
 *  display rule only — dataset.raw keeps the plain text for tests. */
function withPoint(s) {
  if (!s || /[」°]/.test(s)) return s;
  const i = s.indexOf('×10^');
  const mant = i < 0 ? s : s.slice(0, i);
  if (!/\d/.test(mant) || mant.includes('.')) return s;
  return mant + '.' + (i < 0 ? '' : s.slice(i));
}

function resultText() {
  if (S.error) return '';        // the message is on the upper line
  if (S.menu) return S.menu.l2;
  if (S.fmla) return S.fmla.typed;
  if (S.run && S.run.mode === 'input') {
    // "A?" sits on the left of this same line, and the right keeps showing the
    // variable's CURRENT value the whole time — what you type goes to the upper
    // line, not here (REAL, 2026-08-09 recording: "5" above, "C?  0." below).
    // A formula has no upper line to type into, so there it lands here instead.
    if (S.run.fmla && S.toks.length) return S.toks.map(t => t.d).join('');
    return numText(S.ctx.vars[S.run.name] ?? ZERO);
  }
  if (S.run && S.run.mode === 'disp') {
    // a b/c works on whichever half is on screen
    const part = S.run.res.type === 'cx'
      ? (S.run.showIm ? S.run.value.im : S.run.value.re) : S.run.value;
    if (S.run.asFrac === 'dec') return format(part, S.ctx.disp).mant;
    if (S.run.asFrac) {
      const f = toFraction(part, S.run.asFrac);
      if (f) return (f.sign < 0 ? '-' : '') + (f.mixed ? `${f.int}」${f.num}」${f.den}` : `${f.num}」${f.den}`);
      return format(part, S.ctx.disp).mant;
    }
    return S.run.res.type === 'cx'
      ? (S.run.showIm ? S.run.res.text2 : S.run.res.text) : S.run.res.text;
  }
  if (!S.result) return '0';
  const r = S.result;
  const part = r.type === 'cx' ? (S.showIm ? r.value.im : r.value.re) : r.value;
  if (S.asDms && r.type !== 'cx') { const t = toDms(r.value); return `${t.neg ? '-' : ''}${t.deg}°${t.min}°${t.sec}`; }
  if (S.asFrac === 'dec') return format(part, S.ctx.disp).mant;
  if (S.asFrac !== null) {
    const f = toFraction(part, S.asFrac);
    if (f) return (f.sign < 0 ? '-' : '') + (f.mixed ? `${f.int}」${f.num}」${f.den}` : `${f.num}」${f.den}`);
    return format(part, S.ctx.disp).mant;
  }
  if (r.type === 'cx') return S.showIm ? r.text2 : r.text;
  if (S.engExp) { const g = formatEng(r.value, S.engExp); return `${g.mant}ᴇ${g.exp}`; }
  return r.text;
}

// ---------------------------------------------------- the 5x7 dot matrix line
const INK = '#141a12', PAPER = '#bcc4b3';
// A real LCD shows every segment it owns, lit or not: the whole field sits in
// the glass as a faint grey ghost. Nixon pushed the exposure on a photo of his
// machine to show it (2026-09-17) — sixteen 5x7 grids up top, twelve digit
// cells with their own points below, and the marks around them. The status row
// has always drawn its unlit indicators this way; now the two canvases do too.
// Only just there: Nixon's first look at it said 淺到幾乎睇唔到 — on the real
// glass you have to push the exposure to see an unlit segment at all.
const GHOST = '#141a1210';
// A real dot is TALLER THAN WIDE: vertical strokes read as almost solid lines
// while the columns stay clearly separated. Square dots with even gaps make the
// row look like a checkerboard instead of LCD text — Nixon called it out, and
// the ClrStat photo in his own book (Function-03) shows it plainly.
// The sixteen cells also fill nearly the whole glass on the machine; ours used
// to cover about two thirds of it.
// 2026-09-17, Nixon looking at the proof sheet: the COLUMN gap was too wide —
// a horizontal stroke has to read as a line, not a dashed one. DOT_X 2.2 → 2.9
// leaves 0.3px of the 3.2 pitch, so the columns are still there but a bar joins
// up. (This revises the earlier reading of the ClrStat photo in CLAUDE.md §20.)
// Same round, he put a number on the shape of the cell: a 5x7 grid on the real
// glass is ROUGHLY 1 WIDE TO 2 TALL, with one dot's width of gap to the next
// grid. Five dots at the 3.2 pitch make the cell 16px across, so the seven rows
// have to cover 32 — the dots are about half again as tall as they are wide.
// Square dots gave 1:1.4, which is why the line looked squat.
const PITCH_X = 3.2, PITCH_Y = 32 / 7;
const DOT_X = 2.9, DOT_Y = 4.3;
let lastDots = null, blinkOn = true, blinkTimer = null;

// The cursor blinks at roughly 1 s, lit about 0.6 s of it (measured off the
// 18:26 recording at 10 fps). The canvas owns the blink now, so the phase
// survives a re-render instead of restarting on every keystroke.
function startBlink() {
  if (blinkTimer) return;
  const tick = () => {
    blinkOn = !blinkOn;
    // nothing to flash when no cursor is showing — skip the redraw entirely
    if (lastDots && lastDots.cur >= 0) drawDots(lastDots.win, lastDots.cur, lastDots.W);
    blinkTimer = setTimeout(tick, blinkOn ? 600 : 400);
  };
  blinkTimer = setTimeout(tick, 600);
}

// The glass thinks in CELLS, not characters. Nearly every cell is one
// character, but not all of them:
//   * `⁻¹` is ONE key on the machine and ONE 5x7 cell on the glass — the
//     raised minus and the 1 share a single grid (REAL: Nixon, 2026-09-17).
//   * the same letter is drawn differently depending on what it MEANS: the
//     complex i is not the i of `sin`, Euler's e is not the e of `Rec(`, the
//     C of nCr is not the variable C (REAL: Nixon drew each on the glyph pad).
// A cell carries the glyph it wants (g) and the characters it stands for (t),
// so the plain-text mirror in #l1 — what the tests read — is unchanged.
const CELL_RUNS = [
  { lit: '⁻¹', cells: [['⁻¹', '⁻¹']] },
  // x̄ is an x with a combining macron — TWO code points, so without this it
  // was split into two cells and the glyph Nixon drew was never reached: the
  // machine drew a bare x and then a character with no glyph at all.
  { lit: 'x̄', cells: [['x̄', 'x̄']] },
  { lit:'ȳ',cells:[['ȳ','ȳ']] }, { lit:'x̂',cells:[['x̂','x̂']] }, { lit:'ŷ',cells:[['ŷ','ŷ']] },
  // nCr and nPr print as the thick C and P ALONE — no n, no r (REAL: Nixon's
  // photo of his machine showing `8nCr3` as `8C3`, 2026-09-17).
  { lit: 'a+bi', cells: [['a', 'a'], ['+', '+'], ['b', 'b'], ['i.cx', 'i']] },
  { lit: 'nCr', cells: [['C.ncr', 'C']] },
  { lit: 'nPr', cells: [['P.npr', 'P']] },
];
// A LONE i or e is the mathematical one; inside a word it is a plain letter.
const LONE_GLYPH = { i: 'i.cx', e: 'e.eu' };
const isLetter = c => !!c && /[A-Za-z]/.test(c);

// Every run of letters this machine can put on the dot line is either one of
// ITS OWN WORDS or something the user keyed in — and what the user keys in is
// made of tokens, each of which is again one of these words or a bare letter.
// So the test for "is this i the imaginary unit" is not about its neighbours:
// it is whether the letter belongs to a word at all. Letters only — brackets,
// ⁻¹ and # are not letters, so they never join a run.
const WORDS = ['ClrMemory', 'ClrStat', 'WhileEnd', 'FreqOff', 'FreqOn', 'Formula',
  'Conjg', 'While', 'Break', 'IfEnd', 'Then', 'Else', 'Next', 'Step', 'Goto',
  'Prog', 'Norm', 'minX', 'maxX', 'sinh', 'cosh', 'tanh', 'Rnd', 'Ran', 'Abs',
  'Pol', 'Rec', 'arg', 'Ans', 'sin', 'cos', 'tan', 'log', 'nPr', 'nCr', 'Deg',
  'Rad', 'Gra', 'Fix', 'Sci', 'Dec', 'Hex', 'Bin', 'Oct', 'Dsz', 'Isz', 'Lbl',
  'For', 'If', 'To', 'ln', 'DT', 'sx',
  'A', 'B', 'C', 'D', 'X', 'Y', 'M',              // the seven variables
].sort((a, b) => b.length - a.length);            // longest first, always

/** Which characters of `text` stand on their own rather than sitting inside one
 *  of the machine's words. Each run of letters is cut into WORDS; a leftover
 *  stretch counts as standalone only when it is all the same character.
 *
 *  Nixon, 2026-09-22: "the imaginary number i shd stay thick all the time" —
 *  he had typed `Ans i` and watched the i go thin. Deciding from the two
 *  neighbouring characters could never get that right, and `A+Bi`, the ordinary
 *  way to write a complex number, was wrong the same way. Cutting the run into
 *  words does: `Ans`+`i`, `B`+`i`, five leftover `i`s in `iiiii` — while `sin`,
 *  `Fix`, `While`, `minX` and `QuadEquation` keep their ordinary letters. */
function standalone(text) {
  const out = new Array(text.length).fill(false);
  for (let i = 0; i < text.length;) {
    if (!isLetter(text[i])) { i++; continue; }
    let end = i;
    while (isLetter(text[end + 1])) end++;
    const run = text.slice(i, end + 1);
    const spare = new Array(run.length).fill(true);
    for (let j = 0; j < run.length;) {
      const w = WORDS.find(k => run.startsWith(k, j));
      if (!w) { j++; continue; }
      for (let n = 0; n < w.length; n++) spare[j + n] = false;
      j += w.length;
    }
    for (let a = 0; a < run.length;) {
      if (!spare[a]) { a++; continue; }
      let b = a;
      while (b + 1 < run.length && spare[b + 1]) b++;
      let same = true;
      for (let k = a; k <= b; k++) if (run[k] !== run[a]) same = false;
      if (same) for (let k = a; k <= b; k++) out[i + k] = true;
      a = b + 1;
    }
    i = end + 1;
  }
  return out;
}
function toCells(text) {
  const out = [];
  const alone = standalone(text);
  for (let i = 0; i < text.length;) {
    // On the 3650P II the bar in d/dx has its own dot pattern. Keep the
    // underlying expression and character offsets intact for editing/copying.
    if (MODEL === '3650PII' && text.startsWith('d/dx', i)) {
      for (let j = 0; j < 4; j++)
        out.push({ g: j === 1 ? 'slash.diff' : text[i + j], t: text[i + j], at: i + j });
      i += 4;
      continue;
    }
    const run = CELL_RUNS.find(r => text.startsWith(r.lit, i));
    if (run) {
      run.cells.forEach(([g, t]) => out.push({ g, t, at: i }));
      i += run.lit.length;
      continue;
    }
    const ch = text[i];
    out.push({ g: (alone[i] && LONE_GLYPH[ch]) || ch, t: ch, at: i });
    i++;
  }
  return out;
}
/** The cell a character offset lands in (the first one at or after it). */
function cellAt(cells, pos) {
  for (let i = 0; i < cells.length; i++) if (cells[i].at >= pos) return i;
  return cells.length;
}

function drawDots(win, cur, W) {
  const cv = document.getElementById('l1c');
  if (!cv || typeof cv.getContext !== 'function') return;   // test DOM shim
  lastDots = { win, cur, W };
  startBlink();

  const cellW = (DOT_W + 1) * PITCH_X;      // five dots plus the gap to the next
  const cssW = W * cellW, cssH = DOT_H * PITCH_Y;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cssW * dpr)) {
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
  }
  cv.style.width = `${cssW}px`;
  cv.style.height = `${cssH}px`;

  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cssW, cssH);

  g.fillStyle = GHOST;                      // every dot of all sixteen cells
  for (let i = 0; i < W; i++)
    for (let r = 0; r < DOT_H; r++)
      for (let c = 0; c < DOT_W; c++)
        g.fillRect(i * cellW + c * PITCH_X, r * PITCH_Y, DOT_X, DOT_Y);

  for (let i = 0; i < W; i++) {
    const x0 = i * cellW;
    // Both cursors blink between the character and a mark, and BOTH shapes are
    // now off the machine (IMG_3102, 2026-09-13: 123, ◀◀, SHIFT DEL, and back):
    //   insert (default)  — a bar ONE dot wide down the left of the cell
    //   overwrite (SHIFT DEL) — a bar on the BOTTOM row, the full five dots
    //                           wide, with the character hidden while it shows
    // The overwrite half used to fill the whole cell and reverse the glyph,
    // which was a guess carried over from other CASIO models. It is not that.
    const onCursor = i === cur && blinkOn;
    const under = onCursor && !S.ins;
    if (onCursor) {
      g.fillStyle = INK;
      // The bottom bar is the cell's last ROW of dots, so it shows the same
      // horizontal gaps as any other glyph. The insert bar is a vertical run,
      // and vertically the dots nearly touch (DOT_Y ≈ PITCH_Y), so it reads as
      // one continuous line on the real glass — draw it as one.
      if (under) {
        for (let c = 0; c < DOT_W; c++) {
          g.fillRect(x0 + c * PITCH_X, (DOT_H - 1) * PITCH_Y, DOT_X, DOT_Y);
        }
      } else {
        // TWO dots wide, seven rows tall (Nixon, 2026-09-19 — one was too thin).
        // Vertically the dots all but touch, so each column goes down as one
        // continuous strip rather than seven separate pips.
        g.fillRect(x0, 0, DOT_X, cssH);
        g.fillRect(x0 + PITCH_X, 0, DOT_X, cssH);
      }
    }
    const cell = win[i];
    // The character is NOT drawn while the cursor is showing: the cell blinks
    // between the character and the bar, it does not carry both (same round —
    // "6789 / 67|9 / 6789, when it's the | bar, no 8 under it"). That already
    // held for the overwrite cursor; the insert one used to draw both.
    if (!cell || cell.t === ' ' || onCursor) continue;
    g.fillStyle = INK;
    const rows = dotRows(cell.g);
    if (!rows) {                            // no 5x7 glyph: fall back to text
      g.font = `${Math.round(cssH * 0.7)}px Arial`;
      g.fillText(cell.t, x0, cssH - 1, cellW);
      continue;
    }
    for (let r = 0; r < DOT_H; r++) {
      for (let c = 0; c < DOT_W; c++) {
        if (rows[r] & (1 << (DOT_W - 1 - c))) g.fillRect(x0 + c * PITCH_X, r * PITCH_Y, DOT_X, DOT_Y);
      }
    }
  }
}

/** Draw the lower line: right-aligned digits, the ×10 exponent, and the "A?"
 *  bottom-left tag, which the machine renders in the dot font down there. */
function drawSegs(rt, isMenu, tag) {
  const cv = document.getElementById('l2c');
  if (!cv || typeof cv.getContext !== 'function') return;   // test DOM shim
  const row = cv.parentNode;
  const cssW = (row.clientWidth || 332) - 9, cssH = L2_H;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cssW * dpr)) {
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
  }
  cv.style.width = `${cssW}px`;
  cv.style.height = `${cssH}px`;

  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cssW, cssH);
  g.save();
  g.transform(1, 0, -0.07, 1, cssH * 0.07, 0);   // the gentle LCD slant

  // The whole field, faint: a sign cell, ten digit cells each with its own
  // point, the ×10 marking, a signed two-digit exponent, and the little column
  // on the left (prompt cell, ?, =). Drawn before anything else so the lit
  // segments land straight on top of their own ghosts.
  const gright = cssW - SEG_GUTTER;
  const gew = SEG_W * 0.45, geh = SEG_H * 0.42, get_ = SEG_T * 0.55;
  g.fillStyle = GHOST;
  drawSegText(g, '-8.8.8.8.8.8.8.8.8.8.', gright, SEG_TOP, SEG_W, SEG_H, SEG_T);
  drawSegText(g, '-88', cssW, SEG_TOP, gew, geh, get_);
  g.font = '700 11px Arial';
  g.fillText('×10', gright + 1, SEG_TOP + SEG_H - 3);
  drawTagCell(g, null, SEG_LEFT, SEG_TOP + 1);                       // the block
  drawTagCell(g, dotRows('?'), SEG_LEFT + (DOT_W + 1) * TAG_P, SEG_TOP + 1);
  drawTagCell(g, dotRows('='), SEG_LEFT, SEG_TOP + 1 + DOT_H * TAG_P);
  g.fillStyle = INK;

  if (isMenu) {
    // Select the nearest real digit slot under each label. The upper dot grid
    // has a different pitch; using its x coordinate directly misses the LCD.
    const cell = (DOT_W + 1) * PITCH_X;
    const first = gright - 10 * SEG_W;
    [...rt].forEach((ch, i) => {
      if (ch === ' ') return;
      const slot = Math.max(0, Math.min(9, Math.round((i * cell - first) / SEG_W)));
      drawSegChar(g, ch, first + slot * SEG_W, SEG_TOP, SEG_W, SEG_H, SEG_T);
    });
    g.restore();
    return;
  }

  // The mantissa always ends where the right-hand column starts; ×10 and the
  // exponent live INSIDE that column, stacked the way the machine shows them
  // (×10 sitting on the digits' baseline, the exponent raised above it, and
  // the little i under both). The ×10 used to be pushed in among the digits
  // instead, which shoved a ten-digit mantissa off to the left.
  const right = cssW - SEG_GUTTER;
  const m = /^(.*)×10\^(-?\d+)$/.exec(rt);
  if (m) {
    // sign + two digits, small, right-aligned at the very edge — "-88" has to
    // fit the column too, which is what the all-segments photo shows lit
    const ew = SEG_W * 0.45, eh = SEG_H * 0.42, et = SEG_T * 0.55;
    drawSegText(g, m[2], cssW, SEG_TOP, ew, eh, et);       // exponent, right-aligned
    g.font = '700 11px Arial';
    g.fillText('×10', right + 1, SEG_TOP + SEG_H - 3);
  }
  drawSegText(g, m ? m[1] : rt, right, SEG_TOP, SEG_W, SEG_H, SEG_T);
  g.restore();

  // The little tag in the LEFT column — `A?` at a prompt, `x=` beside a
  // formula's answer. It sits at the TOP of the digit band, not at its foot:
  // on the glass the dot cell and its ? are the top row of that column, the =
  // is the row under them, and ∠ is at the foot (REAL: the all-segments photo
  // Nixon circled, 2026-09-16 — ours hung far too low, which he had been
  // putting up with). The cell is smaller than a digit, about a third as tall.
  if (tag) {
    g.fillStyle = INK;
    const cell = (DOT_W + 1) * TAG_P;
    [...tag].forEach((ch, n) => {
      const rows = dotRows(ch);
      if (!rows) return;
      // '=' drops to the next row, under the cell, instead of running alongside
      drawTagCell(g, rows,
        SEG_LEFT + (ch === '=' ? 0 : n * cell),
        SEG_TOP + 1 + (ch === '=' ? DOT_H * TAG_P : 0));
    });
  }
}

/** One cell of the little left-hand column, in the dot font at tag size.
 *  `rows = null` lights the whole cell — that is the solid block the machine
 *  shows beside the `?`. */
function drawTagCell(g, rows, x0, y0) {
  const p = TAG_P;
  for (let r = 0; r < DOT_H; r++) {
    for (let c = 0; c < DOT_W; c++) {
      if (!rows || (rows[r] & (1 << (DOT_W - 1 - c))))
        g.fillRect(x0 + c * p, y0 + r * p, p * 0.68, p * 0.96);
    }
  }
}

/** SHIFT AC. The machine says goodbye for a second and then the glass is
 *  empty — no digits, no indicators, and not even the faint unlit segments
 *  (Nixon, 2026-09-22). Only ON brings it back; everything it was holding
 *  (mode, memories, programs) is still there when it does. */
function powerOff() {
  S.off = 'bye';
  S.toks = []; S.cur = 0; S.result = null; S.error = null; S.note = ''; S.menu = null;
  setTimeout(() => { if (S.off === 'bye') { S.off = 'dark'; render(); } }, 1000);
  return render();
}

/** Wipe one of the two glass canvases, ghosts and all. */
function blankCanvas(id) {
  const cv = document.getElementById(id);
  if (!cv || typeof cv.getContext !== 'function') return;    // test DOM shim
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
}

/** The two power-down screens. `bye` is the farewell on the dot line with
 *  nothing else lit; `dark` is the blank glass. */
function renderOff() {
  const bye = S.off === 'bye';
  // The markup stays (.lcd.off hides the row) so the width does not change
  // with it — emptying it used to make the whole machine narrower.
  drawSyms(() => false);
  const l1 = document.getElementById('l1');
  l1.textContent = bye ? BYE : '';
  const l2 = document.getElementById('l2');
  l2.className = 'l2'; l2.innerHTML = ''; l2.dataset.raw = '';
  for (const id of ['mkl', 'mkr', 'mku', 'mkd', 'dsp']) {
    document.getElementById(id).classList.remove('on');
  }
  lastDots = null;                                   // stop the cursor blinking
  if (bye) {
    // Still powered, so the unlit segments are still faintly there — but
    // nothing is lit on the digit line, only the farewell above it.
    drawDots(toCells(BYE), -1, 16);
    drawSegs('', false, '');
  } else { blankCanvas('l1c'); blankCanvas('l2c'); }
}
const BYE = 'See You';

/** The indicator row. `on` says whether each symbol is lit, so the power-down
 *  screen can draw the same row with nothing on it. */
function drawSyms(on) {
  const sym = document.getElementById('sym');
  const lit = [];
  sym.innerHTML = SYMS.map(([t, f, box]) => {
    const is = !!on(f);
    if (is) lit.push(t);
    return `<span class="${is ? 'on' : ''}${box ? ' box' : ''}">${t}</span>`;
  }).join('');
  // Which symbols are actually lit, for tests: the unlit ones are still in the
  // markup (a real LCD shows them faintly), so their text alone proves nothing.
  sym.dataset.on = lit.join(',');
}

function render() {
  const lcd = document.getElementById('lcd');
  if (lcd) lcd.classList.toggle('off', S.off === 'dark');
  if (S.off) { renderOff(); announceDisplay(); return; }
  drawSyms(f => f());

  const l1o = line1();
  const text = l1o.text;
  const cur = S.showing === 'result' ? -1 : l1o.cur;   // no cursor while a result is shown
  // 16 cells. With a cursor the window follows it; with no cursor the machine
  // shows the START of the text and leaves ▶ to say there is more — that is
  // what a finished calculation does (REAL, 20:25 recording), so a ◢ statement
  // does the same rather than showing its tail.
  const cells = toCells(text);
  const W = 16;
  const ccur = cur < 0 ? -1 : cellAt(cells, cur);
  let start = 0;
  if (ccur >= 0 && cells.length > W) start = Math.max(0, Math.min(ccur - W + 2, cells.length - W + 1));
  const win = cells.slice(start, start + W);
  const l1 = document.getElementById('l1');
  const txt = (from, to) => win.slice(from, to).map(c => c.t).join('');
  if (ccur < 0) l1.textContent = txt(0, win.length);
  else {
    const i = ccur - start;
    // past the last cell the cursor sits on an empty one, as it does on the glass
    const a = txt(0, i), c = win[i] ? win[i].t : ' ', b = txt(i + 1, win.length);
    l1.innerHTML = `${esc(a)}<span class="cur">${esc(c)}</span>${esc(b)}`;
  }
  drawDots(win, ccur < 0 ? -1 : ccur - start, W);
  // ◀ / ▶ say the text runs off that side. They sit in their own columns, so
  // they never cost a character cell.
  document.getElementById('mkl').classList.toggle('on', start > 0);
  document.getElementById('mkr').classList
    .toggle('on', cells.length - start > W || (ccur >= 0 && ccur - start >= W));
  // The FMLA chooser lights both, because ▲▼ walk the formula list there
  // (REAL: Nixon's photo of 01:QuadEquation has both lit).
  document.getElementById('mku').classList
    .toggle('on', !!S.fmla || (S.hist.length > 0 && S.hidx < S.hist.length - 1));
  document.getElementById('mkd').classList.toggle('on', !!S.fmla || S.hidx > 0);

  const rt = resultText();
  const shown = S.menu ? rt : withPoint(rt);     // the glass always shows the point
  const l2 = document.getElementById('l2');
  // The "×10" is its own small marking on the glass with the exponent raised
  // above it (REAL: "9.87654322 ×10¹⁷" in the 20:25 recording). It used to be
  // swallowed by this regex, so an exponent showed as a bare raised number.
  const m = /^(.*)×10\^(-?\d+)$/.exec(shown);
  const right = m
    ? `${esc(m[1])}<span class="e10">×10</span><sup>${esc(m[2])}</sup>`
    : esc(shown);
  const tag = lowerTag();
  const left = tag ? `<span class="lft">${esc(tag)}</span>` : '';
  // small i / ∠ at the bottom-right corner while the imaginary part is showing
  // i sits in the right-hand column under ×10; the polar ∠ is a different
  // segment altogether, down at the bottom LEFT (REAL: the all-segments photo
  // Nixon took on 2026-09-16 shows ? = ∠ stacked at the left, i and Disp right).
  const cx = cxShowing();
  // these sit OUTSIDE #l2 (their faint twins are in the markup), so the tests
  // still read the number off #l2 by itself
  const cxMark = (cx && imShowing() && !cx.polar) ? '<span class="ic">i</span>' : '';
  const angMark = (cx && imShowing() && cx.polar) ? '<span class="ang">∠</span>' : '';
  if (S.menu) {
    // one cell per character, the same width as a dot-matrix cell above
    const w = (DOT_W + 1) * PITCH_X;
    l2.className = 'l2 menu';
    l2.innerHTML = [...shown]
      .map(ch => `<i style="width:${w}px">${esc(ch)}</i>`).join('');
  } else {
    l2.className = 'l2';
    l2.innerHTML = left + right + cxMark + angMark;
  }
  drawSegs(shown, !!S.menu, tag);
  // Disp is a reverse-video badge fixed in the bottom-right corner of the
  // glass, not a symbol in the top row (REAL, 2026-08-09 recording).
  document.getElementById('dsp').classList
    .toggle('on', !!(S.run && S.run.mode === 'disp'));
  announceDisplay(text, shown);
  l2.dataset.raw = rt;          // plain text of the same thing, for tests/debugging

  document.querySelectorAll('.key').forEach(b => {
    b.classList.toggle('armed',
      (b.dataset.id === 'SHIFT' && S.shift) || (b.dataset.id === 'ALPHA' && S.alpha));
  });
}
function announceDisplay(top, bottom) {
  const output = document.getElementById('lcd-accessible'); if (!output) return;
  const text = S.off ? '計數機已關機' : `${MODEL_NAME}；${S.mode}；${S.ctx.angle.toUpperCase()}；上行：${String(top || '').trim() || '空白'}；下行：${String(bottom || '').trim() || '空白'}`;
  if (output.textContent !== text) output.textContent = text;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function numText(v) {
  const g = format(v.re ? v.re : v, S.ctx.disp);
  return g.exp === null ? g.mant : `${g.mant}×10^${g.exp}`;
}

// ------------------------------------------------------------------- input
function ins(tok) {
  S.rerun = null;
  if (S.showing === 'result') { newInput(false); }
  S.note = '';
  if (!S.ins && S.cur < S.toks.length) S.toks[S.cur] = tok;
  else S.toks.splice(S.cur, 0, tok);
  S.cur++;
  S.showing = 'input';
}
function newInput(keepAns) {
  S.rerun = null;
  // Step out of the history: a cleared entry line is not "showing" any past
  // calculation, so ▲ has to come back to the most recent one. Without this,
  // AC left hidx pointing at entry 0 and ▲ had nowhere to go — Nixon's tester
  // reported it as "AC 後冇 record".
  S.hidx = -1;
  // endStmt and endTag belong to the program or formula that just finished and
  // must die with it. Leaving endTag behind put the formula's `x=` beside every
  // later answer — Nixon saw `x=7.` for 5+2 after one run of FMLA 01, and only
  // reloading the page cleared it (2026-09-22).
  S.endStmt = ''; S.endTag = '';
  S.toks = keepAns ? [{ d: 'Ans', e: 'Ans' }] : [];
  S.cur = S.toks.length; S.result = null; S.error = null; S.showing = 'input';
  S.engExp = 0; S.asFrac = null; S.asDms = false;
}
// character offset inside the engine string -> index into the token list
function tokenIndexAt(pos) {
  let n = 0;
  for (let i = 0; i < S.toks.length; i++) {
    const len = S.toks[i].e.length;
    if (pos < n + len) return i;
    n += len;
  }
  return S.toks.length;
}

const OPS_AFTER_RESULT = new Set(['ADD', 'SUB', 'MUL', 'DIV', 'POW', 'INV', 'SQ', 'CUBE', 'MPLUS']);

function exe() {
  S.endStmt = ''; S.endTag = '';
  const src = S.toks.map(t => t.e).join('');
  if (!src) return;
  try {
    const r = calc(src, S.ctx);
    S.result = r; S.error = null;
    S.hist.unshift({ toks: S.toks.map(t => ({ ...t })), r });
    if (S.hist.length > 15) S.hist.pop();      // the machine keeps 15 (verified)
    S.hidx = 0;          // ▲ steps back to the *previous* entry, as on the machine
  } catch (e) {
    S.error = e.kind || 'Syntax ERROR'; S.result = null;
    // the machine parks the cursor on the offending token, not at the start
    S.errPos = e.pos != null ? tokenIndexAt(e.pos) : S.toks.length;
  }
  S.showing = 'result'; S.engExp = 0; S.asFrac = null; S.asDms = false; S.note = '';
  S.showIm = !!(S.result && S.result.imFirst);
}

// ------------------------------------------------------------------- menus
function menuMode() {
  const pages = [['COMP CMPLX BASE▸', ' 1    2     3'], ['◂SD   REG   PRGM', ' 4    5     6']];
  return {
    l1: pages[0][0], l2: pages[0][1], pages, page: 0,
    hit(n) {
      const names = ['COMP', 'CMPLX', 'BASE', 'SD', 'REG', 'PRGM'];
      if (n < 1 || n > 6) return false;
      hideEditor();
      const done = { COMP: 1, CMPLX: 1, SD: 1, REG:1, PRGM: 1 };
      S.mode = names[n - 1];
      S.ctx.mode = S.mode;
      S.ctx.stat = [];        // leaving SD wipes the data, same as ClrStat
      S.note = done[S.mode] ? '' : `${S.mode}: 未做`;
      newInput(false);
      if (S.mode === 'PRGM') openEditor();
      if (S.mode === 'REG') { S.menu=menuRegType(); return 'menu'; }
      return true;
    },
  };
}
function menuSetup() {
  const P = [
    ['Deg  Rad  Gra  ▸', ' 1    2    3', n => ['deg', 'rad', 'gra'][n - 1] && (S.ctx.angle = ['deg', 'rad', 'gra'][n - 1], true)],
    ['Fix  Sci  Norm ▸', ' 1    2    3', n => {
      if (n === 1) { S.sub = { kind: 'fix' }; return 'sub'; }
      if (n === 2) { S.sub = { kind: 'sci' }; return 'sub'; }
      if (n === 3) { S.sub = { kind: 'norm' }; return 'sub'; }
      return false;
    }],
    ['ab/c   d/c     ▸', ' 1     2', n => (n <= 2 && (S.ctx.frac = n === 1 ? 'ab/c' : 'd/c', true))],
    ['a+bi   r∠θ     ▸', ' 1     2', n => (n <= 2 && (S.ctx.cplx = n === 1 ? 'a+bi' : 'r∠θ', true))],
    ['FreqOn  FreqOff▸', ' 1       2', n => { if(n<1||n>2) return false; S.ctx.freqOn=n===1; return true; }],
    ['◂Contrast', ' 1', n => n === 1],
  ];
  return { l1: P[0][0], l2: P[0][1], P, page: 0, hit(n) { return P[this.page][2](n); } };
}
function menuClr() {
  return {
    l1: ['SD','REG'].includes(S.mode) ? 'Scl  Setup  All' : 'Mem  Setup  All', l2: ' 1     2     3',
    hit(n) {
      if (n === 1 && ['SD','REG'].includes(S.mode)) {     // ClrStat — the book's SHIFT 9 1 EXE
        S.ctx.stat = []; newInput(false);
        S.note = 'ClrStat'; S.showing = 'result';
        return true;
      }
      if (n === 1) { for (const k in S.ctx.vars) S.ctx.vars[k] = ZERO; return true; }
      if (n === 2) { S.ctx.angle = 'deg'; S.ctx.disp = { disp: 'norm1' }; S.ctx.frac = 'd/c'; return true; }
      if (n === 3) {                       // All: back to factory state
        S.mode = 'COMP'; S.ctx = new Ctx({ mode: 'COMP', frac: 'd/c' });
        S.hist = []; S.hidx = -1; S.hyp = 0; S.run = null;
        // The real machine empties program memory here. Ours leaves the factory
        // with programs in it, so factory state means the shipped four are back.
        // It is also the ONLY way to get them from the keypad — someone on an
        // iPad has no editor panel to press a button in, and a machine carrying
        // storage from an older build needs exactly this (2026-09-16).
        restoreShipped();
        syncEditor();
        newInput(false);
        return true;
      }
      return false;
    },
  };
}
function menuDrg() {
  return {
    l1: 'D    R    G', l2: ' 1    2    3',
    hit(n) {
      const t = [{ d: '°', e: 'ᵈ' }, { d: 'ʳ', e: 'ʳ' }, { d: 'ᵍ', e: 'ᵍ' }][n - 1];
      if (!t) return false;
      S.menu = null; ins(t); return true;
    },
  };
}
// ------------------------------------------------------- SD statistics (§11b)
/** DT (the M+ key in SD): file what is on the entry line as one sample line.
 *  "5;10" enters ten fives but still counts as ONE line, and an empty line
 *  repeats the previous value — which is what pressing M+ again does. */
function dataInput() {
  if(S.mode==='REG') {
    try { addRegressionData(S.ctx,S.toks.map(t=>t.e).join('')); newInput(false); S.note='Line=';
      S.result=fmtResult(fromInt(S.ctx.stat.length),S.ctx); S.showing='result'; }
    catch(e) { S.error=e.kind || 'Syntax ERROR'; S.showing='result'; }
    return render();
  }
  const src = S.toks.map(t => t.e).join('').trim();
  let value, freq = 1;
  try {
    if (!src) {
      const last = S.ctx.stat[S.ctx.stat.length - 1];
      if (!last) { S.error = 'Syntax ERROR'; S.showing = 'result'; return render(); }
      value = last.v;
    } else {
      const semi = src.indexOf(';');
      if (semi < 0) value = calc(src, S.ctx).value;
      else {
        value = calc(src.slice(0, semi), S.ctx).value;
        const f = calc(src.slice(semi + 1), S.ctx).value;
        const k = toNumber(f);
        if (!Number.isInteger(k) || k < 1) { S.error = 'Syntax ERROR'; S.showing = 'result'; return render(); }
        freq = k;
      }
    }
  } catch (e) { S.error = e.kind || 'Syntax ERROR'; S.showing = 'result'; return render(); }
  S.ctx.stat.push({ v: value, f: freq });
  newInput(false);
  // The machine answers with "Line=" over the number of entry LINES so far —
  // not the total frequency (SPEC §11b: seven presses read 7 while n was 20).
  S.note = 'Line=';
  S.result = fmtResult(fromInt(S.ctx.stat.length), S.ctx);
  S.showing = 'result';
  return render();
}

/** S-SUM (SHIFT 1) and S-VAR (SHIFT 2). Each slot types one token, then EXE
 *  works it out — the same as every other menu here. */
function menuRegType() {
  // Limited to LIN in this release; 1 remains the documented native selection.
  return { l1:'Lin', l2:' 1', hit(n) { if(n!==1) return false; S.ctx.regType='LIN'; newInput(false); return true; } };
}
function menuRegVar() {
  const pages=[['x̄    σx   sx  ▸','1     2    3'],['◂ȳ   σy   sy ▸',' 1    2    3'],['◂a    b    r  ▸',' 1    2    3'],['◂x̂   ŷ',' 1    2']];
  const tokens=[['x̄','σx','sx'],['ȳ','σy','sy'],['a','b','r'],['x̂','ŷ']];
  return { l1:pages[0][0],l2:pages[0][1],pages,page:0,hit(n) { const t=tokens[this.page][n-1]; if(!t) return false; S.menu=null; ins({d:t,e:{a:'regA',b:'regB',r:'regR'}[t] || t}); return true; } };
}
function menuSsum() {
  if(S.mode==='REG') {
    const pages=[['Σx²  Σx   n   ▸',' 1    2    3'],['◂Σy² Σy  Σxy ▸',' 1    2    3'],['◂Σx²y Σx³ Σx⁴',' 1    2    3']];
    const tokens=[['Σx²','Σx','n'],['Σy²','Σy','Σxy'],['Σx²y','Σx³','Σx⁴']];
    return { l1:pages[0][0],l2:pages[0][1],pages,page:0,hit(n) { const t=tokens[this.page][n-1]; if(!t) return false; S.menu=null; ins({d:t,e:t}); return true; } };
  }
  return {
    l1: 'Σx²  Σx   n', l2: ' 1    2    3',
    hit(n) {
      const t = ['Σx²', 'Σx', 'n'][n - 1];
      if (!t) return false;
      S.menu = null; ins({ d: t, e: t }); return true;
    },
  };
}
function menuSvar() {
  if(S.mode==='REG') return { l1:'VAR     TYPE',l2:' 1       3',hit(n) {
    if(n!==1&&n!==3) return false; S.menu=n===1?menuRegVar():menuRegType(); return 'menu'; } };
  // Slot 3 is sx, the sample standard deviation (Nixon, 2026-09-12).
  // x̄ is one cell now, so everything after it sits one cell to the left; the
  // numbers below keep the places they had under σx and sx.
  const pages = [['x̄    σx   sx  ▸', '1     2    3'], ['◂minX maxX', ' 1    2']];
  return {
    l1: pages[0][0], l2: pages[0][1], pages, page: 0,
    hit(n) {
      const t = [['x̄', 'σx', 'sx'], ['minX', 'maxX']][this.page][n - 1];
      if (!t) return false;
      S.menu = null; ins({ d: t, e: t }); return true;
    },
  };
}

function menuProg() {
  return {
    l1: 'P1  P2  P3  P4', l2: ' 1   2   3   4',
    prog: true,                       // lights PRGM in the symbol row
    hit(n) {
      if (n < 1 || n > 4) return false;
      S.menu = null; S.psel = n - 1; syncEditor(); startRun(n - 1);
      return true;
    },
  };
}
function menuConst(editing = false) {
  const pages = [];
  for (let i = 0; i < 40; i += 4) {
    pages.push([`${CONSTS.slice(i, i + 4).map(c => c[0]).join('  ')}▸`, ' 1   2   3   4']);
  }
  return {
    l1: pages[0][0], l2: pages[0][1], P: pages, page: 0,
    hit(n) {
      if (n < 1 || n > 4) return false;
      const c = CONSTS[this.page * 4 + n - 1];
      S.menu = null;
      if (editing) insertAtCursor(sciToken(c[0]));
      else ins({ d: c[0], e: sciToken(c[0]) });
      return true;
    },
  };
}

function handleMenu(id) {
  const m = S.menu;
  if (id === 'AC' || (id === 'MODE' && !S.shift)) { S.menu = null; S.shift = false; return; }
  // SHIFT still arms while a menu is showing, and SHIFT + a digit means the
  // user reached for a menu key again, not for an item: pressing SHIFT 2 a
  // second time on S-VAR closes it on the real machine (Kenneth, 2026-09-13).
  // Without this the digit was read as a selection, so "exit" picked σx.
  if (id === 'SHIFT') { S.shift = !S.shift; return; }
  if (S.shift && /^D\d$/.test(id)) { S.menu = null; S.sub = null; S.shift = false; return; }
  if (id === 'LEFT' || id === 'RIGHT') {
    const P = m.P || m.pages;
    if (P) {
      m.page = (m.page + (id === 'RIGHT' ? 1 : P.length - 1)) % P.length;
      m.l1 = P[m.page][0]; m.l2 = P[m.page][1];
    }
    return;
  }
  const d = /^D(\d)$/.exec(id);
  if (!d) return;
  const n = +d[1];
  if (S.sub) {                                  // Fix / Sci digit entry
    const k = S.sub.kind;
    if (k === 'norm') { if (n === 1 || n === 2) S.ctx.disp = { disp: n === 1 ? 'norm1' : 'norm2' }; }
    else S.ctx.disp = { disp: k, n };
    S.sub = null; S.menu = null; return;
  }
  const r = m.hit(n);
  if (r === 'menu') return;
  if (r === 'sub') { m.l1 = '  0 ~ 9 ?'; m.l2 = ''; return; }
  if (r) S.menu = null;
}

// Which token a key produces, taking SHIFT / ALPHA / the current mode into account.
function tokenFor(id, sh, al) {
  const k = KEYMAP[id] || {};
  if (sh && S.mode === 'CMPLX' && k.shCx) return k.shCx;    // purple labels
  if (sh && k.sh) return k.sh;
  if (al && k.al) return k.al;
  return k.tok || null;
}

// ---------------------------------------------------------------- key press
function press(id) {
  // Powered down, the keypad is dead except for ON — the same as the machine.
  if (S.off) {
    if (id !== 'ON') return;
    S.off = null;
  }
  if (S.menu) { handleMenu(id); return render(); }
  if (S.fmla) { handleFmla(id); return render(); }

  // A finished program re-runs on EXE, as long as you have not started typing
  // something else. REAL: this matches the machine as Nixon describes it.
  // SHIFT EXE is Re⇔Im, not a re-run — otherwise you could never read the
  // imaginary half of a program's final answer.
  if (id === 'EXE' && !S.shift && !S.run && !S.menu && S.rerun != null
      && !S.toks.length && S.showing === 'result') {
    return typeof S.rerun === 'object' ? startFormula(S.rerun.f) : startRun(S.rerun);
  }

  // ---- while a program is running, only a few keys are live
  if (S.run) {
    if (id === 'AC' || id === 'ON') { endRun(); closeEditor(); newInput(false); return render(); }
    // SHIFT EXE is Re⇔Im, so at a ◢ it flips to the other half of a complex
    // value instead of stepping on (REAL, 2026-08-09 recording).
    if (id === 'EXE' && S.shift && S.run.mode === 'disp') {
      S.shift = false;
      if (S.run.res && S.run.res.type === 'cx') S.run.showIm = !S.run.showIm;
      S.run.asFrac = null;                 // the new half starts as a decimal
      return render();
    }
    if (id === 'EXE') {
      if (S.run.mode === 'disp') { stepRun(); return render(); }
      let v;
      // EXE with nothing typed keeps the value already shown. REAL: verify.
      if (!S.toks.length) v = S.ctx.vars[S.run.name] ?? ZERO;
      else {
        try { v = calc(S.toks.map(t => t.e).join(''), S.ctx).value; }
        catch (e) { S.error = e.kind || 'Syntax ERROR'; S.run = null; S.showing = 'result'; return render(); }
      }
      stepRun(v); return render();
    }
    // At a ◢ pause the machine still lets you press a b/c to flip the shown
    // value between fraction and decimal — Nixon's handbooks tell the reader to
    // do exactly that. SHIFT stays live so SHIFT a b/c (d/c) works too.
    if (S.run.mode === 'disp' && id === 'SHIFT') { S.shift = !S.shift; return render(); }
    if (S.run.mode === 'disp' && id === 'ABC') {
      const sh2 = S.shift; S.shift = false; S.alpha = false;
      const shown = S.run.res.type === 'cx'
        ? (S.run.showIm ? S.run.res.text2 : S.run.res.text) : S.run.res.text;
      // What form is on screen now? asFrac wins; otherwise the machine's own
      // formatting, which is already a fraction for some complex results.
      const asFraction = S.run.asFrac ? S.run.asFrac !== 'dec'
        : String(shown).includes('」');
      const form = (S.run.asFrac && S.run.asFrac !== 'dec') ? S.run.asFrac : S.ctx.frac;
      const other = form === 'ab/c' ? 'd/c' : 'ab/c';
      // SHIFT a b/c is d/c: it swaps mixed <-> improper and STAYS a fraction.
      // REAL, 2026-08-09 recording: 3.875 -> "31」8" -> (SHIFT) "3」7」8", never
      // dropping back to a decimal in between. Plain a b/c is the decimal toggle.
      S.run.asFrac = sh2 ? other : (asFraction ? 'dec' : S.ctx.frac);
      return render();
    }
    if (S.run.mode !== 'input') return render();
    // fall through: let the user type the answer
  }

  if (id === 'SHIFT') { S.shift = !S.shift; S.alpha = false; return render(); }
  if (id === 'ALPHA') { S.alpha = !S.alpha; S.shift = false; return render(); }

  const sh = S.shift, al = S.alpha;
  S.shift = false; S.alpha = false;

  if (S.pending) {                              // STO / RCL waiting for a variable
    const v = VAR_KEYS[id];
    if (v) {
      if (S.pending === 'sto') {
        S.pending = null;
        if (!S.toks.length || S.showing === 'result') S.toks = [{ d: 'Ans', e: 'Ans' }];
        S.toks.push({ d: '→' + v, e: '→' + v });
        S.cur = S.toks.length; exe(); return render();
      }
      S.pending = null;
      // Mid-expression, RCL behaves like ALPHA: it drops the variable into
      // what you are typing. Only on a fresh line does it mean "show me this
      // one's value". We used to always wipe the line and evaluate, so typing
      // "12+" then RCL A left just "A" (Kenneth, real machine, 2026-09-13).
      if (S.toks.length && S.showing === 'input') {
        ins({ d: v, e: v }); return render();
      }
      S.toks = [{ d: v, e: v }]; S.cur = 1; exe(); return render();
    }
    S.pending = null;
  }

  // In PRGM mode the keypad types into the program, exactly like the machine.
  if (S.mode === 'PRGM' && !S.run && editorKey(id, sh, al)) return render();

  const k = KEYMAP[id] || {};

  switch (id) {
    // ON keeps the mode, the settings and every memory; only the history goes.
    case 'ON': closeEditor(); S.hist = []; S.hidx = -1; S.hyp = 0; S.run = null; newInput(false); S.note = ''; return render();
    case 'AC':
      closeEditor();
      if (sh) return powerOff();
      newInput(false); S.hyp = 0; S.note = ''; return render();
    case 'DEL':
      if (sh) { S.ins = !S.ins; return render(); }
      if (S.showing === 'result') {
        // step back into the expression: at the error position, else at the end
        S.showing = 'input';
        S.cur = S.error ? Math.min(S.errPos ?? S.toks.length, S.toks.length) : S.toks.length;
        S.error = null; S.result = null;
      }
      if (S.ins) { if (S.cur > 0) { S.toks.splice(S.cur - 1, 1); S.cur--; } }
      else if (S.cur < S.toks.length) S.toks.splice(S.cur, 1);
      return render();
    case 'MODE': S.menu = sh ? menuSetup() : menuMode(); return render();
    case 'EXE':
      if (sh) { if (S.result && S.result.type === 'cx') S.showIm = !S.showIm; return render(); }
      exe(); return render();
    case 'LEFT': case 'RIGHT': {
      if (S.progErrAt != null) {           // jump into the program, at the bad character
        focusEditorAt(S.progErrAt);
        S.error = null; S.showing = 'input';
        return render();
      }
      if (S.error) {                       // go to where the error is, like the machine
        S.showing = 'input'; S.error = null;
        S.cur = Math.min(S.errPos ?? S.toks.length, S.toks.length);
        return render();
      }
      if (S.showing === 'result' && S.hist[Math.max(0, S.hidx)]) {
        S.toks = S.hist[Math.max(0, S.hidx)].toks.map(t => ({ ...t }));
        S.cur = id === 'LEFT' ? S.toks.length : 0;
        S.showing = 'input'; return render();
      }
      S.cur = Math.max(0, Math.min(S.toks.length, S.cur + (id === 'RIGHT' ? 1 : -1)));
      return render();
    }
    case 'UP': case 'DOWN': {
      if (!S.hist.length) return render();
      const ni = S.hidx + (id === 'UP' ? 1 : -1);
      if (ni < 0 || ni >= S.hist.length) return render();
      S.hidx = ni;
      const h = S.hist[ni];
      S.toks = h.toks.map(t => ({ ...t })); S.cur = S.toks.length;
      S.result = h.r; S.error = null; S.showing = 'result';
      return render();
    }
    case 'RCL': S.pending = sh ? 'sto' : 'rcl'; return render();
    case 'ENG': {
      // In CMPLX mode this key is the imaginary unit (manual: "the ENG key acts
      // as the key for entering i"), and ENG conversion is not available there.
      if (al || S.mode === 'CMPLX') { ins({ d: 'i', e: 'i' }); return render(); }
      if (S.result) S.engExp += sh ? -3 : 3;
      return render();
    }
    case 'HYP': if (al) { ins({ d: 'C', e: 'C' }); return render(); } S.hyp = sh ? 2 : 1; return render();
    case 'SIN': case 'COS': case 'TAN': {
      if (al && VAR_KEYS[id]) { ins({ d: VAR_KEYS[id], e: VAR_KEYS[id] }); return render(); }
      if (S.hyp) { const t = HYP[id][S.hyp - 1]; S.hyp = 0; ins({ d: t, e: t }); return render(); }
      break;
    }
    case 'MPLUS': {
      if (al) { ins({ d: 'M', e: 'M' }); return render(); }
      if (['SD','REG'].includes(S.mode) && !sh) { return dataInput(); }
      const src = S.toks.length ? S.toks.map(t => t.e).join('') : 'Ans';
      try {
        const r = calc(src, S.ctx);
        S.ctx.vars.M = sh ? subtractValue(S.ctx.vars.M, r.value) : addValue(S.ctx.vars.M, r.value);
        S.result = r; S.error = null;
      } catch (e) { S.error = e.kind || 'Syntax ERROR'; }
      S.showing = 'result'; return render();
    }
    case 'D1': if (sh && ['SD','REG'].includes(S.mode)) { S.menu = menuSsum(); return render(); } break;
    case 'D2': if (sh && ['SD','REG'].includes(S.mode)) { S.menu = menuSvar(); return render(); } break;
    case 'D9': if (sh) { S.menu = menuClr(); return render(); } break;
    case 'D7': if (sh) { S.menu = menuConst(); return render(); } break;
    case 'ANS': if (sh) { S.menu = menuDrg(); return render(); } break;
    case 'ABC':
      if (S.showing === 'result' && S.result) {
        const shown = resultText();
        const form = (shown.match(/」/g) || []).length > 1 ? 'ab/c' : 'd/c';
        S.asFrac = sh ? (form === 'ab/c' ? 'd/c' : 'ab/c')
          : (shown.includes('」') ? 'dec' : S.ctx.frac);
        S.asDms = false;
        return render();
      }
      break;
    case 'DMS':
      if (al) { ins({ d: 'B', e: 'B' }); return render(); }
      if (S.showing === 'result' && S.result) { S.asDms = !S.asDms; return render(); }
      break;
    case 'PROG': S.menu = menuProg(); return render();
    case 'FMLA':
      if (IS_3650) {
        const tok = sh ? 'd/dx(' : '∫(';
        ins({ d: tok, e: tok }); return render();
      }
      // The real fx-50FH II only opens built-in formulas in COMP mode.
      if (S.mode !== 'COMP') return render();
      S.fmla = { typed: '', n: null }; S.note = ''; S.error = null; return render();
  }

  // ordinary token keys
  const tok = tokenFor(id, sh, al);
  if (!tok) return render();

  if (S.showing === 'result') {
    if (OPS_AFTER_RESULT.has(id) || (sh && (id === 'LP' || id === 'MUL' || id === 'DIV'))) newInput(true);
    else newInput(false);
  }
  ins({ ...tok });
  render();
}

// ------------------------------------------------------------------- start
loadProgs();
buildDOM();
try {
  if (sessionStorage.getItem('fx-model-transition') === MODEL) {
    sessionStorage.removeItem('fx-model-transition');
    document.body.classList.add('model-arriving');
    if (typeof requestAnimationFrame === 'function')
      requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('model-arriving')));
    else document.body.classList.remove('model-arriving');
  }
} catch { /* optional visual transition */ }
syncEditor();
render();
fitWidth();
try {
  const pending = sessionStorage.getItem('fx50.pending-program');
  if (pending) {
    stageProgramImport(JSON.parse(pending));
    sessionStorage.removeItem('fx50.pending-program');
  }
} catch (e) { editorMsg(`未有載入：${e.message || '請用 JSON 匯入'}`); }
if (typeof window.addEventListener === 'function') {
  window.addEventListener('resize', fitWidth);
  window.addEventListener('orientationchange', fitWidth);
}
// exposed so the test suite can drive the bundled build as well as the sources
// The last five are test hooks: they let book-test.mjs run Nixon's published
// programs against the packaged bundle, not just against the sources.
window.fx = { S, press, startRun, openEditor, normalize, byteCount, editorKey, fmlaTitle, toCells, CSS,
  compile, runProgram, calc, Ctx, fmtResult, toDms, dotRows, prepareProgramImport, applyProgramImport, stageProgramImport };

</script>
</body>
</html>
