<script>
// One place for the build's name. It shows under the keypad and goes into the
// feedback form, so a tester's report can be matched to the build they ran.
// Bump MINOR when a mode lands (BASE / SD / REG / FMLA) or something as big
// as swapping out the whole display font; PATCH for fixes.
const VERSION = '0.11.0';
const BUILD_DATE = '2026-10-13';
// build.mjs replaces this one declaration when producing the 3650 build.
const MODEL = '50FHII';

// fx-50FH II emulator — 15-digit decimal arithmetic
// Mimics the calculator's internal format: 15-digit mantissa, exponent -99..99.
// Representation: value = s * m * 10^q   where m is a BigInt of exactly 15 digits (or 0n).
// Display exponent = q + 14.

const PREC = 15;
const TEN = 10n;
const pow10 = n => TEN ** BigInt(n);
const ndig = m => (m === 0n ? 0 : m.toString().length);

class CalcError extends Error {
  constructor(kind) { super(kind); this.kind = kind; }
}
const mathError = () => { throw new CalcError('Math ERROR'); };

class Dec {
  constructor(s, m, q) { this.s = s; this.m = m; this.q = q; }
  get exp() { return this.q + PREC - 1; }   // decimal exponent of leading digit
  isZero() { return this.m === 0n; }
  neg() { return this.isZero() ? this : new Dec(-this.s, this.m, this.q); }
  abs() { return new Dec(1, this.m, this.q); }
}

const ZERO = new Dec(1, 0n, 0);

// Build a normalised Dec from raw mantissa/exponent. Rounds half-up to 15 digits.
function mk(s, m, q) {
  if (m < 0n) { s = -s; m = -m; }
  if (m === 0n) return ZERO;
  const n = ndig(m);
  if (n > PREC) {
    const drop = n - PREC, div = pow10(drop);
    const r = m % div;
    m = m / div; q += drop;
    if (r * 2n >= div) {
      m += 1n;
      if (ndig(m) > PREC) { m /= TEN; q += 1; }
    }
  } else if (n < PREC) {
    const add = PREC - n;
    m *= pow10(add); q -= add;
  }
  return new Dec(s, m, q);
}

function fromString(str) {
  const t = String(str).trim().replace(/[−–]/g, '-');
  const mm = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d+))?$/.exec(t);
  if (!mm || (!mm[2] && !mm[3])) throw new CalcError('Syntax ERROR');
  const s = mm[1] === '-' ? -1 : 1;
  const ip = mm[2] || '', fp = mm[3] || '';
  const digits = (ip + fp).replace(/^0+(?=\d)/, '') || '0';
  const q = -fp.length + (mm[4] ? parseInt(mm[4], 10) : 0);
  return mk(s, BigInt(digits), q);
}

const fromInt = n => mk(n < 0 ? -1 : 1, BigInt(Math.abs(n)), 0);

// Convert a JS double in. 17 significant digits then round to 15 — this is what
// makes sin(30) come out as exactly 0.5 rather than 0.49999999999999994.
function fromNumber(x) {
  if (!isFinite(x)) mathError();
  if (x === 0) return ZERO;
  return fromString(x.toExponential(16));
}

const toNumber = d => Number(`${d.s < 0 ? '-' : ''}${d.m}e${d.q}`);

function add(a, b) {
  if (a.isZero()) return b;
  if (b.isZero()) return a;
  const q = Math.min(a.q, b.q);
  const da = a.q - q, db = b.q - q;
  if (da > 40) return a;          // b is below the guard digits
  if (db > 40) return b;
  const m = a.m * pow10(da) * BigInt(a.s) + b.m * pow10(db) * BigInt(b.s);
  return mk(1, m, q);
}

const sub = (a, b) => add(a, b.neg());
const mul = (a, b) => (a.isZero() || b.isZero()) ? ZERO : mk(a.s * b.s, a.m * b.m, a.q + b.q);

function div(a, b) {
  if (b.isZero()) mathError();
  if (a.isZero()) return ZERO;
  const G = 25;                    // guard digits
  return mk(a.s * b.s, (a.m * pow10(G)) / b.m, a.q - b.q - G);
}

function cmp(a, b) {
  const d = sub(a, b);
  return d.isZero() ? 0 : d.s;
}
const eq = (a, b) => cmp(a, b) === 0;

function isInteger(d) {
  if (d.isZero()) return true;
  if (d.q >= 0) return true;
  const div_ = pow10(-d.q);
  return d.m % div_ === 0n;
}

// Round to `sig` significant digits (value preserved, still stored as 15 digits).
function roundSig(d, sig) {
  if (d.isZero() || sig >= PREC) return d;
  const drop = PREC - sig, div_ = pow10(drop);
  let m = d.m / div_;
  if ((d.m % div_) * 2n >= div_) m += 1n;
  return mk(d.s, m, d.q + drop);
}

// Round to `dp` decimal places.
function roundDp(d, dp) {
  if (d.isZero()) return d;
  const k = d.q + dp;
  if (k >= 0) return d;
  const div_ = pow10(-k);
  let m = d.m / div_;
  if ((d.m % div_) * 2n >= div_) m += 1n;
  return mk(d.s, m, -dp);
}

const OVERFLOW_EXP = 100;
function checkRange(d) {
  if (!d.isZero() && d.exp >= OVERFLOW_EXP) mathError();
  return d;
}

// ---------------------------------------------------------------- formatting

// digits(d, n) -> { sign, ds (n chars), exp }
function digitsOf(d, n) {
  const r = roundSig(d, n);
  return { s: r.s, ds: r.m.toString().slice(0, n), exp: r.exp };
}

// The mantissa field is 10 digit characters wide and the leading "0" of a
// number below 1 occupies one of them. Verified on the machine:
//   1÷2π  -> 0.159154943   (not 0.1591549431)
//   1÷2√2 -> 0.35355339    (10 digits "0.353553390", trailing zero stripped)
// Digits past the tenth character are cut, not re-rounded.
const FIELD = 10;
function plain(sign, ds, exp, cap = false) {
  let out;
  if (exp >= 0) {
    const ip = ds.length > exp + 1 ? ds.slice(0, exp + 1) : ds.padEnd(exp + 1, '0');
    let fp = ds.length > exp + 1 ? ds.slice(exp + 1) : '';
    fp = fp.replace(/0+$/, '');
    out = fp ? `${ip}.${fp}` : ip;
  } else {
    let d = ds;
    if (cap) d = d.slice(0, Math.max(0, FIELD + exp));   // leading 0 + zeros eat places
    const fp = ('0'.repeat(-exp - 1) + d).replace(/0+$/, '');
    out = `0.${fp || '0'}`;
  }
  return (sign < 0 ? '-' : '') + out;
}

/**
 * Format a result the way the calculator's lower display line shows it.
 * cfg: { disp: 'norm1'|'norm2'|'fix'|'sci', n }
 * Returns { mant, exp } — exp null means plain notation.
 */
function format(d, cfg = { disp: 'norm1' }) {
  const disp = cfg.disp || 'norm1';
  const n = cfg.n ?? 0;

  if (disp === 'sci') {
    const sig = n === 0 ? 10 : n;
    const g = digitsOf(d, sig);
    if (d.isZero()) return { mant: sig > 1 ? `0.${'0'.repeat(sig - 1)}` : '0', exp: 0 };
    const mant = (g.s < 0 ? '-' : '') + (sig > 1 ? `${g.ds[0]}.${g.ds.slice(1)}` : g.ds[0]);
    return { mant, exp: g.exp };
  }

  if (disp === 'fix') {
    const r = roundDp(d, n);
    // Too big for the display: the machine falls back to plain Norm1 exponential
    // (trailing zeros stripped), NOT to a Fix-padded mantissa. Confirmed on the machine.
    if (r.exp >= 10) return format(r, { disp: 'norm1' });
    const sign = r.s < 0 && !r.isZero() ? '-' : '';
    if (r.isZero()) return { mant: n ? `0.${'0'.repeat(n)}` : '0', exp: null };
    const sig = Math.max(1, r.exp + 1 + n);
    const g = digitsOf(r, Math.min(sig, PREC));
    let body = plain(1, g.ds, g.exp);
    if (n > 0) {
      const dot = body.indexOf('.');
      if (dot < 0) body += '.' + '0'.repeat(n);
      else body = body.padEnd(dot + 1 + n, '0');
    } else if (body.includes('.')) body = body.split('.')[0];
    return { mant: sign + body, exp: null };
  }

  // Norm1 / Norm2
  if (d.isZero()) return { mant: '0', exp: null };
  const g = digitsOf(d, 10);
  const lo = disp === 'norm2' ? -10 : -3;      // norm1: |x|<10^-2 -> exp <= -3
  if (g.exp <= lo || g.exp >= 10) {
    const ds = g.ds.replace(/0+$/, '') || '0';
    const mant = (g.s < 0 ? '-' : '') + (ds.length > 1 ? `${ds[0]}.${ds.slice(1)}` : ds[0]);
    return { mant, exp: g.exp };
  }
  return { mant: plain(g.s, g.ds, g.exp, true), exp: null };
}

// Engineering notation: shift exponent to a multiple of 3. dir -1 = ENG, +1 = ENG<-
function engShift(d, cur, dir) {
  const step = dir < 0 ? 3 : -3;
  return { d, engExp: cur + step };
}

function formatEng(d, engExp) {
  if (d.isZero()) return { mant: '0', exp: engExp };
  const scaled = mk(d.s, d.m, d.q - engExp);
  const g = digitsOf(scaled, 10);
  return { mant: plain(g.s, g.ds, g.exp), exp: engExp };
}

function toDisplayString(d, cfg) {
  const f = format(d, cfg);
  return f.exp === null ? f.mant : `${f.mant}×10^${f.exp}`;
}

// fx-50FH II scientific constants: CODATA 2010, SPEC §9.
// qₑ names the elementary-charge key; bare e remains Euler’s number.
const SCI_CONSTANTS = [
  ['mp', '1.672621777e-27'], ['mn', '1.674927351e-27'], ['me', '9.10938291e-31'], ['mμ', '1.883531475e-28'],
  ['a₀', '5.2917721092e-11'], ['h', '6.62606957e-34'], ['μN', '5.05078353e-27'], ['μB', '9.27400968e-24'],
  ['ħ', '1.054571726e-34'], ['α', '7.2973525698e-3'], ['re', '2.8179403267e-15'], ['λc', '2.4263102389e-12'],
  ['γp', '267522200.5'], ['λcp', '1.32140985623e-15'], ['λcn', '1.3195909068e-15'], ['R∞', '10973731.568539'],
  ['u', '1.660538921e-27'], ['μp', '1.410606743e-26'], ['μe', '-9.2847643e-24'], ['μn', '-9.6623647e-27'],
  ['μμ', '-4.49044807e-26'], ['F', '96485.3365'], ['e', '1.602176565e-19'], ['NA', '6.02214129e23'],
  ['k', '1.3806488e-23'], ['Vm', '0.022710953'], ['R', '8.3144621'], ['C₀', '299792458'],
  ['C₁', '3.74177153e-16'], ['C₂', '0.01438777'], ['σ', '5.670373e-8'], ['ε₀', '8.854187817e-12'],
  ['μ₀', '12.566370614e-7'], ['φ₀', '2.067833758e-15'], ['g', '9.80665'], ['G₀', '7.7480917346e-5'],
  ['Z₀', '376.730313461'], ['t', '273.15'], ['G', '6.67384e-11'], ['atm', '101325'],
]
const sciToken = symbol => symbol === "e" ? "qₑ" : symbol;
const SCI_VALUES = Object.fromEntries(SCI_CONSTANTS.flatMap(([symbol,value],i) => [[sciToken(symbol),value],[`CONST(${i+1})`,value]]));
const SCI_NAMES = Object.keys(SCI_VALUES).sort((a,b)=>b.length-a.length);

// Numerical integration and differentiation for the fx-3650P II.
// The 15-point Gauss–Kronrod pair estimates its own integration error.
// The expression is parsed once by engine.mjs; sample() only changes X.
const GK_X = [0.9914553711208126, 0.9491079123427585, 0.8648644233597691,
  0.7415311855993945, 0.5860872354676911, 0.4058451513773972,
  0.2077849550078985, 0];
const GK_W = [0.022935322010529225, 0.06309209262997855, 0.10479001032225018,
  0.14065325971552592, 0.1690047266392679, 0.19035057806478542,
  0.2044329400752989, 0.20948214108472783];
const G_W = [0, 0.1294849661688697, 0, 0.27970539148927664,
  0, 0.3818300505051189, 0, 0.4179591836734694];

function integrate(sample, a, b, tolerance = 1e-5) {
  if (a === b) return 0;
  const sign = b < a ? -1 : 1;
  if (sign < 0) [a, b] = [b, a];
  let result = 0, used = 0;
  const stack = [[a, b]];
  while (stack.length) {
    const [lo, hi] = stack.pop();
    const mid = (lo + hi) / 2, half = (hi - lo) / 2;
    let kronrod = GK_W[7] * sample(mid);
    let gauss = G_W[7] * sample(mid);
    used++;
    for (let j = 0; j < 7; j++) {
      const pair = sample(mid - half * GK_X[j]) + sample(mid + half * GK_X[j]);
      used += 2;
      kronrod += GK_W[j] * pair;
      gauss += G_W[j] * pair;
    }
    kronrod *= half; gauss *= half;
    // Scale each interval's allowance by its share of the original domain.
    const allowance = tolerance * (hi - lo) / (b - a) * Math.max(1, Math.abs(kronrod));
    if (Math.abs(kronrod - gauss) <= allowance) result += kronrod;
    else {
      if (used >= 30000 || mid === lo || mid === hi) throw new Error('Time Out Error');
      stack.push([mid, hi], [lo, mid]);
    }
  }
  return sign * result;
}

function differentiate(sample, x, tolerance = 1e-10) {
  const scale = Math.max(1, Math.abs(x));
  let h = scale * 1e-3, previous = null;
  for (let k = 0; k < 16; k++) {
    const coarse = (sample(x + h) - sample(x - h)) / (2 * h);
    const fine = (sample(x + h / 2) - sample(x - h / 2)) / h;
    const estimate = (4 * fine - coarse) / 3;
    if (previous !== null && Math.abs(estimate - previous) <= tolerance * Math.max(1, Math.abs(estimate)))
      return estimate;
    previous = estimate;
    h /= 2;
  }
  throw new Error('Time Out Error');
}


// fx-50FH II emulator — expression engine (lexer + parser + evaluator)
// Precedence follows the official 12-level table in SPEC.md §8.





const err = k => { throw new CalcError(k); };
const mathErr = () => err('Math ERROR');
const synErr = () => err('Syntax ERROR');

// ------------------------------------------------------------ complex layer
// A value is a Dec (real) or a Cx (complex). Cx is only produced when the
// imaginary part is non-zero, so real-only work never pays for complex code.
class Cx {
  constructor(re, im) { this.re = re; this.im = im; }
}
const isCx = v => v instanceof Cx;
const RE = v => (isCx(v) ? v.re : v);
const IM = v => (isCx(v) ? v.im : ZERO);
const cx = (re, im) => (im.isZero() ? re : new Cx(re, im));

const cadd = (a, b) => cx(add(RE(a), RE(b)), add(IM(a), IM(b)));
const csub = (a, b) => cx(sub(RE(a), RE(b)), sub(IM(a), IM(b)));
const cmul = (a, b) => cx(
  sub(mul(RE(a), RE(b)), mul(IM(a), IM(b))),
  add(mul(RE(a), IM(b)), mul(IM(a), RE(b))));
function cdiv(a, b) {
  const c = RE(b), d = IM(b);
  const den = add(mul(c, c), mul(d, d));
  if (den.isZero()) mathErr();
  return cx(div(add(mul(RE(a), c), mul(IM(a), d)), den),
            div(sub(mul(IM(a), c), mul(RE(a), d)), den));
}
const cabs = v => (isCx(v) ? fromNumber(Math.hypot(toNumber(v.re), toNumber(v.im))) : v.abs());
const cconj = v => (isCx(v) ? new Cx(v.re, v.im.neg()) : v);
function cpowInt(z, k) {
  if (k < 0) return cdiv(ONE, cpowInt(z, -k));
  let r = ONE;
  for (let i = 0; i < k; i++) r = cmul(r, z);
  return r;
}

// dispatchers used by the evaluator
const vadd = (a, b) => (isCx(a) || isCx(b) ? cadd(a, b) : add(a, b));
const vsub = (a, b) => (isCx(a) || isCx(b) ? csub(a, b) : sub(a, b));
const vmul = (a, b) => (isCx(a) || isCx(b) ? cmul(a, b) : mul(a, b));
const vdiv = (a, b) => (isCx(a) || isCx(b) ? cdiv(a, b) : div(a, b));
const vcheck = v => { if (isCx(v)) { checkRange(v.re); checkRange(v.im); return v; } return checkRange(v); };

// ------------------------------------------------------------------ lexer

// Longest match first.
const LIT = [
  ...SCI_NAMES.filter(s => s !== 'σ').map(s => [s, 'CONST', s]),
  ['d/dx(', 'FN', 'diff'], ['∫(', 'FN', 'integral'],
  ['sinh⁻¹(', 'FN', 'asinh'], ['cosh⁻¹(', 'FN', 'acosh'], ['tanh⁻¹(', 'FN', 'atanh'],
  ['sin⁻¹(', 'FN', 'asin'], ['cos⁻¹(', 'FN', 'acos'], ['tan⁻¹(', 'FN', 'atan'],
  ['asinh(', 'FN', 'asinh'], ['acosh(', 'FN', 'acosh'], ['atanh(', 'FN', 'atanh'],
  ['sinh(', 'FN', 'sinh'], ['cosh(', 'FN', 'cosh'], ['tanh(', 'FN', 'tanh'],
  ['asin(', 'FN', 'asin'], ['acos(', 'FN', 'acos'], ['atan(', 'FN', 'atan'],
  ['sin(', 'FN', 'sin'], ['cos(', 'FN', 'cos'], ['tan(', 'FN', 'tan'],
  ['log(', 'FN', 'log'], ['ln(', 'FN', 'ln'],
  ['e^(', 'FN', 'exp'], ['10^(', 'FN', 'pow10'],
  ['³√(', 'FN', 'cbrt'], ['cbrt(', 'FN', 'cbrt'],
  ['√(', 'FN', 'sqrt'], ['sqrt(', 'FN', 'sqrt'],
  ['Abs(', 'FN', 'abs'], ['Rnd(', 'FN', 'rnd'],
  ['Conjg(', 'FN', 'conjg'], ['arg(', 'FN', 'arg'],
  ['▸a+bi', 'POST', 'torect'], ['▸r∠θ', 'POST', 'topolar'],
  ['∠', 'OP', 'ang'],
  ['Pol(', 'FN', 'pol'], ['Rec(', 'FN', 'rec'],
  ['Ran#', 'RAN', null],
  ['Ans', 'VAR', 'Ans'],
  // SD single-variable statistics. Longest first so Σx² beats Σx, and minX /
  // maxX beat the bare X variable. σx² is not a token — it is σx with the x²
  // key after it, exactly as the machine makes you type it (SPEC §11b).
  ['Σx²y','STAT','sumx2y'], ['Σx³','STAT','sumx3'], ['Σx⁴','STAT','sumx4'],
  ['Σxy','STAT','sumxy'], ['Σy²','STAT','ysumsq'], ['Σy','STAT','ysum'],
  ['ȳ','STAT','ymean'], ['σy','STAT','ysd'], ['sy','STAT','yssd'],
  ['x̂','POST','predictX'], ['ŷ','POST','predictY'],
  ['regA','STAT','regA'], ['regB','STAT','regB'], ['regR','STAT','regR'],
  ['a','STAT','regA'], ['b','STAT','regB'], ['r','STAT','regR'],
  ['Σx²', 'STAT', 'sumsq'], ['Σx', 'STAT', 'sum'],
  ['x̄', 'STAT', 'mean'], ['σx', 'STAT', 'sd'], ['sx', 'STAT', 'ssd'],
  ['σ', 'CONST', 'σ'],
  ['minX', 'STAT', 'min'], ['maxX', 'STAT', 'max'],
  ['nPr', 'OP', 'nPr'], ['nCr', 'OP', 'nCr'],
  // AFTER nPr / nCr: this table is scanned in order, and a bare 'n' placed
  // earlier would swallow the first letter of both.
  ['n', 'STAT', 'count'],
  ['ˣ√', 'OP', 'xroot'], ['x√', 'OP', 'xroot'],
  ['⁻¹', 'POST', 'inv'], ['²', 'POST', 'sq'], ['³', 'POST', 'cube'],
  ['π', 'CONST', 'pi'], ['pi', 'CONST', 'pi'],
  ['>=', 'REL', 'ge'], ['<=', 'REL', 'le'], ['<>', 'REL', 'ne'],
  ['≠', 'REL', 'ne'], ['≥', 'REL', 'ge'], ['≤', 'REL', 'le'],
  ['=', 'REL', 'eq'], ['>', 'REL', 'gt'], ['<', 'REL', 'lt'],
  ['×', 'OP', 'mul'], ['*', 'OP', 'mul'], ['÷', 'OP', 'div'], ['/', 'OP', 'div'],
  ['+', 'OP', 'addop'], ['-', 'OP', 'subop'], ['−', 'OP', 'subop'],
  ['^', 'OP', 'pow'],
  ['(', 'LP', null], [')', 'RP', null], [',', 'COMMA', null],
  ['!', 'POST', 'fact'], ['%', 'POST', 'pct'],
  ['°', 'DMS', null], ["'", 'DMS', null], ['"', 'DMS', null],
  ['⌐', 'FRAC', null], ['」', 'FRAC', null], ['_', 'FRAC', null],
  ['→', 'ASSIGN', null],
  ['ᵈ', 'POST', 'udeg'], ['ʳ', 'POST', 'urad'], ['ᵍ', 'POST', 'ugra'],
  ['e', 'CONST', 'e'], ['i', 'CONST', 'i'],
].sort((a,b) => b[0].length-a[0].length);
const VARS = ['A', 'B', 'C', 'D', 'X', 'Y', 'M'];
const NUMRE = /^(?:\d+\.?\d*|\.\d+)(?:[Eᴇ][+-]?\d+)?/;

function lex(src) {
  const out = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === ' ' || c === '\t') { i++; continue; }
    const rest = src.slice(i);
    const nm = NUMRE.exec(rest);
    if (nm && /[\d.]/.test(c)) {
      out.push({ type: 'NUM', text: nm[0].replace('ᴇ', 'E'), hasPoint: nm[0].includes('.'), pos: i });
      i += nm[0].length;
      continue;
    }
    // EXP with no mantissa in front of it means 1: ᴇ3 is 1000.
    // (Nixon's published programs write ᴇ3 → X for 1000 → X, two bytes.)
    // The key types ᴇ, U+1D07 — 'E' is only what the engine writes internally,
    // so both spellings have to lex. His Prog04 opens with "ᴇ-4i→X".
    if (c === 'E' || c === 'ᴇ') {
      const em = /^[Eᴇ]([+-]?\d+)/.exec(rest);
      if (em) {
        out.push({ type: 'NUM', text: `1E${em[1]}`, hasPoint: false, pos: i });
        i += em[0].length;
        continue;
      }
    }
    let hit = null;
    for (const [lit, type, val] of LIT) {
      if (rest.startsWith(lit)) { hit = { type, val, text: lit }; break; }
    }
    if (!hit && VARS.includes(c)) hit = { type: 'VAR', val: c, text: c };
    if (!hit) { const e = new CalcError('Syntax ERROR'); e.pos = i; throw e; }
    hit.pos = i;
    out.push(hit);
    i += hit.text.length;
  }
  return out;
}

// ----------------------------------------------------------------- parser

const BP = {
  assign: 15, or: 20, and: 30, rel: 40, addsub: 50, muldiv: 60,
  ncr: 70, implicit: 80, prefix: 90, frac: 100, post: 110,
};

const STARTERS = new Set(['NUM', 'CONST', 'VAR', 'FN', 'LP', 'RAN']);

// How many arguments each bracketed function may take. Everything not listed
// takes exactly one, and must therefore NOT swallow a comma: in
// "log(Abs(D,Abs(BD」A" the comma belongs to log(, and Abs( has to close first.
// Nixon's published Prog03 is written that way, so getting this wrong makes a
// published program quietly return the wrong number.
const MAX_ARGS = { log: 2, pol: 2, rec: 2, integral: 4, diff: 3 };

class Parser {
  constructor(toks, len) { this.t = toks; this.i = 0; this.len = len; }
  fail() {
    const t = this.peek();
    const e = new CalcError('Syntax ERROR');
    e.pos = t ? t.pos : this.len;
    throw e;
  }
  peek(k = 0) { return this.t[this.i + k]; }
  next() { return this.t[this.i++]; }
  eat(type) { if (this.peek() && this.peek().type === type) { this.i++; return true; } return false; }
  // A missing closing paren is legal at the end of the expression, and also
  // immediately before "→ variable": the machine closes every open bracket
  // before it stores. So -B」(2A→X means -B」(2A)→X, and √(D→Y means √(D)→Y.
  // Nixon's published programs rely on this everywhere.
  closeParen() {
    if (this.eat('RP')) return;
    const t = this.peek();
    // nothing left, "→ variable", or a comma belonging to an enclosing
    // two-argument function — all of these close the bracket for you
    if (!t || t.type === 'ASSIGN' || t.type === 'COMMA') return;
    this.fail();
  }

  parse() {
    const n = this.expr(0);
    if (this.peek()) this.fail();
    return n;
  }

  atom() {
    const t = this.peek();
    if (!t) this.fail();
    if (t.type === 'OP' && t.val === 'subop') { this.next(); return { k: 'neg', x: this.expr(BP.prefix) }; }
    if (t.type === 'OP' && t.val === 'addop') { this.next(); return this.expr(BP.prefix); }
    this.next();
    switch (t.type) {
      case 'NUM': return { k: 'num', v: fromString(t.text.replace('E', 'e')), hasPoint: t.hasPoint };
      case 'CONST': return { k: 'const', name: t.val };
      case 'VAR': return { k: 'var', name: t.val };
      case 'STAT': return { k: 'stat', name: t.val };
      case 'RAN': return { k: 'ran' };
      // Bracket contents stop short of "→": assignment is a statement-level
      // operator, so it can never live inside a bracket (see closeParen).
      case 'LP': { const e = this.expr(BP.assign + 1); this.closeParen(); return e; }
      case 'FN': {
        const max = MAX_ARGS[t.val] ?? 1;
        const args = [this.expr(BP.assign + 1)];
        while (args.length < max && this.eat('COMMA')) args.push(this.expr(BP.assign + 1));
        this.closeParen();
        return { k: 'fn', name: t.val, args };
      }
      default: return this.fail();
    }
  }

  expr(minbp) {
    let left = this.atom();
    for (;;) {
      const t = this.peek();
      if (!t) break;

      if (t.type === 'POST') {
        if (BP.post < minbp) break;
        this.next();
        left = { k: 'post', op: t.val, x: left };
        continue;
      }
      if (t.type === 'DMS') {
        if (BP.post < minbp) break;
        this.next();
        const parts = [left];
        while (parts.length < 3 && this.peek() && this.peek().type === 'NUM'
               && this.peek(1) && this.peek(1).type === 'DMS') {
          parts.push({ k: 'num', v: fromString(this.next().text.replace('E', 'e')) });
          this.next();
        }
        left = { k: 'dms', parts };
        continue;
      }
      if (t.type === 'FRAC') {
        if (BP.frac < minbp) break;
        const parts = [left];
        while (parts.length < 3 && this.peek() && this.peek().type === 'FRAC') {
          this.next();
          parts.push(this.expr(BP.frac + 1));
        }
        left = { k: 'frac', parts };
        continue;
      }
      if (t.type === 'OP') {
        const o = t.val;
        if (o === 'pow' || o === 'xroot') {
          if (BP.post < minbp) break;
          this.next();
          left = { k: o, l: left, r: this.expr(BP.post) };     // right-assoc
          continue;
        }
        if (o === 'nPr' || o === 'nCr' || o === 'ang') {
          if (BP.ncr < minbp) break;
          this.next();
          left = { k: o, l: left, r: this.expr(BP.ncr + 1) };
          continue;
        }
        if (o === 'mul' || o === 'div') {
          if (BP.muldiv < minbp) break;
          this.next();
          left = { k: 'bin', op: o, l: left, r: this.expr(BP.muldiv + 1) };
          continue;
        }
        if (o === 'addop' || o === 'subop') {
          if (BP.addsub < minbp) break;
          this.next();
          left = { k: 'bin', op: o, l: left, r: this.expr(BP.addsub + 1) };
          continue;
        }
      }
      if (t.type === 'ASSIGN') {
        if (BP.assign < minbp) break;
        this.next();
        const v = this.next();
        if (!v || v.type !== 'VAR') this.fail();
        left = { k: 'store', x: left, name: v.val };
        continue;
      }
      if (t.type === 'REL') {
        if (BP.rel < minbp) break;
        this.next();
        left = { k: 'rel', op: t.val, l: left, r: this.expr(BP.rel + 1) };
        continue;
      }
      // implicit multiplication — binds tighter than × ÷ (official level 6)
      if (STARTERS.has(t.type)) {
        if (BP.implicit < minbp) break;
        left = { k: 'bin', op: 'mul', l: left, r: this.expr(BP.implicit + 1), implicit: true };
        continue;
      }
      break;
    }
    return left;
  }
}

const parse = src => new Parser(lex(src), src.length).parse();

// -------------------------------------------------------------- evaluator

const PI = fromString('3.14159265358980');
const E_ = fromString('2.71828182845904');

const D180 = fromInt(180), D200 = fromInt(200), D100 = fromInt(100), D60 = fromInt(60);
const D3600 = fromInt(3600), ONE = fromInt(1), TWO = fromInt(2);

function toRad(d, unit) {
  if (unit === 'rad') return d;
  return div(mul(d, PI), unit === 'gra' ? D200 : D180);
}
function fromRad(d, unit) {
  if (unit === 'rad') return d;
  return div(mul(d, unit === 'gra' ? D200 : D180), PI);
}

const trigLimit = { deg: 9e9, rad: 157079632.7, gra: 1e10 };
const PERIOD = { deg: 360, gra: 400 };

/** sin/cos/tan with exact values at the quarter-turns, so sin(180) is really 0. */
function trigOf(name, v, unit) {
  const period = PERIOD[unit];
  if (period) {
    let r = v % period;
    if (r < 0) r += period;
    const q = period / 4;
    if (r % q === 0) {
      const k = Math.round(r / q) % 4;
      const S_ = [0, 1, 0, -1][k], C_ = [1, 0, -1, 0][k];
      if (name === 'sin') return fromInt(S_);
      if (name === 'cos') return fromInt(C_);
      if (C_ === 0) mathErr();                 // tan 90, tan 270
      return fromInt(S_ === 0 ? 0 : S_ / C_);
    }
    return fromNumber(Math[name]((r / period) * 2 * Math.PI));
  }
  return fromNumber(Math[name](v));
}

/** radians (from JS) back into the current angle unit, exactly: acos(-1) is 180. */
function degOf(rad, unit) {
  if (unit === 'rad') return fromNumber(rad);
  return fromNumber((rad / Math.PI) * (unit === 'gra' ? 200 : 180));
}

function bigFact(n) { let r = 1n; for (let i = 2n; i <= n; i++) r *= i; return r; }

function intPow(base, k) {
  // exact integer power via BigInt so that 2^10 is exactly 1024
  const neg = k < 0; k = Math.abs(k);
  if (k === 0) return ONE;
  let r = mk(base.s ** (k % 2 === 0 ? 2 : 1) < 0 ? -1 : 1, base.m ** BigInt(k), base.q * k);
  r = mk(base.s < 0 && k % 2 === 1 ? -1 : 1, base.m ** BigInt(k), base.q * k);
  return neg ? div(ONE, r) : r;
}

class Ctx {
  constructor(opts = {}) {
    this.angle = opts.angle || 'deg';           // deg | rad | gra
    this.disp = opts.disp || { disp: 'norm1' };  // norm1 | norm2 | fix | sci
    this.frac = opts.frac || 'ab/c';             // ab/c | d/c
    this.cplx = opts.cplx || 'a+bi';             // a+bi | r∠θ
    this.mode = opts.mode || 'COMP';             // COMP | CMPLX | BASE | SD | REG | PRGM
    this.model = opts.model || MODEL;
    this.vars = { A: ZERO, B: ZERO, C: ZERO, D: ZERO, X: ZERO, Y: ZERO, M: ZERO, Ans: ZERO };
    this.rng = opts.rng || Math.random;
    // SD samples: one entry per DT press, each {v, f} = value and frequency.
    // Leaving SD (or ClrStat) empties it — SPEC §11b.
    this.stat = [];
    this.freqOn = opts.freqOn !== false;
    this.regType = 'LIN';
    this.reset();
  }
  reset() { this.sawFrac = false; this.sawPoint = false; this.sawDms = false; this.forceCplx = null; }
}

function evalNode(n, ctx) {
  switch (n.k) {
    case 'num':
      if (n.hasPoint) ctx.sawPoint = true;
      return n.v;
    case 'const':
      if (Object.prototype.hasOwnProperty.call(SCI_VALUES, n.name)) return fromString(SCI_VALUES[n.name]);
      if (n.name === 'pi') return PI;
      if (n.name === 'e') return E_;
      return new Cx(ZERO, ONE);                    // i
    case 'var': return ctx.vars[n.name] ?? ZERO;
    case 'stat': return statValue(n.name, ctx);
    case 'ran': return fromString((Math.floor(ctx.rng() * 1000) / 1000).toFixed(3));
    case 'neg': {
      const v = evalNode(n.x, ctx);
      return isCx(v) ? new Cx(v.re.neg(), v.im.neg()) : v.neg();
    }

    case 'bin': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      switch (n.op) {
        case 'addop': return vcheck(vadd(a, b));
        case 'subop': return vcheck(vsub(a, b));
        case 'mul': return vcheck(vmul(a, b));
        case 'div': return vcheck(vdiv(a, b));
      }
      break;
    }

    case 'ang': {                                   // r∠θ  -> complex
      const r = evalNode(n.l, ctx), th = evalNode(n.r, ctx);
      if (isCx(r) || isCx(th)) mathErr();
      const rad = toNumber(toRad(th, ctx.angle));
      return vcheck(cx(mul(r, fromNumber(Math.cos(rad))), mul(r, fromNumber(Math.sin(rad)))));
    }

    case 'rel': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      if (isCx(a) || isCx(b)) {
        // Nixon's realCal confirmation: compare both components for = and ≠.
        if (n.op === 'eq' || n.op === 'ne') {
          const same = eq(RE(a), RE(b)) && eq(IM(a), IM(b));
          return (n.op === 'eq' ? same : !same) ? ONE : ZERO;
        }
        mathErr();
      }
      const c = cmp(a, b);
      const t = { eq: c === 0, ne: c !== 0, gt: c > 0, ge: c >= 0, lt: c < 0, le: c <= 0 }[n.op];
      return t ? ONE : ZERO;      // relational ops return 1 / 0 (goes to Ans)
    }

    case 'frac': {
      ctx.sawFrac = true;
      const p = n.parts.map(x => evalNode(x, ctx));
      // A complex part is never an integer, and isInteger() would crash on one.
      // Nixon's Co-Geo program divides complex numbers with the fraction key all
      // through ("Y」(B−C", "abs(C」2(M−Conjg(M"), so this path has to hold up.
      if (p.some(x => isCx(x) || !isInteger(x))) ctx.sawPoint = true;
      if (p.length === 2) return vcheck(vdiv(p[0], p[1]));
      if (p.length === 3) {
        // a b/c needs a sign to decide add-or-subtract, which a complex whole
        // part does not have. The machine has no complex mixed fraction either.
        if (p.some(isCx)) mathErr();
        const f = div(p[1], p[2]);
        return p[0].s < 0 ? sub(p[0], f) : add(p[0], f);
      }
      return p[0];
    }

    case 'dms': {
      ctx.sawDms = true;
      const p = n.parts.map(x => evalNode(x, ctx));
      const sign = p[0].s < 0 ? -1 : 1;
      let v = p[0].abs();
      if (p[1]) v = add(v, div(p[1], D60));
      if (p[2]) v = add(v, div(p[2], D3600));
      return sign < 0 ? v.neg() : v;
    }

    case 'post': {
      const x = evalNode(n.x, ctx);
      switch (n.op) {
        case 'sq': return vcheck(vmul(x, x));
        case 'cube': return vcheck(vmul(vmul(x, x), x));
        case 'inv':
          if (isCx(x)) return vcheck(cdiv(ONE, x));
          return x.isZero() ? mathErr() : div(ONE, x);
        case 'torect': ctx.forceCplx = 'a+bi'; return x;
        case 'topolar': ctx.forceCplx = 'r∠θ'; return x;
      }
      if (isCx(x)) mathErr();
      switch (n.op) {
        case 'predictX': { const c = linearRegression(ctx); if(c.b.isZero()) mathErr(); return div(sub(x,c.a),c.b); }
        case 'predictY': { const c = linearRegression(ctx); return add(c.a,mul(c.b,x)); }
        case 'pct': return div(x, D100);
        case 'udeg': return fromRad(toRad(x, 'deg'), ctx.angle);
        case 'urad': return fromRad(x, ctx.angle);
        case 'ugra': return fromRad(toRad(x, 'gra'), ctx.angle);
        case 'fact': {
          if (!isInteger(x) || x.s < 0 || cmp(x, fromInt(69)) > 0) mathErr();
          return mk(1, bigFact(BigInt(Math.round(toNumber(x)))), 0);
        }
      }
      break;
    }

    case 'pow': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      if (isCx(a)) {
        // Verified on the machine: a complex base accepts ^2 and ^3 only —
        // ^1, ^0 and fractional powers all give Math ERROR.
        if (isCx(b) || !isInteger(b)) mathErr();
        const k = toNumber(b);
        if (k !== 2 && k !== 3) mathErr();
        return vcheck(cpowInt(a, k));
      }
      if (isCx(b)) mathErr();
      return checkRange(power(a, b));
    }
    case 'xroot': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);   // a-th root of b
      if (isCx(a) || isCx(b)) mathErr();
      if (a.isZero()) mathErr();
      return checkRange(power(b, div(ONE, a)));
    }

    case 'nPr': case 'nCr': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      if (isCx(a) || isCx(b)) mathErr();
      if (!isInteger(a) || !isInteger(b) || a.s < 0 || b.s < 0 || cmp(b, a) > 0) mathErr();
      const N = BigInt(Math.round(toNumber(a))), R = BigInt(Math.round(toNumber(b)));
      if (N > 100000n) mathErr();
      const p = bigFact(N) / bigFact(N - R);
      return checkRange(mk(1, n.k === 'nPr' ? p : p / bigFact(R), 0));
    }

    case 'store': {
      const v = evalNode(n.x, ctx);
      ctx.vars[n.name] = v;
      return v;
    }

    case 'fn': return callFn(n, ctx);
  }
  return synErr();
}

function power(a, b) {
  if (isInteger(b) && Math.abs(toNumber(b)) <= 64) return intPow(a, Math.round(toNumber(b)));
  if (a.s < 0) mathErr();                       // non-integer power of a negative number
  if (a.isZero()) return b.s > 0 ? ZERO : mathErr();
  return fromNumber(Math.pow(toNumber(a), toNumber(b)));
}

// Check the expression tree before evaluating any argument, so rejected
// Pol/Rec/nested calculus never changes X, Y, or other calculator state.
function containsFn(node, names) {
  if (!node || typeof node !== 'object') return false;
  if (node.k === 'fn' && names.includes(node.name)) return true;
  return Object.values(node).some(v => Array.isArray(v)
    ? v.some(child => containsFn(child, names)) : containsFn(v, names));
}

function calculus(n, ctx) {
  if (ctx.model !== '3650PII' || ctx.mode !== 'COMP') mathErr();
  const integral = n.name === 'integral';
  if (n.args.length < (integral ? 3 : 2)) synErr();
  if (n.args.some(arg => containsFn(arg, ['integral', 'diff'])) ||
      containsFn(n.args[0], ['pol', 'rec'])) mathErr();
  const hasTrig = containsFn(n.args[0], ['sin', 'cos', 'tan', 'asin', 'acos', 'atan']);
  if (hasTrig && ctx.angle !== 'rad') mathErr();
  const params = n.args.slice(1).map(arg => evalNode(arg, ctx));
  if (params.some(isCx)) mathErr();
  const values = params.map(toNumber);
  const tol = values[integral ? 2 : 1] ?? (integral ? 1e-5 : 1e-10);
  if (!Number.isFinite(tol) || tol < 1e-14) mathErr();
  const oldX = ctx.vars.X;
  const sample = x => {
    ctx.vars.X = fromNumber(x);
    const v = evalNode(n.args[0], ctx);
    if (isCx(v)) mathErr();
    return toNumber(v);
  };
  try {
    const v = integral
      ? integrate(sample, values[0], values[1], tol)
      : differentiate(sample, values[0], tol);
    // Remove accumulated binary quadrature noise below the engine's 15-digit
    // decimal precision; true-machine last-digit parity needs hardware data.
    return checkRange(fromNumber(Number(v.toPrecision(14))));
  } catch (e) {
    if (e.message === 'Time Out Error') err('Time Out Error');
    throw e;
  } finally {
    ctx.vars.X = oldX;
  }
}

function callFn(n, ctx) {
  if (n.name === 'integral' || n.name === 'diff') return calculus(n, ctx);
  const A = n.args.map(x => evalNode(x, ctx));
  const x = A[0];

  // complex-capable functions
  if (n.name === 'abs') return cabs(x);
  if (n.name === 'conjg') return cconj(x);
  // Rnd( takes a complex number too, rounding each half on its own (Nixon,
  // 2026-09-16). His Prog04 lives on it: with X = ᴇ-4i, a polynomial in X packs
  // its coefficients into one complex number, and Fix0 + Rnd( is what shakes
  // them back out one at a time — (2X+1)³ reads back 1, 6, 12, 8.
  if (n.name === 'rnd' && isCx(x)) return cx(applyRound(x.re, ctx), applyRound(x.im, ctx));
  if (n.name === 'arg') {
    if (!isCx(x)) return x.s < 0 && !x.isZero() ? fromRad(PI, ctx.angle) : ZERO;
    return fromRad(fromNumber(Math.atan2(toNumber(x.im), toNumber(x.re))), ctx.angle);
  }
  // everything else rejects complex arguments, exactly like the machine
  if (A.some(isCx)) mathErr();

  const u = ctx.angle;
  const num = toNumber(x);

  switch (n.name) {
    case 'sin': case 'cos': case 'tan': {
      if (Math.abs(num) >= trigLimit[u]) mathErr();
      return trigOf(n.name, num, u);
    }
    case 'asin': case 'acos':
      if (Math.abs(num) > 1) mathErr();
      return degOf(Math[n.name](num), u);
    case 'atan':
      return degOf(Math.atan(num), u);
    case 'sinh': case 'cosh': case 'tanh':
      return fromNumber(Math[n.name](num));
    case 'asinh': return fromNumber(Math.asinh(num));
    case 'acosh': if (num < 1) mathErr(); return fromNumber(Math.acosh(num));
    case 'atanh': if (Math.abs(num) >= 1) mathErr(); return fromNumber(Math.atanh(num));
    case 'log':
      if (A.length === 2) {                       // log(base, x)
        const bs = toNumber(A[0]), v = toNumber(A[1]);
        if (bs <= 0 || bs === 1 || v <= 0) mathErr();
        return fromNumber(Math.log(v) / Math.log(bs));
      }
      if (num <= 0) mathErr();
      return fromNumber(Math.log10(num));
    case 'ln': if (num <= 0) mathErr(); return fromNumber(Math.log(num));
    case 'exp': if (num > 230.2585092) mathErr(); return checkRange(fromNumber(Math.exp(num)));
    case 'pow10': if (num >= 100) mathErr(); return checkRange(fromNumber(Math.pow(10, num)));
    case 'sqrt':
      if (x.s < 0) {
        // √ of a negative real is fine in CMPLX mode: √(-4) = 2i
        if (ctx.mode !== 'CMPLX') mathErr();
        return new Cx(ZERO, fromNumber(Math.sqrt(-num)));
      }
      return fromNumber(Math.sqrt(num));
    case 'cbrt': return fromNumber(Math.cbrt(num));
    case 'rnd': return applyRound(x, ctx);
    case 'pol': {
      if (A.length < 2) synErr();          // Pol( needs both coordinates
      const [px, py] = A;
      const r = fromNumber(Math.hypot(toNumber(px), toNumber(py)));
      const th = fromRad(fromNumber(Math.atan2(toNumber(py), toNumber(px))), ctx.angle);
      ctx.vars.X = r; ctx.vars.Y = th;
      return r;
    }
    case 'rec': {
      if (A.length < 2) synErr();          // Rec( needs r and θ
      const [r, th] = A;
      const rad = toNumber(toRad(th, ctx.angle));
      const px = mul(r, fromNumber(Math.cos(rad)));
      const py = mul(r, fromNumber(Math.sin(rad)));
      ctx.vars.X = px; ctx.vars.Y = py;
      return px;
    }
  }
  return synErr();
}

// Rnd( — really round the value to the current display setting
function applyRound(x, ctx) {
  const c = ctx.disp;
  if (c.disp === 'fix') return roundDp(x, c.n);
  if (c.disp === 'sci') return roundSig(x, c.n === 0 ? 10 : c.n);
  return roundSig(x, 10);
}

// ------------------------------------------------------- result formatting

// Decimal -> fraction via continued fractions, respecting the 10-digit total rule.
function toFraction(d, style = 'ab/c') {
  if (d.isZero()) return null;
  const v = Math.abs(toNumber(d));
  let [h1, k1, h0, k0] = [1, 0, 0, 1];
  let xx = v;
  for (let i = 0; i < 32; i++) {
    const a = Math.floor(xx);
    [h1, h0] = [a * h1 + h0, h1];
    [k1, k0] = [a * k1 + k0, k1];
    if (k1 > 0 && Math.abs(v - h1 / k1) < 1e-11 * Math.max(1, v)) break;
    const frac = xx - a;
    if (frac < 1e-12) break;
    xx = 1 / frac;
  }
  if (!k1 || !isFinite(h1) || h1 > 1e10) return null;
  if (k1 === 1) return null;                       // whole number: not a fraction
  const sign = d.s < 0 ? -1 : 1;
  if (style === 'd/c') {
    if (String(h1).length + String(k1).length + 1 > 10) return null;
    return { sign, int: 0, num: h1, den: k1, mixed: false };
  }
  const int = Math.floor(h1 / k1), num = h1 % k1;
  if (int === 0) {
    if (String(h1).length + String(k1).length + 1 > 10) return null;
    return { sign, int: 0, num: h1, den: k1, mixed: false };
  }
  if (String(int).length + String(num).length + String(k1).length + 2 > 10) return null;
  return { sign, int, num, den: k1, mixed: true };
}

function toDms(d) {

    if (!t || t.t !== 'expr') pSynErr(t ? t.p : (after != null ? after : undefined));
    return t;
  };
  const nextExpr = (i, after) => nextTok(i, after).v;

  for (let i = 0; i < T.length; i++) {
    const t = T[i];

    if (t.t === 'sep') { segStart = t.p + 1; closeArrow(); continue; }
    if (t.t === 'disp') {
      emit({ op: 'DISP', at: t.p, text: S.slice(segStart, t.p).trim() });
      segStart = t.p + 1;
      closeArrow();
      continue;
    }
    if (t.t === 'arrow') {
      const last = code[code.length - 1];
      if (!last || last.op !== 'EXPR') pSynErr(t.p);
      last.op = 'JZ'; last.target = -1;
      arrow = code.length - 1;
      continue;
    }
    if (t.t === 'expr') {
      const m = /^\?\s*→\s*([A-DXYM])$/.exec(t.v);
      if (m) emit({ op: 'INPUT', name: m[1], at: t.p });
      else if (t.v.includes('?')) pSynErr(t.p); // Input must name a calculator variable.
      // The segment text rides along on EXPR too: when a program stops, the
      // machine leaves the LAST statement on the upper line even though it has
      // no ◢ (REAL, fx50-test-Prog1.mov ends on 'X-C→B' with its value showing).
      else emit({ op: 'EXPR', src: t.v, at: t.p, text: S.slice(segStart, t.p + t.v.length).trim() });
      continue;
    }

    switch (t.v) {
      case 'If': {
        // Nesting limits, SPEC §10. Nixon confirmed on the machine that an If
        // inside an If is a Syntax ERROR. Same-type loop nesting is also
        // forbidden (Nixon, 2026-10-05); mixed For/While is unverified.
        if (blocks.some(b => b.type === 'if')) pSynErr(t.p);
        const ct = nextTok(++i, t.p);
        // REAL, Nixon 2026-10-06: evaluating an If condition preserves Ans.
        // While also preserves Ans; the conditional arrow updates it.
        blocks.push({ type: 'if', jz: emit({ op: 'JZ', src: ct.v, at: ct.p, target: -1, preserveAns: true }), jmp: null });
        break;
      }
      case 'Then': break;                                  // marks the true branch
      case 'Else': {
        const b = blocks[blocks.length - 1];
        if (!b || b.type !== 'if') pSynErr(t.p);
        b.jmp = emit({ op: 'JMP', target: -1 });
        code[b.jz].target = code.length;
        break;
      }
      case 'IfEnd': {
        const b = blocks.pop();
        if (!b || b.type !== 'if') pSynErr(t.p);
        if (b.jmp !== null) code[b.jmp].target = code.length;
        else code[b.jz].target = code.length;
        break;
      }
      case 'While': {
        if (blocks.some(b => b.type === 'while' || b.type === 'for')) pSynErr(t.p); // Same-type forbidden; mixed For/While remains unverified.
        const top = code.length;
        const ct = nextTok(++i, t.p);
        blocks.push({ type: 'while', top, jz: emit({ op: 'JZ', src: ct.v, at: ct.p, target: -1, preserveAns: true }), breaks: [] });
        break;
      }
      case 'WhileEnd': {
        const b = blocks.pop();
        if (!b || b.type !== 'while') pSynErr(t.p);
        emit({ op: 'JMP', target: b.top });
        code[b.jz].target = code.length;
        b.breaks.forEach(x => { code[x].target = code.length; });
        break;
      }
      case 'For': {
        if (blocks.some(b => b.type === 'while' || b.type === 'for')) pSynErr(t.p); // No For inside While or For.
        const it = nextTok(++i, t.p);
        const initSrc = it.v;
        const vm = /→\s*([A-DXYM])\s*$/.exec(initSrc);
        if (!vm) pSynErr(it.p);
        emit({ op: 'EXPR', src: initSrc, at: it.p });
        if (!T[++i] || T[i].t !== 'kw' || T[i].v !== 'To') pSynErr(t.p);
        const endSrc = nextExpr(++i, t.p);
        let stepSrc = '1';
        if (T[i + 1] && T[i + 1].t === 'kw' && T[i + 1].v === 'Step') { i++; stepSrc = nextExpr(++i, t.p); }
        const top = code.length;
        blocks.push({
          type: 'for', top, varName: vm[1], stepSrc, breaks: [],
          test: emit({ op: 'FORTEST', varName: vm[1], endSrc, stepSrc, at: it.p, target: -1 }),
        });
        break;
      }
      case 'Next': {
        const b = blocks.pop();
        if (!b || b.type !== 'for') pSynErr(t.p);
        emit({ op: 'FORNEXT', varName: b.varName, stepSrc: b.stepSrc, top: b.top });
        code[b.test].target = code.length;
        b.breaks.forEach(x => { code[x].target = code.length; });
        break;
      }
      case 'Break': {
        const b = loop();
        if (!b) pSynErr(t.p);
        b.breaks.push(emit({ op: 'JMP', target: -1 }));
        break;
      }
      case 'Goto': emit({ op: 'GOTO', n: nextExpr(++i, t.p).trim(), at: t.p }); break;
      case 'Lbl': labels[nextExpr(++i, t.p).trim()] = code.length; break;
      case 'Fix': case 'Sci': emit({ op: 'SETUP', cmd: t.v, arg: nextExpr(++i, t.p).trim(), at: t.p }); break;
      case 'Norm': emit({ op: 'SETUP', cmd: 'Norm', arg: nextExpr(++i, t.p).trim(), at: t.p }); break;
      default: emit({ op: 'SETUP', cmd: t.v, at: t.p }); break;   // Deg/Rad/Gra/ClrMemory/…
    }
  }
  // IfEnd may be left off the end of a program — the machine accepts it and the
  // If simply runs to the end (SPEC §10). Five of Nixon's eight published
  // programs end this way. For/While still have to be closed.
  while (blocks.length && blocks[blocks.length - 1].type === 'if') {
    const b = blocks.pop();
    code[b.jmp !== null ? b.jmp : b.jz].target = code.length;
  }
  if (blocks.length) pSynErr(code[blocks[0].jz ?? blocks[0].test]?.at);  // For/While never closed
  closeArrow();
  return { code, labels };
}

// ---------------------------------------------------------------- interpreter
// A generator: yields {type:'input'|'disp'} and is resumed by the UI.
/** Run `fn`, and if it fails, tag the error with where in the program text it
 *  happened: the instruction's own offset plus the offset inside its expression.
 *  That is what lets the editor put the cursor on the offending character. */
function locate(I, fn) {
  try { return fn(); } catch (e) {
    if (e instanceof CalcError && e.progPos == null && I.at != null) {
      e.progPos = I.at + (e.pos ?? 0);
    }
    throw e;
  }
}

/** `opts.tick` = instructions per slice. With it the runner yields
 *  {type:'tick'} that often, so an interactive caller can hand the browser its
 *  event loop back between slices and AC still gets through — which is what the
 *  machine does: it runs until you stop it, for ever if you like.
 *
 *  Nixon, 2026-09-26: he writes infinite loops ON PURPOSE (his vector product
 *  program is built on it, and the Co-Geo centre/radius loop in CLAUDE.md §19
 *  is meant to be pressed EXE through until AC). Neither official error table
 *  — ours in SPEC §11, nor the fx-3650P II manual's — has a "Time ERROR": we
 *  invented one and used it to cut his own programs off at 3×10⁶ steps.
 *
 *  Without `tick` nobody is keeping a page alive, so the count guard stays as a
 *  safety net for the test suites. That is a harness limit, not the machine. */
function* run(program, ctx, opts = {}) {
  const { code, labels } = program;
  const tick = opts.tick | 0;
  let pc = 0, guard = 0, displayedValue = ctx.vars.Ans;
  while (pc < code.length) {
    if (tick) { if (++guard >= tick) { guard = 0; yield { type: 'tick' }; } }
    else if (++guard > 3e6) throw new CalcError('Time ERROR');
    const I = code[pc];
    switch (I.op) {
      case 'EXPR':
        if(ctx.mode==='REG' && code[pc+1]?.op==='SETUP' && code[pc+1].cmd==='DT') {
          displayedValue=locate(I,()=>addRegressionData(ctx,I.src)); pc+=2; break;
        }
        ctx.lastStmt = I.text || ''; displayedValue = locate(I, () => calcStmt(I.src, ctx).value); pc++; break;
      case 'INPUT': {
        const v = yield { type: 'input', name: I.name };
        if (I.name !== 'Ans') ctx.vars[I.name] = v;
        ctx.vars.Ans = v; displayedValue = v; pc++; break;
      }
      // A condition can be displayed without becoming Ans. Nixon's realCal:
      // 2:While Ans²◢Ans+1◢WhileEnd shows 4,3,9,4,..., not 4,5,25,26,...
      case 'DISP': yield { type: 'disp', value: displayedValue, text: I.text }; pc++; break;
      case 'JZ': {
        const savedAns = ctx.vars.Ans;
        let v;
        try { v = locate(I, () => calcStmt(I.src, ctx).value); }
        finally { if (I.preserveAns) ctx.vars.Ans = savedAns; }
        if (valueIsComplex(v)) locate(I, () => { throw new CalcError('Math ERROR'); });
        displayedValue = v;
        pc = v.isZero() ? I.target : pc + 1;
        break;
      }
      case 'JMP': pc = I.target; break;
      case 'GOTO': {
        const t = labels[I.n];
        if (t === undefined) locate(I, () => { throw new CalcError('Go ERROR'); });
        pc = t; break;
      }
      case 'FORTEST': {
        const cur = ctx.vars[I.varName];
        const end = locate(I, () => evaluate(I.endSrc, ctx));
        const st = locate(I, () => evaluate(I.stepSrc, ctx));
        // REAL: negative-Step direction is assumed, not yet verified on the machine
        const done = st.s >= 0 ? cmp(cur, end) > 0 : cmp(cur, end) < 0;
        pc = done ? I.target : pc + 1;
        break;
      }
      case 'FORNEXT':
        ctx.vars[I.varName] = add(ctx.vars[I.varName], locate(I, () => evaluate(I.stepSrc, ctx)));
        pc = I.top; break;
      case 'SETUP': locate(I, () => applySetup(I, ctx)); pc++; break;
      default: pc++;
    }
  }
  return ctx.vars.Ans;
}

function applySetup(I, ctx) {
  const n = I.arg ? parseInt(I.arg, 10) : 0;
  switch (I.cmd) {
    case 'Deg': ctx.angle = 'deg'; break;
    case 'Rad': ctx.angle = 'rad'; break;
    case 'Gra': ctx.angle = 'gra'; break;
    case 'Fix': ctx.disp = { disp: 'fix', n }; break;
    case 'Sci': ctx.disp = { disp: 'sci', n: n === 0 ? 10 : n }; break;
    case 'Norm': ctx.disp = { disp: n === 2 ? 'norm2' : 'norm1' }; break;
    case 'ClrMemory': for (const k of ['A', 'B', 'C', 'D', 'X', 'Y', 'M']) ctx.vars[k] = evaluate('0', ctx); break;
    // DT enters one sample — exactly what pressing M+ does in SD mode with that
    // value on the entry line (Nixon, 2026-09-22: "DT same as pressing M+, 3
    // numbers in"). So "1DT:2DT:6DT" enters three numbers and x̄ then reads 3.
    // The value is whatever the statement in front of it worked out, i.e. Ans.
    case 'FreqOn': ctx.freqOn=true; break;
    case 'FreqOff': ctx.freqOn=false; break;
    case 'DT':
      if(ctx.mode==='REG') { addRegressionData(ctx,''); break; }
      if (valueIsComplex(ctx.vars.Ans)) throw new CalcError('Math ERROR');
      (ctx.stat ||= []).push({ v: ctx.vars.Ans, f: 1 });
      break;
    case 'ClrStat': (ctx.stat ||= []).length = 0; break;
    // ⚠️ Not done: the frequency form. On the keys it is "value SHIFT , n M+",
    // so in a program it would read "1;5DT" — but ';' inside a program
    // expression is a Syntax ERROR today and Nixon has not been asked whether
    // the machine takes it. Being more permissive than the machine is a bug
    // here, so this waits for his answer rather than a guess.
    default: break;                    // FreqOn/Dec/Hex… belong to modes not built yet
  }
}

/** Rows of a glyph as 7 bit-masks, MSB = leftmost dot, or null if unknown. */
const CACHE = new Map();
function dotRows(ch) {
  if (CACHE.has(ch)) return CACHE.get(ch);
  const pat = G[ch];
  const rows = pat
    ? pat.split('/').map(r => r.split('').reduce((n, c) => (n << 1) | (c === '#' ? 1 : 0), 0))
    : null;
  CACHE.set(ch, rows);
  return rows;
}

const hasDotGlyph = ch => dotRows(ch) !== null;

// The lower display line of an fx-50FH II is a seven-segment field: a sign
// cell, ten mantissa digits, then the ×10 marking and a two-digit exponent.
// This draws those segments directly instead of leaning on a typeface.
//
// Why it exists: the line used to be set in Digital-7 Mono, which is licensed
// for personal use only — fine while Nixon was the only user, not fine the
// moment the app is handed out. Drawing the segments ourselves removes that
// blocker entirely (the upper line already has its own 5x7 font in dotfont.mjs).
//
// Segment names are the usual ones:
//
//      aaaa
//     f    b
//     f    b
//      gggg
//     e    c
//     e    c
//      dddd

// Prefixed because the bundle flattens every module into one scope, and bare
// A…G collided with dotfont.mjs's glyph table.
const sgA = 1, sgB = 2, sgC = 4, sgD = 8, sgE = 16, sgF = 32, sgG = 64;

// Which segments each character lights, and how wide a slot it occupies as a
// fraction of a full digit cell. Only the decimal point shares a digit cell;
// fraction separators occupy a full fixed LCD slot, just like the digits.
const GLYPHS = {
  '0': { seg: sgA | sgB | sgC | sgD | sgE | sgF, w: 1 },
  '1': { seg: sgB | sgC, w: 1 },
  '2': { seg: sgA | sgB | sgG | sgE | sgD, w: 1 },
  '3': { seg: sgA | sgB | sgG | sgC | sgD, w: 1 },
  '4': { seg: sgF | sgG | sgB | sgC, w: 1 },
  '5': { seg: sgA | sgF | sgG | sgC | sgD, w: 1 },
  '6': { seg: sgA | sgF | sgG | sgE | sgC | sgD, w: 1 },
  '7': { seg: sgA | sgB | sgC, w: 1 },
  '8': { seg: sgA | sgB | sgC | sgD | sgE | sgF | sgG, w: 1 },
  '9': { seg: sgA | sgB | sgC | sgD | sgF | sgG, w: 1 },
  '-': { seg: sgG, w: 1 },
  '−': { seg: sgG, w: 1 },
  ' ': { seg: 0, w: 1 },
  // The point is a segment of the digit's OWN cell, at its bottom right — it
  // does not take a slot of its own, so a ten-digit mantissa is ten cells wide
  // wherever the point falls. (REAL: Nixon's photo of the whole glass shows a
  // point beside every one of the twelve cells, 2026-09-17. Ours used to be a
  // 0.34-wide character between digits, which made the field too wide to hold
  // what the machine holds.)
  '.': { seg: 0, dot: true, w: 0 },
  // The fraction mark reads as ⌐ turned through 180°, so a stroke down the
  // right with a foot to the left (SPEC §8b, confirmed on the machine).
  '」': { seg: sgC | sgD, w: 1 },
  // Degrees: the little square the sexagesimal display puts between the parts.
  '°': { seg: sgA | sgB | sgF | sgG, w: 0.62, small: true },
};

// Air between two digit cells, as a multiple of the stroke width. About 0.4 of
// a digit's own width, which is what the all-segments photo shows.
const GAP = 1.55;

const hasSegGlyph = ch => Object.prototype.hasOwnProperty.call(GLYPHS, ch);

/** Advance width of one character, in the same units as `w` (a digit cell). */
function segWidth(ch, w) {
  const g = GLYPHS[ch];
  return (g ? g.w : 1) * w;
}

/** Total advance of a string. */
const segTextWidth = (s, w) => [...s].reduce((n, ch) => n + segWidth(ch, w), 0);

/** Draw one character with its top-left at (x, y). Returns its advance. */
function drawSegChar(g2, ch, x, y, w, h, t) {
  const g = GLYPHS[ch];
  if (!g) return w;                       // unknown: leave a blank slot
  const adv = g.w * w;

  if (g.dot) {
    // A small round pip on the baseline, in the MIDDLE of the gap between the
    // digit it belongs to and the next one — the cell edge is the right-hand
    // end of that gap, so the pip sits half a gap back from it. (Nixon,
    // 2026-09-18: sitting on the edge put it against the following digit.)
    g2.beginPath();
    g2.arc(x - t * GAP / 2, y + h - t * 0.55, t * 0.32, 0, Math.PI * 2);
    g2.fill();
    return adv;
  }

  // The glyph box shrinks for the small marks so they hang from the top.
  const bh = g.small ? h * 0.5 : h;
  // Air between digits, so the point that belongs to this cell sits in a gap of
  // its own instead of touching the digit beside it. The gap is about 0.4 of a
  // digit's own width, which is what Nixon's photo of the all-segments display
  // shows (2026-09-17, second pass — one t of air was still not enough and the
  // point was landing on the upright of the digit before it).
  const bw = adv - (g.w < 1 ? 0 : t * GAP);
  const m = t / 2;                            // half thickness, for the mitres
  const mid = y + bh / 2;

  // Each segment is a hexagon so the joints mitre instead of butting square,
  // which is what a real LCD segment looks like. All seven go into ONE path and
  // are filled together: the mitres overlap, and with a see-through fill (the
  // unlit ghost field) filling them one at a time stacks the alpha and the
  // corners come out darker than the bars.
  const hbar = (cx, cy, len) => {
    g2.moveTo(cx + m, cy - m); g2.lineTo(cx + len - m, cy - m);
    g2.lineTo(cx + len, cy);   g2.lineTo(cx + len - m, cy + m);
    g2.lineTo(cx + m, cy + m); g2.lineTo(cx, cy);
    g2.closePath();
  };
  // A vertical tapers only at the end that meets a HORIZONTAL bar. Where the
  // two verticals meet EACH OTHER — halfway up the digit — they stop square,
  // leaving a thin slot. Two points meeting there instead leave a white diamond
  // bitten out of the side of every 0, 1, 4… which is the first thing Nixon
  // said about the digits (2026-09-17: "the white little part of numbers").
  // ⚠️ WINDING MATTERS. All seven segments go into one path and are filled
  // together, and canvas fills by the nonzero rule: two subpaths that overlap
  // while running in OPPOSITE directions cancel each other and leave a hole.
  // That is what bit white slivers out of every corner where a bar met an
  // upright — Nixon spotted it the moment the digits got bigger. Both helpers
  // wind CLOCKWISE (right along the top, down, left along the bottom), so the
  // joins come out solid while the fill still only paints each pixel once.
  const slot = t * 0.22;
  const vbar = (cx, cy, len, tipTop, tipBot) => {
    const top = tipTop ? cy + m : cy + slot;
    const bot = tipBot ? cy + len - m : cy + len - slot;
    g2.moveTo(cx - m, top);
    if (tipTop) g2.lineTo(cx, cy);
    g2.lineTo(cx + m, top);
    g2.lineTo(cx + m, bot);
    if (tipBot) g2.lineTo(cx, cy + len);
    g2.lineTo(cx - m, bot);
    g2.closePath();
  };

  g2.beginPath();
  const half = (bh - t) / 2;
  if (g.seg & sgA) hbar(x, y + m, bw);
  if (g.seg & sgG) hbar(x, mid, bw);
  if (g.seg & sgD) hbar(x, y + bh - m, bw);
  if (g.seg & sgF) vbar(x + m, y + m, half, true, false);
  if (g.seg & sgB) vbar(x + bw - m, y + m, half, true, false);
  if (g.seg & sgE) vbar(x + m, mid, half, false, true);
  if (g.seg & sgC) vbar(x + bw - m, mid, half, false, true);
  g2.fill();
  return adv;
}

/** Draw a whole string ending at `right`; returns where it started. */
function drawSegText(g2, s, right, y, w, h, t) {
  let x = right - segTextWidth(s, w);
  const from = x;
  for (const ch of s) x += drawSegChar(g2, ch, x, y, w, h, t);
  return from;
}

// Portable program files shared by the workbench and both calculators.
const FILE_MODES = ['COMP', 'CMPLX', 'BASE', 'SD', 'REG'];
const FILE_ANGLES = ['deg', 'rad', 'gra'];
function readProgramComments(p) {
  return p.comments.filter(n => n && typeof n.text === 'string'
    && Number.isInteger(n.start) && Number.isInteger(n.end)
    && n.start >= 0 && n.end >= n.start && n.end <= p.src.length)
    .map((n,i) => ({id:typeof n.id === 'string' ? n.id : `comment-${i}`,
      start:n.start,end:n.end,text:n.text,quote:typeof n.quote === 'string' ? n.quote : p.src.slice(n.start,n.end),
      ...(n.detached ? {detached:true} : {})}));
}

function readProgramRecords(data) {
  const list = Array.isArray(data) ? data : data && data.progs;
  if (!Array.isArray(list)) throw new Error('檔案內沒有程式清單');
  if (list.length && list.every(p => typeof p === 'string')) {
    return list.map((src, i) => ({ name: `計數機 P${i + 1}`, src,
      mode: FILE_MODES.includes(data.pmodes && data.pmodes[i]) ? data.pmodes[i] : 'COMP',
      note: '', status: 'draft', angle: 'deg' }));
  }
  if (!list.every(p => p && typeof p === 'object' && typeof p.src === 'string'))
    throw new Error('程式格式不正確；未有更改任何程式');
  return list.map(p => ({
    id: typeof p.id === 'string' ? p.id : '', name: String(p.name || '未命名'),
    src: p.src, mode: FILE_MODES.includes(p.mode) ? p.mode : 'COMP',
    note: String(p.note || ''), ...(p.guide && typeof p.guide === 'object' ? {guide: Object.fromEntries(['id','inputs','outputs','example','caution'].filter(k => typeof p.guide[k] === 'string').map(k => [k,p.guide[k]]))} : {}), ...(Array.isArray(p.comments) ? {comments:readProgramComments(p)} : {}), ...(typeof p.remarks === 'string' ? {remarks:p.remarks} : {}), status: p.status === 'complete' ? 'complete' : 'draft',
    angle: FILE_ANGLES.includes(p.angle) ? p.angle : 'deg',
    updated: typeof p.updated === 'string' ? p.updated : '',
  }));
}

function makeProgramFile(progs, selected = null) {
  return { v: 2, app: 'fx50-library', selected, progs };
}

// CODATA 2010 — confirmed against the real fx-50FH II (mp reads 1.672621777×10⁻²⁷).
const CONSTS = SCI_CONSTANTS;

// ------------------------------------------------------- FMLA 內置公式
// The machine holds 23 built-in formulas. Only 01–05 are named in the fx-72F
// manual (SPEC §10b) and Nixon says those are the only ones he uses, so the
// rest answer "未做" the way BASE and REG do.
//
// 01 is off Nixon's own photos of the machine (2026-09-16): the title reads
// exactly "01:QuadEquation", it STAYS on the dot line while the formula runs,
// and each answer is tagged by the little x= segment at the bottom left — not
// by anything on the upper line. **Every formula runs in COMP** (his words), so
// b²-4ac < 0 gives Math ERROR out of √( rather than a complex root.
//
// FMLA 02: Nixon's 2026-09-30 real-machine photos show b=8, c=5, angle=60
// followed by a=7, with the machine's own spelling "CosineTheorm".
//
// ⚠️ Still unverified: the a? b? c? prompt labels (the manual's wording), what
// the upper line shows WHILE a value is being keyed in, whether both roots are
// tagged x=, and whether the formula overwrites the A B C memories.
const FMLA_MAX = 23;
const FORMULAS = [
  { n: 1, name: 'QuadEquation', mode: 'COMP',
    src: '?→A:?→B:?→C:(-B+√(B²-4A C))÷(2A)◢(-B-√(B²-4A C))÷(2A)',
    labels: ['a', 'b', 'c'], tag: 'x=' },
  { n: 2, name: 'CosineTheorm', mode: 'COMP',
    src: '?→B:?→C:?→D:√(B²+C²−2BCcos(D)',
    labels: ['b', 'c', 'θ'], tag: 'a=' },
  { n:3, name:'HeronFormula', mode:'COMP',
    src:'?→A:?→B:?→C:√(((A+B+C)÷2)((B+C−A)÷2)((A+C−B)÷2)((A+B−C)÷2))',
    labels:['a','b','c'], tag:'S=' },
];
const fmlaOf = n => FORMULAS.find(f => f.n === n);
const fmlaTitle = n => `${String(n).padStart(2, '0')}:${(fmlaOf(n) || {}).name || ''}`;

// ---------------------------------------------------------- shipped programs
// The machine arrives with programs already typed in: the people this is being
// handed to teach with it, they do not key programs in and they will not touch
// the export/import files.
//
// SHIPPED is the set; PRELOAD is its number. Bump PRELOAD whenever the set
// changes and a machine that is still carrying an older shipped set — nobody
// typed over it — picks the new one up by itself. Anything someone actually
// edited is left alone; that is what SHIPPED_SETS is for, it remembers what the
// earlier sets looked like so "untouched" can be recognised.
const PRELOAD = 3;
// Set 2 is the four Nixon handed over on 2026-09-16, his layout kept (a newline
// separates statements like ':' and costs no bytes). 222 of the 680 bytes.
const SHIPPED = { progs: TEACHING_PROGRAMS.map(p => p.src), pmodes: TEACHING_PROGRAMS.map(p => p.mode) };
// Every set ever shipped, so an untouched machine can be recognised as such.
const SHIPPED_SETS = [
  ['?→A:?→B:?→C:B²-4AC◢-B÷2A→X◢C-AX²→Y◢√(-Y」A→C:X-C→A◢X+C→B', '', '', ''],
  // set 2, before the subtraction signs were lengthened — a machine still
  // holding these has not been touched either, so it gets the new set. (Every
  // set that ever shipped has to stay here verbatim; drop one and the machines
  // carrying it look like someone's own work and never see another update.)
  [
    '?→A:?→B:?→C:\nB²-4AC◢-B÷2A→X◢C-AX²→Y◢\n-Y」A→C:X+√(C→A◢X-√(C→B',
    '?→A:?→B:?→C:?→X:?→Y:?→D:\nCY−BD:Ans÷(BX−AY→X◢−B⁻¹(C+AX→Y',
    '?→A:?→B:?→C:?→D:\nC⇒cos⁻¹((A²+B²-C²)÷2AB→D:\nPol(A-Bcos(D,Bsin(D→C:C◢D◢180-Y-D→X◢Y◢2⁻¹ABsin(D→M',
    'ᴇ-4i→X:?→M:While Abs(M:Fix0:Rnd(M:Norm1:\nAns+Conjg(Ans:Ans÷2◢X⁻¹(M−Ans→M:WhileEnd',
  ],
  SHIPPED.progs,
];

// Compare the MEANING, not the characters: a newline costs no bytes and one
// click in the editor box is enough to save the same program back with a
// trailing newline. Character equality made that look like someone's own work
// and quietly refused to hand the machine the new programs — which is exactly
// what happened to Nixon's own iPad on 2026-09-16.
const canonProg = t => normalize(String(t || '')).replace(/\n/g, '').trim();
const untouched = progs => Array.isArray(progs)
  && SHIPPED_SETS.some(set => set.length === progs.length
    && set.every((p, i) => canonProg(p) === canonProg(progs[i])));

/** Put the shipped programs back. Destroys whatever is in the four areas, so
 *  the button that calls it asks twice. */
function restoreShipped(save = true) {
  S.progs = SHIPPED.progs.slice();
  S.pmodes = SHIPPED.pmodes.slice();
  if (save) saveProgs();
}

function loadProgs() {
  let stored = null;
  try {
    stored = JSON.parse(localStorage.getItem(LS) || 'null');
  } catch (e) { /* no storage */ }
  if (Array.isArray(stored)) S.progs = stored;                // older format
  else if (stored && stored.progs) {
    S.progs = stored.progs;
    S.pmodes = stored.pmodes || S.pmodes;
    // a machine still holding an older shipped set gets the new one
    if ((stored.preload || 0) < PRELOAD && untouched(stored.progs)) restoreShipped();
  } else restoreShipped(false);
}
let programReplacementUndo = null;
const programSnapshot = () => ({ progs: S.progs.slice(), pmodes: S.pmodes.slice(), psel: S.psel });
const programSignature = () => JSON.stringify([S.progs, S.pmodes]);
function updateReplacementUndo() {
  if (programReplacementUndo && programReplacementUndo.after !== programSignature()) programReplacementUndo = null;
  const button = document.getElementById('eundoimport');
  if (button) { button.hidden = !programReplacementUndo; button.textContent = programReplacementUndo ? `復原「${programReplacementUndo.label}」` : '復原上次更改'; }
}
function rememberProgramReplacement(previous, label) {
  programReplacementUndo = { previous, label, after: programSignature() }; updateReplacementUndo();
}
function undoProgramReplacement() {
  updateReplacementUndo(); if (!programReplacementUndo) return;
  const previous = programReplacementUndo.previous; programReplacementUndo = null;
  if (S.run) endRun();
  S.progs = previous.progs.slice(); S.pmodes = previous.pmodes.slice(); S.psel = previous.psel;
  saveProgs(); syncEditor(); render(); editorMsg('已復原上次更改；之後若再編輯，舊復原項目會停用。', 'info');
}
function saveProgs() {
  updateReplacementUndo();
  let ok = false;
  try {
    const payload = JSON.stringify({ progs: S.progs, pmodes: S.pmodes, preload: PRELOAD });
    localStorage.setItem(LS, payload);
    ok = localStorage.getItem(LS) === payload;
  } catch (e) { ok = false; }
  S.saveOk = ok;
  const el = document.getElementById('esave');
  if (el) {
    el.textContent = ok
      ? `已自動存喺瀏覽器 · ${new Date().toLocaleTimeString('en-GB')}`
      : '⚠ 呢個瀏覽器唔畀存 — 請用「匯出檔案」保存';
    el.style.color = ok ? '#7fb98f' : '#e7a33e';
  }
}

/** Fit the machine to the window by scaling the whole thing, so it keeps its
 *  proportions instead of reflowing. Nixon, 2026-09-22, from an iPad in Split
 *  View: "when it turn off the whole cal looks thinner... when the number was
 *  long decimal the cal goes fatter too, or it somewhat zoom it itself". */
function fitWidth() {
  const fit = document.getElementById('fit');
  const left = document.getElementById('left');
  if (!fit || !left || !fit.style || !left.style) return;      // test DOM shim
  left.style.transform = '';
  fit.style.width = ''; fit.style.height = '';
  const room = (document.documentElement && document.documentElement.clientWidth || 0) - 32;
  if (!(room > 0) || room >= CALC_W) return;
  const k = room / CALC_W;
  left.style.transform = `scale(${k})`;
  fit.style.width = `${CALC_W * k}px`;
  fit.style.height = `${(left.offsetHeight || 0) * k}px`;
}

// Switch to the sibling bundle so model-specific keys, limits and storage are
// all selected together. Demo stays demo; file:// also works with both files.
function switchModel() {
  if (document.body.classList.contains('model-changing')) return;
  saveProgs();
  const url = new URL(window.location.href);
  const next = IS_3650 ? 'fx-50FH-II' : 'fx-3650P-II';
  if (/fx-(50fh|3650p)-ii/i.test(url.pathname)) {
    url.pathname = url.pathname.replace(/fx-(50fh|3650p)-ii/i, next);
  } else {
    url.pathname = url.pathname.replace(/[^/]*$/, `dist/${next}-demo.html`);
  }
  try { sessionStorage.setItem('fx-model-transition', IS_3650 ? '50FHII' : '3650PII'); }
  catch { /* private browsers may block session storage */ }
  document.body.classList.add('model-changing');
  setTimeout(() => window.location.assign(url.href), 280);
}

function bindModelRub(el) {
  let rub = null;
  const resetRub = () => { rub = null; el.style.setProperty('--rub', '0%'); };
  el.addEventListener('pointerdown', e => {
    if (e.isPrimary === false || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    rub = { id: e.pointerId, x: e.clientX, y: e.clientY, last: e.timeStamp,
      elapsed: 0, distance: 0, direction: 0, turns: 0 };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!rub || e.pointerId !== rub.id) return;
    const dx = e.clientX - rub.x, dy = e.clientY - rub.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 2) return;
    const gap = e.timeStamp - rub.last;
    if (gap > 500) { rub.elapsed = 0; rub.distance = 0; rub.turns = 0; }
    else rub.elapsed += gap;
    const direction = Math.sign(Math.abs(dx) >= Math.abs(dy) ? dx : dy);
    if (rub.direction && direction !== rub.direction) rub.turns++;
    rub.direction = direction; rub.distance += distance;
    rub.x = e.clientX; rub.y = e.clientY; rub.last = e.timeStamp;
    el.style.setProperty('--rub', `${Math.min(100, rub.elapsed / 10)}%`);
    if (rub.elapsed >= 1000 && rub.distance >= 100 && rub.turns >= 3) {
      resetRub(); switchModel();
    }
  });
  for (const event of ['pointerup', 'pointercancel', 'lostpointercapture'])
    el.addEventListener(event, resetRub);
}

function bindSolarCover(el) {
  let timer = null, pointerId = null;
  const cancel = () => { clearTimeout(timer); timer = null; pointerId = null; };
  el.addEventListener('pointerdown', e => {
    if (e.isPrimary === false || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault(); cancel(); pointerId = e.pointerId;
    el.setPointerCapture(e.pointerId);
    timer = setTimeout(() => {
      const brand = document.getElementById('approval-brand');
      const visible = !brand.classList.contains('on');
      brand.classList.toggle('on', visible);
      brand.setAttribute('aria-hidden', String(!visible));
      timer = null;
    }, 1000);
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== pointerId) return;
    const r = el.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) cancel();
  });
  for (const event of ['pointerup', 'pointercancel', 'lostpointercapture'])
    el.addEventListener(event, cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

const ASK_VARS = ['A', 'B', 'C', 'D', 'X', 'Y', 'M'];

/** Next `?→` variable: the first of A B C D X Y M not already asked for. */
function nextAskVar() {
  const txt = S.progs[S.psel] || '';
  const used = new Set([...txt.matchAll(/\?\s*→\s*([A-DXYM])/g)].map(m => m[1]));
  return ASK_VARS.find(v => !used.has(v)) || 'A';
}

// Importing never assigns file objects to S.progs. Preview first, then replace
// only the chosen area. Legacy four-area backups can still be restored.
function prepareProgramImport(record, slot) {
  if (!Number.isInteger(slot) || slot < 0 || slot > 3) throw new Error('請選擇 P1–P4');
  if (!record || typeof record.src !== 'string' || !record.src.trim()) throw new Error('程式是空白');
  if (!MODE_READY[record.mode]) throw new Error(`${record.mode} 模式尚未支援執行`);
  const src = normalize(record.src);
  compile(src);
  const total = S.progs.reduce((n, p, i) => n + byteCount(i === slot ? src : p || ''), 0);
  if (total > PROGRAM_BYTES) throw new Error(`總共 ${total} bytes，超出 ${MODEL_NAME} 的 ${PROGRAM_BYTES} bytes。請先備份，再自行騰出空間。`);
  return src;
}
function applyProgramImport(record, slot) {
  const src = prepareProgramImport(record, slot);
  if (S.run) endRun();
  const previous = programSnapshot();
  S.progs[slot] = src; S.pmodes[slot] = record.mode; S.psel = slot;
  saveProgs(); syncEditor(); rememberProgramReplacement(previous, `載入 P${slot+1}`);
  return src;
}
function stageProgramImport(data) {
  const records = readProgramRecords(data);
  if (!records.length) throw new Error('檔案內沒有程式');
  openEditor();
  const box = document.getElementById('eimport');
  box.hidden = false;
  box.innerHTML = `<strong>載入程式前先選擇</strong>
    <p>只會更新指定 P 區。先用「匯出檔案」備份原有程式。</p>
    <label>程式 <select id="eprogram">${records.map((p, i) =>
      `<option value="${i}">${esc(p.name)} · ${p.mode} · ${byteCount(p.src)} B</option>`).join('')}</select></label>
    <label>載入 <select id="eslot">${[0,1,2,3].map(i =>
      `<option value="${i}" ${i === S.psel ? 'selected' : ''}>P${i + 1}（現有 ${byteCount(S.progs[i] || '')} B）</option>`).join('')}</select></label>
    <pre id="eimportpreview" style="white-space:pre-wrap"></pre>
    <p id="eimportcheck"></p>
    <button id="eimportconfirm">載入選定 P 區</button>
    <button id="eimportcancel">取消</button>
    ${records.length === 4 && (Array.isArray(data) || data.progs.every(p => typeof p === 'string'))
      ? '<button id="eimportall">回復四區備份</button>' : ''}`;
  const pick = document.getElementById('eprogram'), slot = document.getElementById('eslot');
  const confirm = document.getElementById('eimportconfirm');
  const preview = () => {
    confirm.dataset.armed = ''; confirm.textContent = '載入選定 P 區';
    const record = records[Number(pick.value)];
    document.getElementById('eimportpreview').textContent = record.src;
    try {
      prepareProgramImport(record, Number(slot.value)); confirm.disabled = false;
      document.getElementById('eimportcheck').textContent =
        `可載入 · 試行角度 ${record.angle.toUpperCase()}；計數機角度請用 SETUP 設定，或程式內加 Deg／Rad。`;
    } catch (e) {
      confirm.disabled = true;
      document.getElementById('eimportcheck').textContent = `不能載入：${e.kind || e.message}。草稿請回程式簿繼續修改。`;
    }
  };
