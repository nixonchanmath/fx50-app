<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Linear Programming · N 條約束</title>
<style>
  :root{font-family:system-ui,-apple-system,sans-serif;color:#17252b;background:#f3f5f4}
  *{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:680px;margin:auto}
  h1{font-size:1.55rem;margin:12px 0 4px}p{line-height:1.5;color:#52616a}
  nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}a{color:#12586c}
  .card{background:white;border:1px solid #dce4e4;border-radius:14px;padding:20px;margin:16px 0}
  label{display:block;font-weight:600;margin-bottom:8px}input{font:inherit;border:1px solid #a9b8bc;border-radius:7px;padding:10px;width:100%;background:white;color:#17252b}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  button{font:inherit;border:1px solid #a5b7bb;background:white;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;color:#173640}
  button.primary{background:#155c6d;color:white;border-color:#155c6d}button:focus-visible,input:focus-visible{outline:3px solid #66a8be}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.hint{font-size:.92rem}.error{color:#a82121;font-weight:600}
  .done{border-top:1px solid #dde5e6;padding-top:12px;margin-top:16px}.value{font-size:1.35rem;font-weight:700;overflow-wrap:anywhere}
  .back{font-size:.9rem}.progress{color:#44565e;font-weight:600}
  @media(max-width:420px){.card{padding:15px}.row{gap:6px}.row input{padding:8px}}
</style>
<main class="wrap">
  <nav><a href="fx-50FH-II.html">50FH</a><a href="fx-3650P-II.html">3650P</a><a href="fx50-library.html">Program Code Book</a></nav>
  <h1>Linear Programming · N 條約束</h1>
  <p>逐條輸入 <em>ax + by ≤ c</em>，每條只需輸入一次。目標函數為 <em>px + qy + r</em>；結果先顯示最小值，再顯示最大值。進度自動儲存在此瀏覽器。</p>
  <div id="app"></div>
</main>
<script>
(() => {
  'use strict';
  const KEY = 'fx50.lp-n.v1';
  const clean = () => ({p:'',q:'',r:'0',n:'',rows:[],step:1});
  let state;
  try { state = {...clean(), ...JSON.parse(localStorage.getItem(KEY)||'null')}; }
  catch { state = clean(); }
  if (!Array.isArray(state.rows)) state.rows=[];
  const app=document.getElementById('app');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
  // Decimal inputs are converted to reduced fractions. All bounds, comparisons
  // and infeasibility checks below are exact BigInt arithmetic.
  const abs=x=>x<0n?-x:x;
  const gcd=(a,b)=>{a=abs(a);b=abs(b);while(b){[a,b]=[b,a%b];}return a||1n;};
  function rat(n,d=1n){if(!d)throw Error('分母不可為零');if(d<0n){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};}
  const add=(a,b)=>rat(a.n*b.d+b.n*a.d,a.d*b.d);
  const neg=a=>({n:-a.n,d:a.d});
  const sub=(a,b)=>add(a,neg(b));
  const mul=(a,b)=>rat(a.n*b.n,a.d*b.d);
  const div=(a,b)=>rat(a.n*b.d,a.d*b.n);
  const cmp=(a,b)=>a.n*b.d<b.n*a.d?-1:a.n*b.d>b.n*a.d?1:0;
  function parse(raw){
    const s=String(raw).trim().replace(/−/g,'-');
    const m=/^([+-]?)(\d+)(?:\.(\d*))?(?:[eE]([+-]?\d{1,3}))?$/.exec(s);
    if(!m)throw Error('請輸入數字；支援小數或科學記數法');
    const digits=m[2]+(m[3]||'');
    const power=Number(m[4]||0)-(m[3]||'').length;
    if(Math.abs(power)>100)throw Error('指數請限於 ±100');
    const n=BigInt(digits)*(m[1]==='-'?-1n:1n);
    return power>=0?rat(n*10n**BigInt(power)):rat(n,10n**BigInt(-power));
  }
  function bound(a,b,limits){
    if(!a.n){if(b.n<0n)return false;return true;}
    const t=div(b,a);
    const type=a.n<0n?'lo':'hi';
    if(!limits[type]||(type==='lo'?cmp(t,limits[type])>0:cmp(t,limits[type])<0))limits[type]=t;
    return true;
  }
  function solve(objective,rows){
    let [p,q,r]=objective.map(parse);
    const constant=!p.n&&!q.n;
    if(constant)p=rat(1n);
    const h=add(mul(p,p),mul(q,q));
    const positive=[],negative=[],limits={lo:null,hi:null};
    for(const row of rows){
      const [a,b,c]=row.map(parse);
      if(!a.n&&!b.n){if(c.n<0n)return {status:'infeasible'};continue;}
      const u=add(mul(a,p),mul(b,q));
      const v=sub(mul(b,p),mul(a,q));
      const k=mul(c,h);
      if(!v.n){if(!bound(u,k,limits))return {status:'infeasible'};}
      else (v.n>0n?positive:negative).push({u,v,k});
    }
    // Every lower S-line must lie below every upper S-line. This projects the
    // N half-planes exactly onto the T = px+qy axis without enumerating vertices.
    for(const lower of negative)for(const upper of positive){
      const alpha=sub(div(upper.u,upper.v),div(lower.u,lower.v));
      const beta=sub(div(upper.k,upper.v),div(lower.k,lower.v));
      if(!bound(alpha,beta,limits))return {status:'infeasible'};
    }
    if(limits.lo&&limits.hi&&cmp(limits.lo,limits.hi)>0)return {status:'infeasible'};
    if(constant)return {status:'ok',min:r,max:r};
    return {status:'ok',min:limits.lo?add(limits.lo,r):null,max:limits.hi?add(limits.hi,r):null};
  }
  const display=x=>x===null?'無下界／無最小值':x.d===1n?String(x.n):`${x.n}/${x.d}`;
  const approx=x=>x&&x.d!==1n?` ≈ ${Number(x.n)/Number(x.d)}`:'';
  const field=(id,label,value,placeholder='0')=>`<div><label for="${id}">${label}</label><input id="${id}" inputmode="decimal" value="${esc(value)}" placeholder="${placeholder}" required></div>`;
  const controls=`<div class="actions"><button type="button" id="restart">重新開始</button></div>`;
  function render(message=''){
    if(state.step===1){
      app.innerHTML=`<form id="form" class="card"><h2>1. Enter Function</h2><p>目標函數：px + qy + r</p><div class="row">${field('p','p（x 系數）',state.p,'5')}${field('q','q（y 系數）',state.q,'4')}${field('r','r（常數）',state.r,'0')}</div><div class="actions"><button class="primary">下一步</button></div><p id="err" class="error" role="alert">${esc(message)}</p></form>${controls}`;
    }else if(state.step===2){
      app.innerHTML=`<form id="form" class="card"><h2>2. Enter number of constraints</h2><label for="n">N</label><input id="n" type="number" min="1" step="1" value="${esc(state.n)}" required><div class="actions"><button type="button" class="back" id="prev">返回目標函數</button><button class="primary">下一步</button></div><p id="err" class="error" role="alert">${esc(message)}</p></form>${controls}`;
    }else{
      const n=Number(state.n),index=Math.min(state.rows.length,n-1);
      const row=state.rows[index]||['','',''];
      app.innerHTML=`<form id="form" class="card"><h2>3. Enter constraints one by one</h2><div class="progress">第 ${index+1}／${n} 條</div><p>ax + by ≤ c</p><div class="row">${field('a','a',row[0],'1')}${field('b','b',row[1],'1')}${field('c','c',row[2],'1')}</div><div class="actions"><button type="button" class="back" id="prev">返回／修改</button><button class="primary">${state.rows.length===n?'更新最後一條':index+1===n?'計算 min、max':'儲存，下一條'}</button></div><p id="err" class="error" role="alert">${esc(message)}</p></form><section id="result" class="card" aria-live="polite"></section>${controls}`;
      if(state.rows.length===n)showResult();
    }
    document.getElementById('restart').onclick=()=>{if(!confirm('重新開始並清除目前輸入？'))return;state=clean();save();render();};
    const previous=document.getElementById('prev');
    if(previous)previous.onclick=()=>{if(state.step===3&&state.rows.length){state.rows.pop();}else state.step--;save();render();};
    document.getElementById('form').onsubmit=event=>{
      event.preventDefault();
      try{
        if(state.step===1){
          const values=['p','q','r'].map(id=>document.getElementById(id).value.trim());values.forEach(parse);
          [state.p,state.q,state.r]=values;state.step=2;
        }else if(state.step===2){
          const v=document.getElementById('n').value;
          if(!/^[1-9]\d*$/.test(v)||!Number.isSafeInteger(Number(v)))throw Error('N 必須係正整數');
          if(state.n!==v)state.rows=[];
          state.n=v;state.step=3;
        }else{
          const row=['a','b','c'].map(id=>document.getElementById(id).value.trim());
          const [a,b]=row.map(parse);row.forEach(parse);
          if(!a.n&&!b.n)throw Error('a、b 至少一個非零');
          if(state.rows.length===Number(state.n))state.rows[state.rows.length-1]=row;
          else state.rows.push(row);
        }
        save();render();
      }catch(err){document.getElementById('err').textContent=err.message;}
    };
  }
  function showResult(){
    const box=document.getElementById('result');
    try{
      const result=solve([state.p,state.q,state.r],state.rows);
      if(result.status==='infeasible'){box.innerHTML='<h2>結果</h2><p class="error">無可行解</p>';return;}
      const value=(x,missing)=>x===null?missing:display(x)+approx(x);
      box.innerHTML=`<h2>結果</h2><div class="done"><div>最小值</div><div class="value">${esc(value(result.min,'無下界／無最小值'))}</div></div><div class="done"><div>最大值</div><div class="value">${esc(value(result.max,'無上界／無最大值'))}</div></div>`;
    }catch(err){box.innerHTML=`<p class="error">${esc(err.message)}</p>`;}
  }
  window.lpN={solve,parse,cmp,display};
  render();
})();
</script>
</html>
