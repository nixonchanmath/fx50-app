<script>
// One place for the build's name. It shows under the keypad and goes into the
// feedback form, so a tester's report can be matched to the build they ran.
// Bump MINOR when a mode lands (BASE / SD / REG / FMLA) or something as big
// as swapping out the whole display font; PATCH for fixes.
const VERSION = '0.17.1';
const BUILD_DATE = '2026-11-12';
// build.mjs replaces this one declaration when producing the 3650 build.
const MODEL = '50FHII';

// fx-50FH II emulator — 15-digit decimal arithmetic
// Mimics the calculator's internal format: 15-digit mantissa, exponent -99..99.
// Representation: value = s * m * 10^q   where m is a BigInt of exactly 15 digits (or 0n).
// Display exponent = q + 14.

const PREC = 15;
const TEN = 10n;
const pow10 = n => TEN ** BigInt(n);
const ndig = m => (m === 0n ? 0 : m.toString().length);

class CalcError extends Error {
  constructor(kind) { super(kind); this.kind = kind; }
}
const mathError = () => { throw new CalcError('Math ERROR'); };

class Dec {
  constructor(s, m, q) { this.s = s; this.m = m; this.q = q; }
  get exp() { return this.q + PREC - 1; }   // decimal exponent of leading digit
  isZero() { return this.m === 0n; }
  neg() { return this.isZero() ? this : new Dec(-this.s, this.m, this.q); }
  abs() { return new Dec(1, this.m, this.q); }
}

const ZERO = new Dec(1, 0n, 0);

// Build a normalised Dec from raw mantissa/exponent. Rounds half-up to 15 digits.
function mk(s, m, q) {
  if (m < 0n) { s = -s; m = -m; }
  if (m === 0n) return ZERO;
  const n = ndig(m);
  if (n > PREC) {
    const drop = n - PREC, div = pow10(drop);
    const r = m % div;
    m = m / div; q += drop;
    if (r * 2n >= div) {
      m += 1n;
      if (ndig(m) > PREC) { m /= TEN; q += 1; }
    }
  } else if (n < PREC) {
    const add = PREC - n;
    m *= pow10(add); q -= add;
  }
  return new Dec(s, m, q);
}

function fromString(str) {
  const t = String(str).trim().replace(/[−–]/g, '-');
  const mm = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d+))?$/.exec(t);
  if (!mm || (!mm[2] && !mm[3])) throw new CalcError('Syntax ERROR');
  const s = mm[1] === '-' ? -1 : 1;
  const ip = mm[2] || '', fp = mm[3] || '';
  const digits = (ip + fp).replace(/^0+(?=\d)/, '') || '0';
  const q = -fp.length + (mm[4] ? parseInt(mm[4], 10) : 0);
  return mk(s, BigInt(digits), q);
}

const fromInt = n => mk(n < 0 ? -1 : 1, BigInt(Math.abs(n)), 0);

// Convert a JS double in. 17 significant digits then round to 15 — this is what
// makes sin(30) come out as exactly 0.5 rather than 0.49999999999999994.
function fromNumber(x) {
  if (!isFinite(x)) mathError();
  if (x === 0) return ZERO;
  return fromString(x.toExponential(16));
}

const toNumber = d => Number(`${d.s < 0 ? '-' : ''}${d.m}e${d.q}`);

function add(a, b) {
  if (a.isZero()) return b;
  if (b.isZero()) return a;
  const q = Math.min(a.q, b.q);
  const da = a.q - q, db = b.q - q;
  if (da > 40) return a;          // b is below the guard digits
  if (db > 40) return b;
  const m = a.m * pow10(da) * BigInt(a.s) + b.m * pow10(db) * BigInt(b.s);
  return mk(1, m, q);
}

const sub = (a, b) => add(a, b.neg());
const mul = (a, b) => (a.isZero() || b.isZero()) ? ZERO : mk(a.s * b.s, a.m * b.m, a.q + b.q);

function div(a, b) {
  if (b.isZero()) mathError();
  if (a.isZero()) return ZERO;
  const G = 25;                    // guard digits
  return mk(a.s * b.s, (a.m * pow10(G)) / b.m, a.q - b.q - G);
}

function cmp(a, b) {
  const d = sub(a, b);
  return d.isZero() ? 0 : d.s;
}
const eq = (a, b) => cmp(a, b) === 0;

function isInteger(d) {
  if (d.isZero()) return true;
  if (d.q >= 0) return true;
  const div_ = pow10(-d.q);
  return d.m % div_ === 0n;
}

// Round to `sig` significant digits (value preserved, still stored as 15 digits).
function roundSig(d, sig) {
  if (d.isZero() || sig >= PREC) return d;
  const drop = PREC - sig, div_ = pow10(drop);
  let m = d.m / div_;
  if ((d.m % div_) * 2n >= div_) m += 1n;
  return mk(d.s, m, d.q + drop);
}

// Round to `dp` decimal places.
function roundDp(d, dp) {
  if (d.isZero()) return d;
  const k = d.q + dp;
  if (k >= 0) return d;
  const div_ = pow10(-k);
  let m = d.m / div_;
  if ((d.m % div_) * 2n >= div_) m += 1n;
  return mk(d.s, m, -dp);
}

const OVERFLOW_EXP = 100;
function checkRange(d) {
  if (!d.isZero() && d.exp >= OVERFLOW_EXP) mathError();
  return d;
}

// ---------------------------------------------------------------- formatting

// digits(d, n) -> { sign, ds (n chars), exp }
function digitsOf(d, n) {
  const r = roundSig(d, n);
  return { s: r.s, ds: r.m.toString().slice(0, n), exp: r.exp };
}

// The mantissa field is 10 digit characters wide and the leading "0" of a
// number below 1 occupies one of them. Verified on the machine:
//   1÷2π  -> 0.159154943   (not 0.1591549431)
//   1÷2√2 -> 0.35355339    (10 digits "0.353553390", trailing zero stripped)
// Digits past the tenth character are cut, not re-rounded.
const FIELD = 10;
function plain(sign, ds, exp, cap = false) {
  let out;
  if (exp >= 0) {
    const ip = ds.length > exp + 1 ? ds.slice(0, exp + 1) : ds.padEnd(exp + 1, '0');
    let fp = ds.length > exp + 1 ? ds.slice(exp + 1) : '';
    fp = fp.replace(/0+$/, '');
    out = fp ? `${ip}.${fp}` : ip;
  } else {
    let d = ds;
    if (cap) d = d.slice(0, Math.max(0, FIELD + exp));   // leading 0 + zeros eat places
    const fp = ('0'.repeat(-exp - 1) + d).replace(/0+$/, '');
    out = `0.${fp || '0'}`;
  }
  return (sign < 0 ? '-' : '') + out;
}

/**
 * Format a result the way the calculator's lower display line shows it.
 * cfg: { disp: 'norm1'|'norm2'|'fix'|'sci', n }
 * Returns { mant, exp } — exp null means plain notation.
 */
function format(d, cfg = { disp: 'norm1' }) {
  const disp = cfg.disp || 'norm1';
  const n = cfg.n ?? 0;

  if (disp === 'sci') {
    const sig = n === 0 ? 10 : n;
    const g = digitsOf(d, sig);
    if (d.isZero()) return { mant: sig > 1 ? `0.${'0'.repeat(sig - 1)}` : '0', exp: 0 };
    const mant = (g.s < 0 ? '-' : '') + (sig > 1 ? `${g.ds[0]}.${g.ds.slice(1)}` : g.ds[0]);
    return { mant, exp: g.exp };
  }

  if (disp === 'fix') {
    const r = roundDp(d, n);
    // Too big for the display: the machine falls back to plain Norm1 exponential
    // (trailing zeros stripped), NOT to a Fix-padded mantissa. Confirmed on the machine.
    if (r.exp >= 10) return format(r, { disp: 'norm1' });
    const sign = r.s < 0 && !r.isZero() ? '-' : '';
    if (r.isZero()) return { mant: n ? `0.${'0'.repeat(n)}` : '0', exp: null };
    const sig = Math.max(1, r.exp + 1 + n);
    const g = digitsOf(r, Math.min(sig, PREC));
    let body = plain(1, g.ds, g.exp);
    if (n > 0) {
      const dot = body.indexOf('.');
      if (dot < 0) body += '.' + '0'.repeat(n);
      else body = body.padEnd(dot + 1 + n, '0');
    } else if (body.includes('.')) body = body.split('.')[0];
    return { mant: sign + body, exp: null };
  }

  // Norm1 / Norm2
  if (d.isZero()) return { mant: '0', exp: null };
  const g = digitsOf(d, 10);
  const lo = disp === 'norm2' ? -10 : -3;      // norm1: |x|<10^-2 -> exp <= -3
  if (g.exp <= lo || g.exp >= 10) {
    const ds = g.ds.replace(/0+$/, '') || '0';
    const mant = (g.s < 0 ? '-' : '') + (ds.length > 1 ? `${ds[0]}.${ds.slice(1)}` : ds[0]);
    return { mant, exp: g.exp };
  }
  return { mant: plain(g.s, g.ds, g.exp, true), exp: null };
}

// Engineering notation: shift exponent to a multiple of 3. dir -1 = ENG, +1 = ENG<-
function engShift(d, cur, dir) {
  const step = dir < 0 ? 3 : -3;
  return { d, engExp: cur + step };
}

function formatEng(d, engExp) {
  if (d.isZero()) return { mant: '0', exp: engExp };
  const scaled = mk(d.s, d.m, d.q - engExp);
  const g = digitsOf(scaled, 10);
  return { mant: plain(g.s, g.ds, g.exp), exp: engExp };
}

function toDisplayString(d, cfg) {
  const f = format(d, cfg);
  return f.exp === null ? f.mant : `${f.mant}×10^${f.exp}`;
}

// fx-50FH II scientific constants: CODATA 2010, SPEC §9.
// qₑ names the elementary-charge key; bare e remains Euler’s number.
const SCI_CONSTANTS = [
  ['mp', '1.672621777e-27'], ['mn', '1.674927351e-27'], ['me', '9.10938291e-31'], ['mμ', '1.883531475e-28'],
  ['a₀', '5.2917721092e-11'], ['h', '6.62606957e-34'], ['μN', '5.05078353e-27'], ['μB', '9.27400968e-24'],
  ['ħ', '1.054571726e-34'], ['α', '7.2973525698e-3'], ['re', '2.8179403267e-15'], ['λc', '2.4263102389e-12'],
  ['γp', '267522200.5'], ['λcp', '1.32140985623e-15'], ['λcn', '1.3195909068e-15'], ['R∞', '10973731.568539'],
  ['u', '1.660538921e-27'], ['μp', '1.410606743e-26'], ['μe', '-9.2847643e-24'], ['μn', '-9.6623647e-27'],
  ['μμ', '-4.49044807e-26'], ['F', '96485.3365'], ['e', '1.602176565e-19'], ['NA', '6.02214129e23'],
  ['k', '1.3806488e-23'], ['Vm', '0.022710953'], ['R', '8.3144621'], ['C₀', '299792458'],
  ['C₁', '3.74177153e-16'], ['C₂', '0.01438777'], ['σ', '5.670373e-8'], ['ε₀', '8.854187817e-12'],
  ['μ₀', '12.566370614e-7'], ['φ₀', '2.067833758e-15'], ['g', '9.80665'], ['G₀', '7.7480917346e-5'],
  ['Z₀', '376.730313461'], ['t', '273.15'], ['G', '6.67384e-11'], ['atm', '101325'],
]
const sciToken = symbol => symbol === "e" ? "qₑ" : symbol;
const SCI_VALUES = Object.fromEntries(SCI_CONSTANTS.flatMap(([symbol,value],i) => [[sciToken(symbol),value],[`CONST(${i+1})`,value]]));
const SCI_NAMES = Object.keys(SCI_VALUES).sort((a,b)=>b.length-a.length);

// Numerical integration and differentiation for the fx-3650P II.
// The 15-point Gauss–Kronrod pair estimates its own integration error.
// The expression is parsed once by engine.mjs; sample() only changes X.
const GK_X = [0.9914553711208126, 0.9491079123427585, 0.8648644233597691,
  0.7415311855993945, 0.5860872354676911, 0.4058451513773972,
  0.2077849550078985, 0];
const GK_W = [0.022935322010529225, 0.06309209262997855, 0.10479001032225018,
  0.14065325971552592, 0.1690047266392679, 0.19035057806478542,
  0.2044329400752989, 0.20948214108472783];
const G_W = [0, 0.1294849661688697, 0, 0.27970539148927664,
  0, 0.3818300505051189, 0, 0.4179591836734694];

function integrate(sample, a, b, tolerance = 1e-5) {
  if (a === b) return 0;
  const sign = b < a ? -1 : 1;
  if (sign < 0) [a, b] = [b, a];
  let result = 0, used = 0;
  const stack = [[a, b]];
  while (stack.length) {
    const [lo, hi] = stack.pop();
    const mid = (lo + hi) / 2, half = (hi - lo) / 2;
    let kronrod = GK_W[7] * sample(mid);
    let gauss = G_W[7] * sample(mid);
    used++;
    for (let j = 0; j < 7; j++) {
      const pair = sample(mid - half * GK_X[j]) + sample(mid + half * GK_X[j]);
      used += 2;
      kronrod += GK_W[j] * pair;
      gauss += G_W[j] * pair;
    }
    kronrod *= half; gauss *= half;
    // Scale each interval's allowance by its share of the original domain.
    const allowance = tolerance * (hi - lo) / (b - a) * Math.max(1, Math.abs(kronrod));
    if (Math.abs(kronrod - gauss) <= allowance) result += kronrod;
    else {
      if (used >= 30000 || mid === lo || mid === hi) throw new Error('Time Out Error');
      stack.push([mid, hi], [lo, mid]);
    }
  }
  return sign * result;
}

function differentiate(sample, x, tolerance = 1e-10) {
  const scale = Math.max(1, Math.abs(x));
  let h = scale * 1e-3, previous = null;
  for (let k = 0; k < 16; k++) {
    const coarse = (sample(x + h) - sample(x - h)) / (2 * h);
    const fine = (sample(x + h / 2) - sample(x - h / 2)) / h;
    const estimate = (4 * fine - coarse) / 3;
    if (previous !== null && Math.abs(estimate - previous) <= tolerance * Math.max(1, Math.abs(estimate)))
      return estimate;
    previous = estimate;
    h /= 2;
  }
  throw new Error('Time Out Error');
}


// fx-50FH II emulator — expression engine (lexer + parser + evaluator)
// Precedence follows the official 12-level table in SPEC.md §8.





const err = k => { throw new CalcError(k); };
const mathErr = () => err('Math ERROR');
const synErr = () => err('Syntax ERROR');

// ------------------------------------------------------------ complex layer
// A value is a Dec (real) or a Cx (complex). Cx is only produced when the
// imaginary part is non-zero, so real-only work never pays for complex code.
class Cx {
  constructor(re, im) { this.re = re; this.im = im; }
}
const isCx = v => v instanceof Cx;
const RE = v => (isCx(v) ? v.re : v);
const IM = v => (isCx(v) ? v.im : ZERO);
const cx = (re, im) => (im.isZero() ? re : new Cx(re, im));

const cadd = (a, b) => cx(add(RE(a), RE(b)), add(IM(a), IM(b)));
const csub = (a, b) => cx(sub(RE(a), RE(b)), sub(IM(a), IM(b)));
const cmul = (a, b) => cx(
  sub(mul(RE(a), RE(b)), mul(IM(a), IM(b))),
  add(mul(RE(a), IM(b)), mul(IM(a), RE(b))));
function cdiv(a, b) {
  const c = RE(b), d = IM(b);
  const den = add(mul(c, c), mul(d, d));
  if (den.isZero()) mathErr();
  return cx(div(add(mul(RE(a), c), mul(IM(a), d)), den),
            div(sub(mul(IM(a), c), mul(RE(a), d)), den));
}
const cabs = v => (isCx(v) ? fromNumber(Math.hypot(toNumber(v.re), toNumber(v.im))) : v.abs());
const cconj = v => (isCx(v) ? new Cx(v.re, v.im.neg()) : v);
function cpowInt(z, k) {
  if (k < 0) return cdiv(ONE, cpowInt(z, -k));
  let r = ONE;
  for (let i = 0; i < k; i++) r = cmul(r, z);
  return r;
}

// dispatchers used by the evaluator
const vadd = (a, b) => (isCx(a) || isCx(b) ? cadd(a, b) : add(a, b));
const vsub = (a, b) => (isCx(a) || isCx(b) ? csub(a, b) : sub(a, b));
const vmul = (a, b) => (isCx(a) || isCx(b) ? cmul(a, b) : mul(a, b));
const vdiv = (a, b) => (isCx(a) || isCx(b) ? cdiv(a, b) : div(a, b));
const vcheck = v => { if (isCx(v)) { checkRange(v.re); checkRange(v.im); return v; } return checkRange(v); };

// ------------------------------------------------------------------ lexer

// Longest match first.
const LIT = [
  ...SCI_NAMES.filter(s => s !== 'σ').map(s => [s, 'CONST', s]),
  ['d/dx(', 'FN', 'diff'], ['∫(', 'FN', 'integral'],
  ['sinh⁻¹(', 'FN', 'asinh'], ['cosh⁻¹(', 'FN', 'acosh'], ['tanh⁻¹(', 'FN', 'atanh'],
  ['sin⁻¹(', 'FN', 'asin'], ['cos⁻¹(', 'FN', 'acos'], ['tan⁻¹(', 'FN', 'atan'],
  ['asinh(', 'FN', 'asinh'], ['acosh(', 'FN', 'acosh'], ['atanh(', 'FN', 'atanh'],
  ['sinh(', 'FN', 'sinh'], ['cosh(', 'FN', 'cosh'], ['tanh(', 'FN', 'tanh'],
  ['asin(', 'FN', 'asin'], ['acos(', 'FN', 'acos'], ['atan(', 'FN', 'atan'],
  ['sin(', 'FN', 'sin'], ['cos(', 'FN', 'cos'], ['tan(', 'FN', 'tan'],
  ['log(', 'FN', 'log'], ['ln(', 'FN', 'ln'],
  ['e^(', 'FN', 'exp'], ['10^(', 'FN', 'pow10'],
  ['³√(', 'FN', 'cbrt'], ['cbrt(', 'FN', 'cbrt'],
  ['√(', 'FN', 'sqrt'], ['sqrt(', 'FN', 'sqrt'],
  ['Abs(', 'FN', 'abs'], ['Rnd(', 'FN', 'rnd'],
  ['Conjg(', 'FN', 'conjg'], ['arg(', 'FN', 'arg'],
  ['▸a+bi', 'POST', 'torect'], ['▸r∠θ', 'POST', 'topolar'],
  ['∠', 'OP', 'ang'],
  ['Pol(', 'FN', 'pol'], ['Rec(', 'FN', 'rec'],
  ['Ran#', 'RAN', null],
  ['Ans', 'VAR', 'Ans'],
  // SD single-variable statistics. Longest first so Σx² beats Σx, and minX /
  // maxX beat the bare X variable. σx² is not a token — it is σx with the x²
  // key after it, exactly as the machine makes you type it (SPEC §11b).
  ['Σx²y','STAT','sumx2y'], ['Σx³','STAT','sumx3'], ['Σx⁴','STAT','sumx4'],
  ['Σxy','STAT','sumxy'], ['Σy²','STAT','ysumsq'], ['Σy','STAT','ysum'],
  ['ȳ','STAT','ymean'], ['σy','STAT','ysd'], ['sy','STAT','yssd'],
  ['x̂','POST','predictX'], ['ŷ','POST','predictY'],
  ['regA','STAT','regA'], ['regB','STAT','regB'], ['regR','STAT','regR'],
  ['a','STAT','regA'], ['b','STAT','regB'], ['r','STAT','regR'],
  ['Σx²', 'STAT', 'sumsq'], ['Σx', 'STAT', 'sum'],
  ['x̄', 'STAT', 'mean'], ['σx', 'STAT', 'sd'], ['sx', 'STAT', 'ssd'],
  ['σ', 'CONST', 'σ'],
  ['minX', 'STAT', 'min'], ['maxX', 'STAT', 'max'],

  // AFTER nPr / nCr: this table is scanned in order, and a bare 'n' placed

  ['n', 'STAT', 'count'],

  ['⁻¹', 'POST', 'inv'], ['²', 'POST', 'sq'], ['³', 'POST', 'cube'],
  ['π', 'CONST', 'pi'], ['pi', 'CONST', 'pi'],
  ['>=', 'REL', 'ge'], ['<=', 'REL', 'le'], ['<>', 'REL', 'ne'],
  ['≠', 'REL', 'ne'], ['≥', 'REL', 'ge'], ['≤', 'REL', 'le'],
  ['=', 'REL', 'eq'], ['>', 'REL', 'gt'], ['<', 'REL', 'lt'],
  ['×', 'OP', 'mul'], ['*', 'OP', 'mul'], ['÷', 'OP', 'div'], ['/', 'OP', 'div'],
  ['+', 'OP', 'addop'], ['-', 'OP', 'subop'], ['−', 'OP', 'subop'],
  // ⊖ is the (−) key itself: a sign only. After a value it is a Syntax ERROR
  // (Nixon, 2026-11-11: "3 minus 2 is 1 vs 3 negative 2 is syntax error").
  ['⊖', 'OP', 'negop'],
  ['^', 'OP', 'pow'],
  ['(', 'LP', null], [')', 'RP', null], [',', 'COMMA', null],
  ['!', 'POST', 'fact'], ['%', 'POST', 'pct'],
  ['°', 'DMS', null], ["'", 'DMS', null], ['"', 'DMS', null],
  ['⌐', 'FRAC', null], ['」', 'FRAC', null], ['_', 'FRAC', null],
  ['→', 'ASSIGN', null],
  ['ᵈ', 'POST', 'udeg'], ['ʳ', 'POST', 'urad'], ['ᵍ', 'POST', 'ugra'],
  ['e', 'CONST', 'e'], ['i', 'CONST', 'i'],
].sort((a,b) => b[0].length-a[0].length);
const VARS = ['A', 'B', 'C', 'D', 'X', 'Y', 'M'];
const NUMRE = /^(?:\d+\.?\d*|\.\d+)(?:[Eᴇ][+-]?\d+)?/;

function lex(src) {
  const out = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === ' ' || c === '\t') { i++; continue; }
    const rest = src.slice(i);
    const nm = NUMRE.exec(rest);
    if (nm && /[\d.]/.test(c)) {
      out.push({ type: 'NUM', text: nm[0].replace('ᴇ', 'E'), hasPoint: nm[0].includes('.'), pos: i });
      i += nm[0].length;
      // a second point in one number (1.2.3) is a Syntax ERROR (Nixon, 2026-11-11)
      if (src[i] === '.' && nm[0].includes('.')) { const e = new CalcError('Syntax ERROR'); e.pos = i; throw e; }
      continue;
    }
    // EXP with no mantissa in front of it means 1: ᴇ3 is 1000.
    // (Nixon's published programs write ᴇ3 → X for 1000 → X, two bytes.)
    // The key types ᴇ, U+1D07 — 'E' is only what the engine writes internally,
    // so both spellings have to lex. His Prog04 opens with "ᴇ-4i→X".
    if (c === 'E' || c === 'ᴇ') {
      const em = /^[Eᴇ]([+-]?\d+)/.exec(rest);
      if (em) {
        out.push({ type: 'NUM', text: `1E${em[1]}`, hasPoint: false, pos: i });
        i += em[0].length;
        continue;
      }
    }
    let hit = null;
    for (const [lit, type, val] of LIT) {
      if (rest.startsWith(lit)) { hit = { type, val, text: lit }; break; }
    }
    if (!hit && VARS.includes(c)) hit = { type: 'VAR', val: c, text: c };
    if (!hit) { const e = new CalcError('Syntax ERROR'); e.pos = i; throw e; }
    hit.pos = i;
    out.push(hit);
    i += hit.text.length;
  }
  return out;
}

// ----------------------------------------------------------------- parser

const BP = {
  assign: 15, or: 20, and: 30, rel: 40, addsub: 50, muldiv: 60,
  ncr: 70, implicit: 80, prefix: 90, frac: 100, post: 110,
};

const STARTERS = new Set(['NUM', 'CONST', 'VAR', 'FN', 'LP', 'RAN']);

// How many arguments each bracketed function may take. Everything not listed
// takes exactly one, and must therefore NOT swallow a comma: in
// "log(Abs(D,Abs(BD」A" the comma belongs to log(, and Abs( has to close first.
// Nixon's published Prog03 is written that way, so getting this wrong makes a
// published program quietly return the wrong number.
const MAX_ARGS = { log: 2, pol: 2, rec: 2, integral: 4, diff: 3 };

class Parser {
  constructor(toks, len) { this.t = toks; this.i = 0; this.len = len; }
  fail() {
    const t = this.peek();
    const e = new CalcError('Syntax ERROR');
    e.pos = t ? t.pos : this.len;
    throw e;
  }
  peek(k = 0) { return this.t[this.i + k]; }
  next() { return this.t[this.i++]; }
  eat(type) { if (this.peek() && this.peek().type === type) { this.i++; return true; } return false; }
  // A missing closing paren is legal at the end of the expression, and also
  // immediately before "→ variable": the machine closes every open bracket
  // before it stores. So -B」(2A→X means -B」(2A)→X, and √(D→Y means √(D)→Y.
  // Nixon's published programs rely on this everywhere.
  closeParen() {
    if (this.eat('RP')) return;
    const t = this.peek();
    // nothing left, "→ variable", or a comma belonging to an enclosing
    // two-argument function — all of these close the bracket for you
    if (!t || t.type === 'ASSIGN' || t.type === 'COMMA') return;
    this.fail();
  }

  parse() {
    const n = this.expr(0);
    if (this.peek()) this.fail();
    return n;
  }

  atom() {
    const t = this.peek();
    if (!t) this.fail();
    if (t.type === 'OP' && (t.val === 'subop' || t.val === 'negop')) { this.next(); return { k: 'neg', x: this.expr(BP.prefix) }; }
    if (t.type === 'OP' && t.val === 'addop') { this.next(); return this.expr(BP.prefix); }
    this.next();
    switch (t.type) {
      case 'NUM': return { k: 'num', v: fromString(t.text.replace('E', 'e')), hasPoint: t.hasPoint };
      case 'CONST': return { k: 'const', name: t.val };
      case 'VAR': return { k: 'var', name: t.val };
      case 'STAT': return { k: 'stat', name: t.val };
      case 'RAN': return { k: 'ran' };
      // Bracket contents stop short of "→": assignment is a statement-level
      // operator, so it can never live inside a bracket (see closeParen).
      case 'LP': { const e = this.expr(BP.assign + 1); this.closeParen(); return e; }
      case 'FN': {
        const max = MAX_ARGS[t.val] ?? 1;
        const args = [this.expr(BP.assign + 1)];
        while (args.length < max && this.eat('COMMA')) args.push(this.expr(BP.assign + 1));
        this.closeParen();
        return { k: 'fn', name: t.val, args };
      }
      default: return this.fail();
    }
  }

  expr(minbp) {
    let left = this.atom();
    for (;;) {
      const t = this.peek();
      if (!t) break;

      if (t.type === 'POST') {
        if (BP.post < minbp) break;
        this.next();
        left = { k: 'post', op: t.val, x: left };
        continue;
      }
      if (t.type === 'DMS') {
        if (BP.post < minbp) break;
        this.next();
        const parts = [left];
        while (parts.length < 3 && this.peek() && this.peek().type === 'NUM'
               && this.peek(1) && this.peek(1).type === 'DMS') {
          parts.push({ k: 'num', v: fromString(this.next().text.replace('E', 'e')) });
          this.next();
        }
        left = { k: 'dms', parts };
        continue;
      }
      if (t.type === 'FRAC') {
        if (BP.frac < minbp) break;
        const parts = [left];
        while (parts.length < 3 && this.peek() && this.peek().type === 'FRAC') {
          this.next();
          parts.push(this.expr(BP.frac + 1));
        }
        left = { k: 'frac', parts };
        continue;
      }
      if (t.type === 'OP') {
        const o = t.val;
        if (o === 'pow' || o === 'xroot') {
          if (BP.post < minbp) break;
          this.next();
          left = { k: o, l: left, r: this.expr(BP.post) };     // right-assoc
          continue;
        }
        if (o === 'nPr' || o === 'nCr' || o === 'ang') {
          if (BP.ncr < minbp) break;
          this.next();
          left = { k: o, l: left, r: this.expr(BP.ncr + 1) };
          continue;
        }
        if (o === 'mul' || o === 'div') {
          if (BP.muldiv < minbp) break;
          this.next();
          left = { k: 'bin', op: o, l: left, r: this.expr(BP.muldiv + 1) };
          continue;
        }
        if (o === 'negop') { const e = new CalcError('Syntax ERROR'); e.pos = t.pos; throw e; }
        if (o === 'addop' || o === 'subop') {
          if (BP.addsub < minbp) break;
          this.next();
          left = { k: 'bin', op: o, l: left, r: this.expr(BP.addsub + 1) };
          continue;
        }
      }
      if (t.type === 'ASSIGN') {
        if (BP.assign < minbp) break;
        this.next();
        const v = this.next();
        if (!v || v.type !== 'VAR') this.fail();
        left = { k: 'store', x: left, name: v.val };
        continue;
      }
      if (t.type === 'REL') {
        if (BP.rel < minbp) break;
        this.next();
        left = { k: 'rel', op: t.val, l: left, r: this.expr(BP.rel + 1) };
        continue;
      }
      // implicit multiplication — binds tighter than × ÷ (official level 6)
      if (STARTERS.has(t.type)) {
        if (BP.implicit < minbp) break;
        left = { k: 'bin', op: 'mul', l: left, r: this.expr(BP.implicit + 1), implicit: true };
        continue;
      }
      break;
    }
    return left;
  }
}

const parse = src => new Parser(lex(src), src.length).parse();

// -------------------------------------------------------------- evaluator

const PI = fromString('3.14159265358980');
const E_ = fromString('2.71828182845904');

const D180 = fromInt(180), D200 = fromInt(200), D100 = fromInt(100), D60 = fromInt(60);
const D3600 = fromInt(3600), ONE = fromInt(1), TWO = fromInt(2);

function toRad(d, unit) {
  if (unit === 'rad') return d;
  return div(mul(d, PI), unit === 'gra' ? D200 : D180);
}
function fromRad(d, unit) {
  if (unit === 'rad') return d;
  return div(mul(d, unit === 'gra' ? D200 : D180), PI);
}

const trigLimit = { deg: 9e9, rad: 157079632.7, gra: 1e10 };
const PERIOD = { deg: 360, gra: 400 };

/** sin/cos/tan with exact values at the quarter-turns, so sin(180) is really 0. */
function trigOf(name, v, unit) {
  const period = PERIOD[unit];
  if (period) {
    let r = v % period;
    if (r < 0) r += period;
    const q = period / 4;
    if (r % q === 0) {
      const k = Math.round(r / q) % 4;
      const S_ = [0, 1, 0, -1][k], C_ = [1, 0, -1, 0][k];
      if (name === 'sin') return fromInt(S_);
      if (name === 'cos') return fromInt(C_);
      if (C_ === 0) mathErr();                 // tan 90, tan 270
      return fromInt(S_ === 0 ? 0 : S_ / C_);
    }
    return fromNumber(Math[name]((r / period) * 2 * Math.PI));
  }
  return fromNumber(Math[name](v));
}

/** radians (from JS) back into the current angle unit, exactly: acos(-1) is 180. */
function degOf(rad, unit) {
  if (unit === 'rad') return fromNumber(rad);
  return fromNumber((rad / Math.PI) * (unit === 'gra' ? 200 : 180));
}

function bigFact(n) { let r = 1n; for (let i = 2n; i <= n; i++) r *= i; return r; }

function intPow(base, k) {
  // exact integer power via BigInt so that 2^10 is exactly 1024
  const neg = k < 0; k = Math.abs(k);
  if (k === 0) return ONE;
  let r = mk(base.s ** (k % 2 === 0 ? 2 : 1) < 0 ? -1 : 1, base.m ** BigInt(k), base.q * k);
  r = mk(base.s < 0 && k % 2 === 1 ? -1 : 1, base.m ** BigInt(k), base.q * k);
  return neg ? div(ONE, r) : r;
}

class Ctx {
  constructor(opts = {}) {
    this.angle = opts.angle || 'deg';           // deg | rad | gra
    this.disp = opts.disp || { disp: 'norm1' };  // norm1 | norm2 | fix | sci
    this.frac = opts.frac || 'ab/c';             // ab/c | d/c
    this.cplx = opts.cplx || 'a+bi';             // a+bi | r∠θ
    this.mode = opts.mode || 'COMP';             // COMP | CMPLX | BASE | SD | REG | PRGM
    this.model = opts.model || MODEL;
    this.vars = { A: ZERO, B: ZERO, C: ZERO, D: ZERO, X: ZERO, Y: ZERO, M: ZERO, Ans: ZERO };
    this.rng = opts.rng || Math.random;
    // SD samples: one entry per DT press, each {v, f} = value and frequency.
    // Leaving SD (or ClrStat) empties it — SPEC §11b.
    this.stat = [];
    this.freqOn = opts.freqOn !== false;
    this.regType = 'LIN';
    this.reset();
  }
  reset() { this.sawFrac = false; this.sawPoint = false; this.sawDms = false; this.forceCplx = null; }
}

function evalNode(n, ctx) {
  switch (n.k) {
    case 'num':
      if (n.hasPoint) ctx.sawPoint = true;
      return n.v;
    case 'const':
      if (Object.prototype.hasOwnProperty.call(SCI_VALUES, n.name)) return fromString(SCI_VALUES[n.name]);
      if (n.name === 'pi') return PI;
      if (n.name === 'e') return E_;
      return new Cx(ZERO, ONE);                    // i
    case 'var': return ctx.vars[n.name] ?? ZERO;
    case 'stat': return statValue(n.name, ctx);
    case 'ran': return fromString((Math.floor(ctx.rng() * 1000) / 1000).toFixed(3));
    case 'neg': {
      const v = evalNode(n.x, ctx);
      return isCx(v) ? new Cx(v.re.neg(), v.im.neg()) : v.neg();
    }

    case 'bin': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      switch (n.op) {
        case 'addop': return vcheck(vadd(a, b));
        case 'subop': return vcheck(vsub(a, b));
        case 'mul': return vcheck(vmul(a, b));
        case 'div': return vcheck(vdiv(a, b));
      }
      break;
    }

    case 'ang': {                                   // r∠θ  -> complex
      const r = evalNode(n.l, ctx), th = evalNode(n.r, ctx);
      if (isCx(r) || isCx(th)) mathErr();
      const rad = toNumber(toRad(th, ctx.angle));
      return vcheck(cx(mul(r, fromNumber(Math.cos(rad))), mul(r, fromNumber(Math.sin(rad)))));
    }

    case 'rel': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      if (isCx(a) || isCx(b)) {
        // Nixon's realCal confirmation: compare both components for = and ≠.
        if (n.op === 'eq' || n.op === 'ne') {
          const same = eq(RE(a), RE(b)) && eq(IM(a), IM(b));
          return (n.op === 'eq' ? same : !same) ? ONE : ZERO;
        }
        mathErr();
      }
      const c = cmp(a, b);
      const t = { eq: c === 0, ne: c !== 0, gt: c > 0, ge: c >= 0, lt: c < 0, le: c <= 0 }[n.op];
      return t ? ONE : ZERO;      // relational ops return 1 / 0 (goes to Ans)
    }

    case 'frac': {
      ctx.sawFrac = true;
      const p = n.parts.map(x => evalNode(x, ctx));
      // A complex part is never an integer, and isInteger() would crash on one.
      // Nixon's Co-Geo program divides complex numbers with the fraction key all
      // through ("Y」(B−C", "abs(C」2(M−Conjg(M"), so this path has to hold up.
      if (p.some(x => isCx(x) || !isInteger(x))) ctx.sawPoint = true;
      if (p.length === 2) return vcheck(vdiv(p[0], p[1]));
      if (p.length === 3) {
        // a b/c needs a sign to decide add-or-subtract, which a complex whole
        // part does not have. The machine has no complex mixed fraction either.
        if (p.some(isCx)) mathErr();
        const f = div(p[1], p[2]);
        return p[0].s < 0 ? sub(p[0], f) : add(p[0], f);
      }
      return p[0];
    }

    case 'dms': {
      ctx.sawDms = true;
      const p = n.parts.map(x => evalNode(x, ctx));
      const sign = p[0].s < 0 ? -1 : 1;
      let v = p[0].abs();
      if (p[1]) v = add(v, div(p[1], D60));
      if (p[2]) v = add(v, div(p[2], D3600));
      return sign < 0 ? v.neg() : v;
    }

    case 'post': {
      const x = evalNode(n.x, ctx);
      switch (n.op) {
        case 'sq': return vcheck(vmul(x, x));
        case 'cube': return vcheck(vmul(vmul(x, x), x));
        case 'inv':
          if (isCx(x)) return vcheck(cdiv(ONE, x));
          return x.isZero() ? mathErr() : div(ONE, x);
        case 'torect': ctx.forceCplx = 'a+bi'; return x;
        case 'topolar': ctx.forceCplx = 'r∠θ'; return x;
      }
      if (isCx(x)) mathErr();
      switch (n.op) {
        case 'predictX': { const c = linearRegression(ctx); if(c.b.isZero()) mathErr(); return div(sub(x,c.a),c.b); }
        case 'predictY': { const c = linearRegression(ctx); return add(c.a,mul(c.b,x)); }
        case 'pct': return div(x, D100);
        case 'udeg': return fromRad(toRad(x, 'deg'), ctx.angle);
        case 'urad': return fromRad(x, ctx.angle);
        case 'ugra': return fromRad(toRad(x, 'gra'), ctx.angle);
        case 'fact': {
          if (!isInteger(x) || x.s < 0 || cmp(x, fromInt(69)) > 0) mathErr();
          return mk(1, bigFact(BigInt(Math.round(toNumber(x)))), 0);
        }
      }
      break;
    }

    case 'pow': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      if (isCx(a)) {
        // Verified on the machine: a complex base accepts ^2 and ^3 only —
        // ^1, ^0 and fractional powers all give Math ERROR.
        if (isCx(b) || !isInteger(b)) mathErr();
        const k = toNumber(b);
        if (k !== 2 && k !== 3) mathErr();
        return vcheck(cpowInt(a, k));
      }
      if (isCx(b)) mathErr();
      return checkRange(power(a, b));
    }
    case 'xroot': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);   // a-th root of b
      if (isCx(a) || isCx(b)) mathErr();
      if (a.isZero()) mathErr();
      return checkRange(power(b, div(ONE, a)));
    }

    case 'nPr': case 'nCr': {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      if (isCx(a) || isCx(b)) mathErr();
      if (!isInteger(a) || !isInteger(b) || a.s < 0 || b.s < 0 || cmp(b, a) > 0) mathErr();
      const N = BigInt(Math.round(toNumber(a))), R = BigInt(Math.round(toNumber(b)));
      if (N > 100000n) mathErr();
      const p = bigFact(N) / bigFact(N - R);
      return checkRange(mk(1, n.k === 'nPr' ? p : p / bigFact(R), 0));
    }

    case 'store': {
      const v = evalNode(n.x, ctx);
      ctx.vars[n.name] = v;
      return v;
    }

    case 'fn': return callFn(n, ctx);
  }
  return synErr();
}

function power(a, b) {
  if (isInteger(b) && Math.abs(toNumber(b)) <= 64) return intPow(a, Math.round(toNumber(b)));
  if (a.s < 0) mathErr();                       // non-integer power of a negative number
  if (a.isZero()) return b.s > 0 ? ZERO : mathErr();
  return fromNumber(Math.pow(toNumber(a), toNumber(b)));
}

// Check the expression tree before evaluating any argument, so rejected
// Pol/Rec/nested calculus never changes X, Y, or other calculator state.
function containsFn(node, names) {
  if (!node || typeof node !== 'object') return false;
  if (node.k === 'fn' && names.includes(node.name)) return true;
  return Object.values(node).some(v => Array.isArray(v)
    ? v.some(child => containsFn(child, names)) : containsFn(v, names));
}

function calculus(n, ctx) {
  if (ctx.model !== '3650PII' || ctx.mode !== 'COMP') mathErr();
  const integral = n.name === 'integral';
  if (n.args.length < (integral ? 3 : 2)) synErr();
  if (n.args.some(arg => containsFn(arg, ['integral', 'diff'])) ||
      containsFn(n.args[0], ['pol', 'rec'])) mathErr();
  const hasTrig = containsFn(n.args[0], ['sin', 'cos', 'tan', 'asin', 'acos', 'atan']);
  if (hasTrig && ctx.angle !== 'rad') mathErr();
  const params = n.args.slice(1).map(arg => evalNode(arg, ctx));
  if (params.some(isCx)) mathErr();
  const values = params.map(toNumber);
  const tol = values[integral ? 2 : 1] ?? (integral ? 1e-5 : 1e-10);
  if (!Number.isFinite(tol) || tol < 1e-14) mathErr();
  const oldX = ctx.vars.X;
  const sample = x => {
    ctx.vars.X = fromNumber(x);
    const v = evalNode(n.args[0], ctx);
    if (isCx(v)) mathErr();
    return toNumber(v);
  };
  try {
    const v = integral
      ? integrate(sample, values[0], values[1], tol)
      : differentiate(sample, values[0], tol);
    // Remove accumulated binary quadrature noise below the engine's 15-digit
    // decimal precision; true-machine last-digit parity needs hardware data.
    return checkRange(fromNumber(Number(v.toPrecision(14))));
  } catch (e) {
    if (e.message === 'Time Out Error') err('Time Out Error');
    throw e;
  } finally {
    ctx.vars.X = oldX;
  }
}

function callFn(n, ctx) {
  if (n.name === 'integral' || n.name === 'diff') return calculus(n, ctx);
  const A = n.args.map(x => evalNode(x, ctx));
  const x = A[0];

  // complex-capable functions
  if (n.name === 'abs') return cabs(x);
  if (n.name === 'conjg') return cconj(x);
  // Rnd( takes a complex number too, rounding each half on its own (Nixon,
  // 2026-09-16). His Prog04 lives on it: with X = ᴇ-4i, a polynomial in X packs
  // its coefficients into one complex number, and Fix0 + Rnd( is what shakes
  // them back out one at a time — (2X+1)³ reads back 1, 6, 12, 8.
  if (n.name === 'rnd' && isCx(x)) return cx(applyRound(x.re, ctx), applyRound(x.im, ctx));
  if (n.name === 'arg') {
    if (!isCx(x)) return x.s < 0 && !x.isZero() ? fromRad(PI, ctx.angle) : ZERO;
    return fromRad(fromNumber(Math.atan2(toNumber(x.im), toNumber(x.re))), ctx.angle);
  }
  // everything else rejects complex arguments, exactly like the machine
  if (A.some(isCx)) mathErr();

  const u = ctx.angle;
  const num = toNumber(x);

  switch (n.name) {
    case 'sin': case 'cos': case 'tan': {
      if (Math.abs(num) >= trigLimit[u]) mathErr();
      return trigOf(n.name, num, u);
    }
    case 'asin': case 'acos':
      if (Math.abs(num) > 1) mathErr();
      return degOf(Math[n.name](num), u);
    case 'atan':
      return degOf(Math.atan(num), u);
    case 'sinh': case 'cosh': case 'tanh':
      return fromNumber(Math[n.name](num));
    case 'asinh': return fromNumber(Math.asinh(num));
    case 'acosh': if (num < 1) mathErr(); return fromNumber(Math.acosh(num));
    case 'atanh': if (Math.abs(num) >= 1) mathErr(); return fromNumber(Math.atanh(num));
    case 'log':
      if (A.length === 2) {                       // log(base, x)
        const bs = toNumber(A[0]), v = toNumber(A[1]);
        if (bs <= 0 || bs === 1 || v <= 0) mathErr();
        return fromNumber(Math.log(v) / Math.log(bs));
      }
      if (num <= 0) mathErr();
      return fromNumber(Math.log10(num));
    case 'ln': if (num <= 0) mathErr(); return fromNumber(Math.log(num));
    case 'exp': if (num > 230.2585092) mathErr(); return checkRange(fromNumber(Math.exp(num)));
    case 'pow10': if (num >= 100) mathErr(); return checkRange(fromNumber(Math.pow(10, num)));
    case 'sqrt':
      if (x.s < 0) {
        // √ of a negative real is fine in CMPLX mode: √(-4) = 2i
        if (ctx.mode !== 'CMPLX') mathErr();
        return new Cx(ZERO, fromNumber(Math.sqrt(-num)));
      }
      return fromNumber(Math.sqrt(num));
    case 'cbrt': return fromNumber(Math.cbrt(num));
    case 'rnd': return applyRound(x, ctx);
    case 'pol': {
      if (A.length < 2) synErr();          // Pol( needs both coordinates
      const [px, py] = A;
      const r = fromNumber(Math.hypot(toNumber(px), toNumber(py)));
      const th = fromRad(fromNumber(Math.atan2(toNumber(py), toNumber(px))), ctx.angle);
      ctx.vars.X = r; ctx.vars.Y = th;
      return r;
    }
    case 'rec': {
      if (A.length < 2) synErr();          // Rec( needs r and θ
      const [r, th] = A;
      const rad = toNumber(toRad(th, ctx.angle));
      const px = mul(r, fromNumber(Math.cos(rad)));
      const py = mul(r, fromNumber(Math.sin(rad)));
      ctx.vars.X = px; ctx.vars.Y = py;
      return px;
    }
  }
  return synErr();
}

// Rnd( — really round the value to the current display setting
function applyRound(x, ctx) {
  const c = ctx.disp;
  if (c.disp === 'fix') return roundDp(x, c.n);
  if (c.disp === 'sci') return roundSig(x, c.n === 0 ? 10 : c.n);
  return roundSig(x, 10);
}

// ------------------------------------------------------- result formatting

// Decimal -> fraction via continued fractions, respecting the 10-digit total rule.
function toFraction(d, style = 'ab/c') {
  if (d.isZero()) return null;
  const v = Math.abs(toNumber(d));
  let [h1, k1, h0, k0] = [1, 0, 0, 1];
  let xx = v;
  for (let i = 0; i < 32; i++) {
    const a = Math.floor(xx);
    [h1, h0] = [a * h1 + h0, h1];
    [k1, k0] = [a * k1 + k0, k1];
    if (k1 > 0 && Math.abs(v - h1 / k1) < 1e-11 * Math.max(1, v)) break;
    const frac = xx - a;
    if (frac < 1e-12) break;
    xx = 1 / frac;
  }
  if (!k1 || !isFinite(h1) || h1 > 1e10) return null;
  if (k1 === 1) return null;                       // whole number: not a fraction

/** Compile a program. A structure mistake (IfEnd with no If, For with no
 *  Next, If with no Then, …) must not stop the program before it starts: the
 *  machine runs everything up to the bad statement and only then shows

 *  compiled again up to the start of that statement, followed by an ERR
 *  instruction that raises the error when execution gets there. */

    if (!(e instanceof CalcError) || e.kind !== 'Syntax ERROR' || e.pos == null) throw e;
    let stopAt = 0;
    for (const t of scan(src)) if ((t.t === 'sep' || t.t === 'disp') && t.p < e.pos) stopAt = t.p + 1;

  // "Then B²-4AC", "-B÷2A→X", "C-AX²→Y". The span runs from just after the
  // previous separator (':', newline or an earlier ◢) up to this ◢, so a
  // leading `Then` is kept and the ':' itself is not.

  const emit = ins => (code.push(ins), code.length - 1);
  const loop = () => { for (let i = blocks.length - 1; i >= 0; i--) if (blocks[i].breaks) return blocks[i]; return null; };
  const closeArrow = () => { if (arrow !== null) { code[arrow].target = code.length; arrow = null; } };

    return t;

  for (let i = 0; i < T.length; i++) {
    const t = T[i];
    if (stopAt != null && t.p >= stopAt) break;

    if (t.t === 'sep') { segStart = t.p + 1; closeArrow(); continue; }
    if (t.t === 'disp') {
      emit({ op: 'DISP', at: t.p, text: S.slice(segStart, t.p).trim() });
      segStart = t.p + 1;
      closeArrow();
      continue;
    }
    if (t.t === 'arrow') {
      const last = code[code.length - 1];
      if (!last || last.op !== 'EXPR') pSynErr(t.p);
      last.op = 'JZ'; last.target = -1;
      arrow = code.length - 1;
      continue;
    }
    if (t.t === 'expr') {
      const m = /^\?\s*→\s*([A-DXYM])$/.exec(t.v);
      if (m) emit({ op: 'INPUT', name: m[1], at: t.p });
      else if (t.v.includes('?')) pSynErr(t.p); // Input must name a calculator variable.
      // The segment text rides along on EXPR too: when a program stops, the
      // machine leaves the LAST statement on the upper line even though it has
      // no ◢ (REAL, fx50-test-Prog1.mov ends on 'X-C→B' with its value showing).

/** Run `fn`, and if it fails, tag the error with where in the program text it

 *  event loop back between slices and AC still gets through — which is what the
 *  machine does: it runs until you stop it, for ever if you like.

 *  Nixon, 2026-09-26: he writes infinite loops ON PURPOSE (his vector product
 *  program is built on it, and the Co-Geo centre/radius loop in CLAUDE.md §19

 *  — ours in SPEC §11, nor the fx-3650P II manual's — has a "Time ERROR": we
 *  invented one and used it to cut his own programs off at 3×10⁶ steps.

 *  safety net for the test suites. That is a harness limit, not the machine. */

      // 2:While Ans²◢Ans+1◢WhileEnd shows 4,3,9,4,..., not 4,5,25,26,...

// Editor history contains code AND annotation anchors. Never export history.
const editorCopy = value => JSON.parse(JSON.stringify(value));
function editorSnapshot(src, comments = [], start = 0, end = start) {
  return {src, comments: editorCopy(comments), start, end};
}
function createEditorHistory(snapshot) {
  return {entries: [editorCopy(snapshot)], at: 0};
}
function editorRemember(history, snapshot) {
  const current = history.entries[history.at];
  if (current.src === snapshot.src && JSON.stringify(current.comments) === JSON.stringify(snapshot.comments)) {
    current.start = snapshot.start; current.end = snapshot.end;
    return false;
  }
  history.entries.splice(history.at + 1);
  history.entries.push(editorCopy(snapshot));
  if (history.entries.length > 300) history.entries.shift();
  history.at = history.entries.length - 1;
  return true;
}
function editorMove(history, direction) {
  const next = history.at + direction;
  if (next < 0 || next >= history.entries.length) return null;
  history.at = next;
  return editorCopy(history.entries[next]);
}
// A textarea input is one replacement, including paste/cut. Outside anchors
// shift, inside anchors expand/shrink. Deleted sections retain their notes.
function editorReanchor(comments, before, after) {
  if (before === after) return editorCopy(comments);
  let left = 0, suffix = 0;
  while (left < before.length && left < after.length && before[left] === after[left]) left++;
  while (suffix < before.length-left && suffix < after.length-left
    && before[before.length-1-suffix] === after[after.length-1-suffix]) suffix++;
  const oldEnd = before.length-suffix, newEnd = after.length-suffix, delta = newEnd-oldEnd;
  return comments.map(note => {
    const n = {...note};
    if (n.detached) { n.start = n.end = Math.min(after.length,n.start); return n; }
    if (oldEnd <= n.start) { n.start += delta; n.end += delta; }
    else if (left < n.end) {
      n.start = n.start < left ? n.start : left;
      n.end = n.end > oldEnd ? n.end+delta : newEnd;
      if (n.end <= n.start) { n.end = n.start; n.detached = true; }
    }
    if (!n.detached) n.quote = after.slice(n.start,n.end);
    return n;
  });
}





// fx-50FH II 程式簿 — a workbench for WRITING calculator programs, separate
// from the calculator itself.
//
// Nixon has hundreds of programs and has been keeping them in MS Word: hand
// colouring the variables, hand shortcuts for the symbols, then keying each one
// into the real machine to find out whether it even runs. Word cannot count a
// byte, cannot see a syntax error, and its autocorrect quietly turns a typed
// "-" into an en dash — the exact character the machine does not have.
//
// This page does the three things Word cannot: it counts the bytes as he types,
// it compiles and points at the character that is wrong, and it RUNS the
// program against his own worked example, so the loop through the real machine
// is only for confirming, not for finding typos.
//
// Everything is local: the library lives in this browser and in a JSON file he
// keeps himself. No account, no server.






const LIB_KEY = 'fx50.library';
const LIB_MODES = ['COMP', 'CMPLX', 'SD', 'REG', 'BASE'];
const LIB_TICK = 20000;          // instructions per slice while a program runs
// One colour per variable, handed out in the order the program first STORES
// into each — the same idea as the calculator's own editor.
const LIB_PALETTE = ['#f2b134', '#6ec1e4', '#8fd694', '#e88ab8', '#c0a3f0', '#f0956b', '#7fd8d0'];
// Keyword-ish runs that must not be read letter by letter, or the `C` of
// `Conjg(` would be coloured as the variable C.
const LIB_SKIP = [...SCI_NAMES,'ClrMemory', 'ClrStat', 'WhileEnd', 'Conjg(', 'IfEnd', 'While', 'Break', 'Goto',
  'Then', 'Else', 'Next', 'Step', 'Prog', 'Norm', 'Rnd(', 'Ran#', 'Rec(', 'Pol(', 'Abs(', 'NA', 'ε₀', 'σ',
  'minX', 'maxX', 'Ans', 'Lbl', 'For', 'Fix', 'Sci', 'Deg', 'Rad', 'Gra', 'To', 'If',
  'sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', 'arg(', 'nCr', 'nPr'];

// The tokens a keyboard cannot type. Everything NOT here has a plain-ASCII
// spelling that normalize() understands (-> ~ / * sqrt( cbrt( cos-1( pi <= >=
// <> ), so the bar only has to carry what is genuinely unreachable.
// A plain string is both the label and what it types. A pair is [label, text],
// where `|` marks where the caret should land and `@ASK` means "the next input
// prompt", the same shortcut the calculator's own editor has: it looks at what
// the program already asks for and gives you the next free variable.
const LIB_KEYS = [
  [['?→A:', '@ASK'], '→', '◢', ':', '²', '³', '⁻¹', '^(', '√(', '³√(', 'ˣ√(', 'ʳ', '°', 'π', 'i', '」', 'ᴇ'],
  [['If…IfEnd', 'If |:Then :IfEnd:'], ['Else', ':Else '],
    ['While…End', 'While |:WhileEnd:'], ['For…Next', 'For |1→A To 10:Next:'],
    'Break', ['Lbl', 'Lbl 1:'], ['Goto', 'Goto 1'],
    '⇒', '≠', '≥', '≤', 'Ans', 'Rnd(', 'Abs(', 'Prog '],
];
const LIB_ASK_VARS = ['A', 'B', 'C', 'D', 'X', 'Y', 'M'];
const LIB_EDIT_VARS = [...LIB_ASK_VARS, 'Z'];
const LIB_WORDS = [...LIB_SKIP, 'Σx²', 'Σx', 'σx', 'sx', 'x̄', 'sinh⁻¹(', 'cosh⁻¹(', 'tanh⁻¹(',
  'sinh(', 'cosh(', 'tanh(', 'sqrt(', 'cbrt(', 'arcsin(', 'arccos(', 'arctan(',
  'asin(', 'acos(', 'atan(', 'd/dx(', 'i', 'e', 'π'].sort((a,b)=>b.length-a.length);

const libScientificWords = new Set(SCI_NAMES);
function libWordAt(rest) {
  return LIB_WORDS.find(w=>rest.startsWith(w) || (w.length>1 && !libScientificWords.has(w)
    && !(['asin(','acos(','atan('].includes(w) && rest[0]==='A')
    && rest.slice(0,w.length).toLowerCase()===w.toLowerCase()));
}
function libVariableSpans(src) {
  const spans = [];
  for (let i=0;i<src.length;) {
    const rest = src.slice(i);
    const number = /^(?:\d+\.?\d*|\.\d+)(?:[Eᴇ][+-]?\d+)?/.exec(rest);
    const memory = /^M\s*[+−-](?=\s*(?::|◢|⇒|\n|$))/i.exec(rest);
    const word = libWordAt(rest);
    if (number || memory || word) { i += number ? number[0].length : memory ? memory[0].length : word.length; continue; }
    const c = src[i], upper = c.toUpperCase();
    if (LIB_EDIT_VARS.includes(upper) && (c === upper || !/[A-Za-z]/.test(src[i-1] || '') && !/[A-Za-z]/.test(src[i+1] || ''))) spans.push({start:i,end:i+1,variable:upper});

  const spans = libVariableSpans(src).filter(v=>v.start>=start && v.end<=end && (v.variable===from || v.variable===to));
  let result='', at=0;
  for (const v of spans) { result += src.slice(at,v.start)+(v.variable===from ? to : from); at=v.end; }

/** The variable an `?→` button should offer: the first one the program does not

function libNextAsk(src) {
  const used = new Set([...String(src).matchAll(/\?\s*→\s*([A-DXYM])/g)].map(m => m[1]));

  if (!libSave()) return libMsg('瀏覽器儲存失敗；請另存新檔備份。');
  const previous = libFileHandles.get(p.id);
  if (!saveAs && !previous) return libMsg('已儲存此程式；重開同一網址可繼續，沒有新增 JSON。');
  if (saveAs && typeof window.showSaveFilePicker !== 'function') {
    return libDownload([p], `${p.name.replace(/[^\p{L}\p{N}_-]/gu,'_') || 'fx50-program'}.json`);
  }
  try {
    const handle = saveAs ? await window.showSaveFilePicker({
      suggestedName: `${p.name.replace(/[^\p{L}\p{N}_-]/gu,'_') || 'fx50-program'}.json`,
      types: [{description:'Calculator program',accept:{'application/json':['.json']}}],
    }) : previous;
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(makeProgramFile([p],p.id),null,2));
    await writable.close();
    libFileHandles.set(p.id,handle);
    libMsg(`已儲存到 ${handle.name}；下次「儲存」會更新同一檔案。`);
  } catch(e) {
    libMsg(e.name === 'AbortError' ? '已取消另存；瀏覽器草稿仍已儲存。'
      : '檔案未能更新；瀏覽器草稿已儲存，請另存新檔備份。');
  }
}

const libEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const libId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const libNow = () => new Date().toISOString().slice(0, 10);

// ------------------------------------------------------------------ storage
function libLoad() {
  try {
    const text = localStorage.getItem(LIB_KEY);
    if (!text) return;
    const raw = JSON.parse(text);
    const adopted = libAdopt(raw);
    if (!adopted) throw new Error('無法讀取程式簿');
    libState.progs = adopted;
    libState.sel = libState.progs.some(p => p.id === raw.selected)
      ? raw.selected : (libState.progs[0] && libState.progs[0].id);
  } catch (e) {
    libState.saveOk = false;
    libMsg('讀取舊資料失敗；請匯入你保存的 JSON。未有覆蓋舊資料。');
  }
}
let libImportUndo = null;
function libUpdateImportUndo() {
  if (libImportUndo && libImportUndo.after !== JSON.stringify(libState.progs)) libImportUndo = null;
  const button = document.getElementById('lundoimport'); if (button) button.hidden = !libImportUndo;
}
function libRememberImport(previous, selected) {
  libImportUndo = { previous, selected, after: JSON.stringify(libState.progs) }; libUpdateImportUndo();
}
function libUndoImport() {
  libUpdateImportUndo(); if (!libImportUndo) return;
  const previous = libImportUndo; libImportUndo = null; libState.run = null;
  libState.progs = previous.previous; libState.sel = previous.selected;
  libSave(); libRender(); libMsg('已復原上次加入；原有程式及所選項目已恢復。');
}
function libSave() {
  libUpdateImportUndo();
  try {
    const text = JSON.stringify(makeProgramFile(libState.progs, libState.sel));
    localStorage.setItem(LIB_KEY, text);
    libState.saveOk = localStorage.getItem(LIB_KEY) === text;
  } catch (e) { libState.saveOk = false; }
  libSaveStatus();
  return libState.saveOk;
}
function libSaveStatus() {
  const el = document.getElementById('lsave');
  if (!el) return;
  el.textContent = libState.saveOk
    ? '已自動儲存在此瀏覽器；重開同一網址可繼續。另存 JSON 可備份／轉到 iPad。'
    : '⚠ 自動儲存失敗！離開前請「另存 JSON」，否則會遺失今次修改。';
  el.className = 'lsave' + (libState.saveOk ? '' : ' bad');
}
function libAdopt(data) {
  try {
    return readProgramRecords(data).map(p => ({ ...p, id: p.id || libId(),
      updated: p.updated || libNow() })).filter(p => typeof p.src === 'string'
        && (typeof (Array.isArray(data) ? data[0] : data.progs[0]) === 'object' || p.src.trim()));
  } catch { return null; }
}
function libDownload(progs, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([
    JSON.stringify(makeProgramFile(progs, libState.sel), null, 2)
  ], { type: 'application/json' }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  libMsg('已交給瀏覽器下載；請確認「下載項目／檔案」內有 JSON。未完成的草稿亦可再匯入編輯。');
}

// ------------------------------------------------------------- the text pane
function libHighlight(src, comments=[]) {
  let out = '', i = 0, next = 0;
  const colour = {};
  const variables = new Map(libVariableSpans(src).map(v=>[v.start,v]));
  const activeComments = comments.filter(n=>!n.detached && n.end>n.start);
  while (i < src.length) {
    const rest = src.slice(i);
    const kw = libWordAt(rest);
    // Stop at every annotation boundary so its background follows the exact range.
    const count = kw ? Math.min(kw.length,...activeComments.flatMap(n=>[n.start,n.end]).filter(p=>p>i).map(p=>p-i)) : 1;
    const marked = activeComments.some(n=>n.start<=i && n.end>i);
    const decorate = text => marked ? `<mark class="lcodecomment">${text}</mark>` : text;
    if (kw) { out += decorate(`<i style="color:#8d96a3;font-style:normal">${libEsc(src.slice(i,i+count))}</i>`); i += count; continue; }
    const c = src[i];
    if (variables.has(i)) {
      if (/→\s*$/.test(src.slice(0, i))) colour[c] = LIB_PALETTE[next++ % LIB_PALETTE.length];
      out += decorate(c.toUpperCase()==='Z' ? `<span class="ltempvar" title="暫用 Z；真機沒有此變數">${c}</span>` : `<span style="color:${colour[c] || '#c8ced6'}">${c}</span>`);
      i++; continue;
    }
    if (c === '◢' || c === '⇒' || c === ':') {
      out += decorate(`<b style="color:#f2b134">${libEsc(c)}</b>`); i++; continue;
    }
    out += decorate(libEsc(c)); i++;
  }
  return out + '\n';
}

function libPaint() {
  const ta = document.getElementById('lsrc'), hl = document.getElementById('lhl');
  if (!ta || !hl) return;
  hl.innerHTML = libHighlight(ta.value || '',libCur()?.comments || []);
  hl.scrollTop = ta.scrollTop;
  // Same gutter as the textarea, or the two layers wrap at different columns
  // once a scrollbar appears and the caret stops lining up with the text.
  hl.style.paddingRight = (10 + (ta.offsetWidth - ta.clientWidth)) + 'px';
}

// ------------------------------------------------------------------ the list
const libCur = () => libState.progs.find(p => p.id === libState.sel) || null;

function libBytes(p) {
  try { return byteCount(p.src || ''); } catch (e) { return 0; }
}

function libStatus(p) {
  if (!p.src.trim()) return { ok: null, msg: '仲未寫嘢' };
  if (libTemporaryVariables(p.src).length) return {ok:false,msg:'暫用變數 Z 尚未換回：真機只有 A B C D X Y M'};
  try { checkProgram(p.src); return { ok: true, msg: '編譯到' }; }
  catch (e) {
    const at = typeof e.progPos === 'number' ? libWhere(normalize(p.src), e.progPos) : '';
    return { ok: false, msg: (e.kind || e.message || '錯') + (at ? `（${at}）` : '') };
  }
}

/** "第 2 行第 9 個字" from a character offset, so an error points somewhere. */
function libWhere(src, pos) {
  const upto = src.slice(0, Math.max(0, pos));
  const line = upto.split('\n').length;
  const col = pos - (upto.lastIndexOf('\n') + 1) + 1;
  return `第 ${line} 行第 ${col} 個字`;
}

/** Describe both compile and runtime errors and map back to the editable source. */
function libErrorDetail(src, e) {
  const normalized = normalize(src);
  const pos = Math.max(0, Math.min(normalized.length, e.progPos ?? e.pos ?? 0));
  const start = normalized.lastIndexOf('\n', pos - 1) + 1;
  const end = normalized.indexOf('\n', pos);
  const line = normalized.slice(start, end < 0 ? normalized.length : end);
  let rawPos = 0;
  while (rawPos < src.length && normalize(src.slice(0, rawPos)).length < pos) rawPos++;
  return { message: `${e.kind || e.message || '錯'}（${libWhere(normalized, pos)}）`,
    excerpt: line + '\n' + ' '.repeat(pos - start) + '^', rawPos };
}
function libRunError(e) {
  const r = libState.run;
  const detail = libErrorDetail(r.src || '', e);
  r.err = detail.message; r.errorDetail = detail; r.done = true; r.ask = null; r.busy = false;
  libDrawRun();
}

  for (const field of ['inputs','outputs','example','caution']) document.getElementById(`lguide-${field}`).oninput = e => {
    p.guide = {...(p.guide || {}), [field]:e.target.value}; p.updated = libNow(); libSave();
  };
  document.getElementById('lsaveprogram').onclick = () => libSaveProgram(p);
  document.getElementById('lsingle').onclick = () => libSaveProgram(p,true);
  if(p.remarks) document.getElementById('lremarks').oninput = e => {
    p.remarks = e.target.value; p.updated = libNow(); libSave();
  };
  document.getElementById('lopen').onclick = () => {
    if(libTemporaryVariables(p.src).length) return libMsg('暫用 Z 尚未換回；請先改回合法變數。');
    if (!p.src.trim()) return libMsg('先寫一條程式。草稿可以儲存；載入時會檢查格式及容量。');
    try {
      sessionStorage.setItem('fx50.pending-program', JSON.stringify(makeProgramFile([p])));
      location.href = new URL((location.pathname || '').endsWith('/library.html') ? 'dist/fx-50FH-II.html' : 'fx-50FH-II.html', location.href).href;
    } catch { libMsg('此瀏覽器無法傳送；請另存此程式 JSON，然後在計數機 MODE 6 匯入。'); }
  };
  document.getElementById('lname').oninput = e => {
    p.name = e.target.value; p.updated = libNow(); libSave(); libRenderList();
  };
  document.getElementById('lnote').oninput = e => {
    p.note = e.target.value; p.updated = libNow(); libSave();
  };
  pane.querySelectorAll('.lmodes button').forEach(btn => {
    btn.onclick = () => { p.mode = btn.dataset.m; p.status = 'draft'; p.updated = libNow(); libSave(); libRender(); };
  });
  document.getElementById('ldel').onclick = ev => {
    const btn = ev.currentTarget;
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1'; btn.textContent = '再撳一次 = 刪走';
      setTimeout(() => { btn.dataset.armed = ''; btn.textContent = '刪除'; }, 4000);
      return;
    }
    libState.progs = libState.progs.filter(x => x.id !== p.id);
    libState.sel = null; libState.run = null; libSave(); libRender();
  };
  document.getElementById('lcopy').onclick = async ev => {
    try { await navigator.clipboard.writeText(normalize(p.src)); ev.currentTarget.textContent = '複製咗'; }
    catch (e) { ev.currentTarget.textContent = '複製唔到'; }
    setTimeout(() => { const b2 = document.getElementById('lcopy'); if (b2) b2.textContent = '複製程式'; }, 2500);
  };
  pane.querySelectorAll('.lkeys button').forEach(btn => {
    btn.onclick = () => {
      let k = btn.dataset.k, caret = -1;
      if (k === '@ASK') k = `?→${libNextAsk(ta.value)}:`;
      if (k.includes('|')) { caret = k.indexOf('|'); k = k.replace('|', ''); }
      const a = ta.selectionStart, z = ta.selectionEnd;
      ta.onbeforeinput?.();
      ta.value = ta.value.slice(0, a) + k + ta.value.slice(z);
      const at = a + (caret < 0 ? k.length : caret);
      ta.selectionStart = ta.selectionEnd = at;
      ta.focus();
      ta.oninput();
    };
  });
  document.getElementById('lrun').onclick = () => libStart(p);
  libPaint();
  libDrawRun();
}

// --------------------------------------------------------------- running one
// The engine hands back a generator that stops at every `?` and every `◢`, the
// same one the calculator itself steps through — so what shows here is what the
// machine would show, not a second implementation of the same program.
function libStart(p) {
  if(libTemporaryVariables(p.src).length) return libMsg('暫用 Z 尚未換回；真機只有 A B C D X Y M。草稿已保留。');
  if (!['COMP', 'CMPLX', 'SD', 'REG'].includes(p.mode)) return libMsg(`${p.mode} 模式尚未支援試行；草稿仍可保存。`);
  libState.ctx = new Ctx({ mode: p.mode, angle: p.angle || 'deg' });
  libState.run = { src: p.src, lines: [], gen: null, ask: null, done: false, err: '' };
  try {
    libState.run.gen = run(compile(p.src), libState.ctx, { tick: LIB_TICK });
    libDrawRun(); libStep();
  } catch (e) {
    libRunError(e);
  }
}

function libStep(value) {
  const r = libState.run;
  let step;
  try { step = r.gen.next(value); }
  catch (e) { return libRunError(e); }
  if (step.done) {
    // The machine does not blank the line when a program finishes: the last
    // statement it executed stays up with its value (SPEC §8e). Skip it only
    // when the program ended on a ◢ and it is already the row above.
    const last = libState.ctx.lastStmt || '';
    const end = fmtResult(libState.ctx.vars.Ans, libState.ctx, { noFrac: true });
    const val = end.text2 ? `${end.text}  +  ${end.text2}i` : end.text;
    const prev = r.lines[r.lines.length - 1];
    if (last && !(prev && prev.src === last && prev.val === val)) r.lines.push({ src: last, val });
    r.done = true; r.ask = null; return libDrawRun();
  }
  // A slice boundary, not an output: hand the event loop back and carry on, so
  // a program that loops for ever (Nixon writes those) does not freeze the page
  // and the stop button still answers.
  if (step.value.type === 'tick') {
    if (!r.busy) { r.busy = true; libDrawRun(); }
    r.slice = setTimeout(() => {
      if (!libState.run || libState.run !== r || r.done) return;
      r.slice = null; libStep();
    }, 0);
    return;
  }
  r.busy = false;
  if (step.value.type === 'input') { r.ask = step.value.name; return libDrawRun(); }
  const shown = fmtResult(step.value.value, libState.ctx, { noFrac: true });
  r.lines.push({ src: step.value.text || '', val: shown.text2
    ? `${shown.text}  +  ${shown.text2}i` : shown.text });
  r.ask = null;
  libDrawRun();
}

function libDrawRun() {
  const box = document.getElementById('lout');
  if (!box) return;
  const r = libState.run;
  if (!r) { box.innerHTML = ''; return; }
  const rows = r.lines.map(l =>
    `<div class="lo"><span class="lsrc">${libEsc(l.src)}</span><b>${libEsc(l.val)}</b></div>`).join('');
  const tail = r.err ? `<div class="lo err">${libEsc(r.err)}</div><pre class="lerrorcode">${libEsc(r.errorDetail?.excerpt || '')}</pre><button id="lerrorjump" class="sec">跳到出錯位置</button>`
    : r.ask ? `<div class="lo ask"><span class="lsrc">${libEsc(r.ask)}?</span>
        <input id="lask" placeholder="打個數，Enter" autocapitalize="off" autocorrect="off"></div>`
    : r.done ? '<div class="lo fin">— 行完 —</div>' : '';
  box.innerHTML = `<div class="lohead">行嘅結果 <button id="lstop" class="sec">停止</button></div>${rows}${tail}`
    + (!r.done && !r.ask && !r.busy ? '<button id="lnext" class="sec">繼續（EXE）</button>' : '');
  document.getElementById('lstop').onclick = () => { libState.run = null; libDrawRun(); };
  const jump = document.getElementById('lerrorjump');
  if (jump) jump.onclick = () => {
    const editor = document.getElementById('lsrc');
    const pos = r.errorDetail.rawPos;
    editor.focus(); editor.setSelectionRange(pos, Math.min(editor.value.length, pos + 1));
  };
  const ask = document.getElementById('lask');
  if (ask) {
    ask.focus();
    ask.onkeydown = ev => {
      if (ev.key !== 'Enter') return;
      const raw = ask.value.trim();
      let v;
      try {
        v = raw === '' ? libState.ctx.vars[r.ask]
          : calc(raw, new Ctx({ mode: libState.ctx.mode, angle: libState.ctx.angle })).value;
      } catch (e) { ask.value = ''; ask.placeholder = '呢個數打錯咗'; return; }
      r.lines.push({ src: r.ask + '?', val: raw === '' ? '（照舊）' : raw });
      libStep(v);
    };
  }
  const next = document.getElementById('lnext');
  if (next) next.onclick = () => libStep();
}

    rd.onload = () => {
      let got = null;
      try { got = libAdopt(JSON.parse(rd.result)); } catch (e) { /* not json */ }
      if (!got || !got.length) return libMsg('呢個檔案讀唔到（要係程式簿或者計數機匯出嗰個 JSON）。');
      // Added, never replaced: importing must not be able to wipe the library.
      const previous = JSON.parse(JSON.stringify(libState.progs)), selected = libState.sel;
      got = got.map(p => ({ ...p, id: libId() }));
      libState.progs = got.concat(libState.progs);
      libState.sel = got[0].id;
      libSave(); libRender();
      libRememberImport(previous, selected);
      libMsg(`匯入咗 ${got.length} 條（加落去，冇冚走原本嘅）。`);
    };
    rd.onerror = () => libMsg('讀取檔案失敗；已有程式未有更改。');
    rd.readAsText(f);
    ev.target.value = '';
  };

  libLoad();
  libRender();
  libSaveStatus();
}

if (typeof document !== 'undefined' && document.getElementById) libBoot();

// The bundle has no module system, so the packaged page hangs its testable
// parts here — the same trick ui.mjs uses for window.fx.
if (typeof window !== 'undefined') window.fx50lib = { libAdopt, libHighlight, libWhere, libNextAsk, libErrorDetail, libStart, libStep, libReplaceVariable, libSelectionBytes, libSaveProgram, libAddExamples, libSwapVariables, libTemporaryVariables, libVariableSpans };



</script>
